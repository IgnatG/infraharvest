# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# Release build (see .github/workflows/release.yml): binaries for Linux,
# macOS and Windows on amd64 and arm64, a checksum file signed with cosign
# (keyless, from GitHub Actions), SBOMs, and a container image.
version: 2
project_name: infraharvest

builds:
  - id: infraharvest
    main: .
    binary: infraharvest
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/IgnatG/infraharvest/internal/version.Version=v{{ .Version }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    # Reproducible: the same commit gives the same binaries.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"
  algorithm: sha256

sboms:
  - artifacts: archive

signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--bundle=${signature}", "${artifact}", "--yes"]
    artifacts: checksum

dockers_v2:
  - images:
      - ghcr.io/ignatg/infraharvest
    tags:
      - "v{{ .Version }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms: [linux/amd64, linux/arm64]
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: Turns existing cloud resources into Terraform configuration that plans with no changes
      org.opencontainers.image.source: "{{ .GitURL }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "v{{ .Version }}"
      org.opencontainers.image.licenses: AGPL-3.0-only

docker_signs:
  - args: ["sign", "${artifact}@${digest}", "--yes"]

release:
  prerelease: auto
  # Below the notes: how to install and verify this release. The notes
  # themselves are the version's section of CHANGELOG.md, which the release
  # workflow passes with --release-notes; without one, GitHub writes them
  # from the merged pull requests (changelog below).
  footer: |
    ## Install

    ```sh
    curl -fsSL https://raw.githubusercontent.com/IgnatG/infraharvest/main/install.sh | INFRAHARVEST_VERSION={{ .Tag }} sh
    docker pull ghcr.io/ignatg/infraharvest:{{ .Tag }}
    go install github.com/IgnatG/infraharvest@{{ .Tag }}
    ```

    The install script verifies the release's signature with cosign, which cloud shells don't include: see [Install](https://ignatg.github.io/infraharvest/install/) for how to add it there, and for the other ways to install.

    ## Verify

    The checksum file and the container image are signed with cosign, keyless, by the release workflow on `main`:

    ```sh
    cosign verify-blob \
      --certificate-identity "https://github.com/IgnatG/infraharvest/.github/workflows/release.yml@refs/heads/main" \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      --bundle infraharvest_{{ .Version }}_SHA256SUMS.sigstore.json infraharvest_{{ .Version }}_SHA256SUMS
    sha256sum --check --ignore-missing infraharvest_{{ .Version }}_SHA256SUMS

    cosign verify ghcr.io/ignatg/infraharvest:{{ .Tag }} \
      --certificate-identity "https://github.com/IgnatG/infraharvest/.github/workflows/release.yml@refs/heads/main" \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com
    ```

    Every release is described in [CHANGELOG.md](https://github.com/IgnatG/infraharvest/blob/{{ .Tag }}/CHANGELOG.md).

changelog:
  use: github-native
