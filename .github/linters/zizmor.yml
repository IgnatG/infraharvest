# zizmor configuration, read by MegaLinter's zizmor (the only place it runs). Each
# suppression is deliberate, scoped to one file and justified; anything not
# listed is a real finding to fix in the workflow.
rules:
  # cla.yml needs pull_request_target to write the signature store and set
  # the status on fork pull requests. It has no checkout step, so the pull
  # request's code never runs with the elevated token, and its only action
  # (actions/github-script, with an inline script) is pinned by SHA.
  dangerous-triggers:
    ignore:
      - cla.yml
