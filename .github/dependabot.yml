version: 2
# A cooldown holds back a version update until the release is a few days
# old, as malicious or yanked releases of a module, an action or an image
# are usually caught within days: 7 days for what is built into or runs
# with the release (Go modules, actions, the Dockerfile's images).
# Security updates aren't held back.
updates:
  # One grouped PR per week: every PR runs the full (heavy) CI.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      go-modules:
        patterns: ["*"]
    cooldown:
      default-days: 7

  # The Floci emulator image the end-to-end tests run against.
  - package-ecosystem: docker-compose
    directory: /e2e
    schedule:
      interval: weekly
    cooldown:
      default-days: 1

  # The workflows and the actions action/action.yml pins.
  - package-ecosystem: github-actions
    directories: ["/", "/action"]
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    cooldown:
      default-days: 7

  # The images the Dockerfile pins by tag and digest: the base images, and
  # Terraform and OpenTofu, whose binaries the release image copies.
  # The workflows' TERRAFORM_VERSION and TOFU_VERSION (test.yml,
  # action-test.yml, sandbox-*.yml) aren't tracked: bump them in the same PR.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  # The documentation site's build (docs/requirements.txt).
  - package-ecosystem: pip
    directory: /docs
    schedule:
      interval: weekly
    groups:
      docs:
        patterns: ["*"]
    cooldown:
      default-days: 7

  # The providers the permission templates and the sandbox estates use.
  - package-ecosystem: terraform
    directories: ["/permissions/*", "/e2e/testdata/sandbox/*"]
    schedule:
      interval: weekly
    groups:
      terraform:
        patterns: ["*"]
    cooldown:
      default-days: 7
