version: 2
# A cooldown holds back a version update until the release is a few days
# old, as malicious or yanked releases of a module, an action or an image
# are usually caught within days: 7 days for what is built into or runs
# with the release (Go modules, actions, the Dockerfile's images).
# Security updates aren't held back. Versions Dependabot can't read, in run
# steps, scripts and with: inputs, are checked by the weekly tool versions
# workflow (.github/workflows/tool-versions.yml), which opens an issue.
updates:
  # Go security updates only: a limit of 0 turns off the version updates,
  # which the weekly Go modules workflow opens as one PR instead
  # (.github/workflows/go-modules.yml), as checking about 240 modules in one
  # job outgrew Dependabot's time limit.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  # The Floci emulator image the end-to-end tests run against.
  - package-ecosystem: docker-compose
    directory: /e2e
    schedule:
      interval: weekly
    cooldown:
      default-days: 1

  # The workflows, the actions action/action.yml pins and the repository's
  # own composite actions (.github/actions).
  - package-ecosystem: github-actions
    directories: ["/", "/action", "/.github/actions/*"]
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    cooldown:
      default-days: 7

  # The images the Dockerfile pins by tag and digest: the base images, and
  # Terraform and OpenTofu, whose binaries the release image copies.
  # The setup action's terraform_version and tofu_version
  # (.github/actions/setup-engines) aren't tracked: bump them in the same PR;
  # the tests workflow fails until they match (check-versions.sh).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  # The documentation site's build: docs/requirements.in, compiled with
  # hashes into docs/requirements.txt.
  - package-ecosystem: pip
    directory: /docs
    schedule:
      interval: weekly
    groups:
      docs:
        patterns: ["*"]
    cooldown:
      default-days: 7

  # The providers the permission templates and the sandbox estates use.
  - package-ecosystem: terraform
    directories: ["/permissions/*", "/e2e/testdata/sandbox/*"]
    schedule:
      interval: weekly
    groups:
      terraform:
        patterns: ["*"]
    cooldown:
      default-days: 7
