name: tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: true
    - name: Check go.mod and go.sum are tidy
      run: go mod tidy -diff
    # Build only the shipped binary: `go build ./...` also links every
    # tests/* program, each a full binary with all providers, and fills the
    # runner's disk. `go test ./...` compiles every package anyway.
    - name: Build
      run: go build -o infraharvest .
    - name: Test
      run: go test ./...

  # Windows runners are slow to compile all providers, so test the packages
  # with OS-specific behaviour (file modes, paths, home directory lookup).
  test-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: true
    - name: Test
      run: go test ./terraformutils/... ./providers/aws/... ./providers/alicloud/...

  govulncheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: true
    - name: Build
      run: go build -o infraharvest .
    # Source mode needs more memory than a standard runner has for this
    # module. Binary mode checks the symbols compiled into the binary.
    - name: govulncheck
      run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 -mode binary ./infraharvest
