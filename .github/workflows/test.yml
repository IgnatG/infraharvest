name: Tests

# Every pull request, whatever its base: a pull request stacked on another
# one gets the same signal as one against main. A merge to main doesn't
# run them again, but for one that changes go.mod or go.sum: the caches
# pull requests restore are keyed on those, and only main's runs save
# them.
on:
  pull_request:
  push:
    branches: [main]
    paths: [go.mod, go.sum]
  workflow_dispatch:
  # Nightly, the e2e jobs alone, with OpenTofu (see the changes job).
  schedule:
  - cron: "23 3 * * *"

permissions:
  contents: read

# The module proxy drops a download now and then (stream error
# INTERNAL_ERROR); fetching that module from its repository instead keeps
# the job from failing on it. go.sum still checks what is fetched.
env:
  GOPROXY: https://proxy.golang.org|direct

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push makes a pull request's run moot; a run on main saves
  # caches, so it finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# A pull request that changes no core code (documentation, Markdown,
# licences, linter configuration, other workflows, the release files or the
# permission templates: see .github/scripts/changes.sh) skips the Go, e2e
# and build jobs, and runs the permissions job only for the templates. The
# required checks still report: test, e2e and checks gather the jobs below
# them and pass when each passed or was skipped, and a skipped job such as
# test-windows counts as passed. A push to main and workflow_dispatch run
# everything. The e2e jobs run with Terraform alone, but for
# workflow_dispatch, which runs them with OpenTofu too: a run with each
# engine would double the jobs every push queues for runners. So the
# nightly run on main runs the e2e jobs alone, every shard, with OpenTofu
# alone: what Terraform proves on each pull request, OpenTofu proves by
# the next morning, and no pull request waits for it.
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ github.event_name != 'schedule' && steps.diff.outputs.code || 'false' }}
      permissions: ${{ github.event_name != 'schedule' && steps.diff.outputs.permissions || 'false' }}
      # The e2e jobs: as code, and every night.
      e2e: ${{ github.event_name == 'schedule' && 'true' || steps.diff.outputs.code }}
    steps:
    - name: Check out the code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # The history for the merge base, without file contents.
        fetch-depth: 0
        filter: blob:none
        persist-credentials: false
    - name: Changes code
      id: diff
      env:
        BASE: ${{ github.event.pull_request.base.sha }}
        HEAD: ${{ github.event.pull_request.head.sha }}
      run: .github/scripts/changes.sh

  unit:
    name: go test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - name: Check out the code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Free disk space
      run: .github/scripts/free-disk-space.sh start
    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: true
    - name: Check go.mod and go.sum are tidy
      run: go mod tidy -diff
    # Ubuntu runners have ~14 GB free, too little for this module's
    # dependencies.
    - name: Wait for free disk space
      run: .github/scripts/free-disk-space.sh wait
    # Build only the shipped binary; `go test ./...` compiles every package
    # anyway.
    - name: Build
      run: go build -o infraharvest .
    # The gate's test of the OPA capabilities runs real policies through
    # conftest, and skips without it. The release is the one
    # internal/engine/gate/conftest_capabilities.go names: bump both
    # together, with the archive's checksum from the release's
    # checksums.txt.
    - name: Install conftest
      env:
        VERSION: 0.71.1
        SHA256: c3f6b2a753bd56e377a1e51a95ae3e057f926f2e9139f7d5b5dfbbaf810f7985
      run: |
        archive="$RUNNER_TEMP/conftest.tar.gz"
        curl -sSfL --retry 3 -o "$archive" \
          "https://github.com/open-policy-agent/conftest/releases/download/v${VERSION}/conftest_${VERSION}_Linux_x86_64.tar.gz"
        echo "$SHA256  $archive" | sha256sum -c -
        mkdir -p "$RUNNER_TEMP/conftest"
        tar -xzf "$archive" -C "$RUNNER_TEMP/conftest" conftest
        "$RUNNER_TEMP/conftest/conftest" --version
        echo "$RUNNER_TEMP/conftest" >> "$GITHUB_PATH"
    # Each package's statements its own tests run, for visibility: no
    # threshold. The total goes to the run's summary, the profile is
    # uploaded (go tool cover -html=coverage.out shows it). The tests run in
    # a random order: packages swap test hooks and keep process-wide caches,
    # and a test that passes only after another shows here. A failure prints
    # the seed; -shuffle=<seed> repeats the order.
    - name: Test
      run: go test -shuffle=on -coverprofile=coverage.out ./...
    - name: Coverage
      if: ${{ !cancelled() && hashFiles('coverage.out') != '' }}
      run: |
        go tool cover -func=coverage.out > "$RUNNER_TEMP/coverage.txt"
        {
          echo "### Coverage"
          echo
          echo "Statements covered by each package's own tests: $(tail -n 1 "$RUNNER_TEMP/coverage.txt" | awk '{print $NF}')"
        } >> "$GITHUB_STEP_SUMMARY"
    - name: Upload the coverage profile
      if: ${{ !cancelled() && hashFiles('coverage.out') != '' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: coverage
        path: coverage.out
        retention-days: 14

  # Accounts and projects import in parallel (--parallel), and listers,
  # discovery, the engine and the managed state backends run concurrent
  # work of their own: the state they share, under the race detector, with
  # the drift rules and decisions the drift runs read. Two providers keep
  # most builds small; the CLI and the MCP server, whose tests take every
  # provider's command, build with all three in a run of their own, so that
  # each command runs under it. The provider packages build on their own.
  race:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - name: Check out the code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Free disk space
      run: .github/scripts/free-disk-space.sh start
    # -race builds objects no other job shares: a cache of their own.
    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: false
    - name: Restore the Go cache
      id: cache
      uses: ./.github/actions/restore-go-cache
      with:
        name: race
    - name: Wait for free disk space
      run: .github/scripts/free-disk-space.sh wait
    - name: Race
      run: >-
        go test -race -tags minimal,aws,google
        ./internal/config/... ./internal/importer/ ./internal/selection/ ./internal/report/ ./internal/fsutil/...
        ./internal/discovery/... ./internal/ratelimit/... ./internal/engine/... ./internal/providers/...
        ./internal/managed/... ./internal/driftpolicy/...
    - name: Race, with every provider's command
      run: go test -race ./internal/cli/... ./internal/mcpserver/...
    - name: Save the Go cache
      if: github.event_name == 'push' && steps.cache.outputs.hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.cache.outputs.paths }}
        key: ${{ steps.cache.outputs.key }}

  # A required check: passes when go test and race passed, or were skipped.
  test:
    needs: [changes, unit, race]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Check the jobs passed
      env:
        NEEDS: ${{ toJSON(needs) }}
      run: |
        jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
        jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "$NEEDS" > /dev/null

  # Windows runners are slow to compile all providers, so test the packages
  # with OS-specific behaviour (file modes, paths, home directory lookup,
  # output, selection, decisions and drift report files, the MCP server's
  # path checks). The CLI and the MCP server build with two providers, as
  # in the race job.
  test-windows:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
    - name: Check out the code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    # Restore only, from main: a Windows cache is about 900 MB, and pull
    # requests saving one each filled the repository's cache.
    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: false
    - name: Restore the Go cache
      id: cache
      uses: ./.github/actions/restore-go-cache
      with:
        name: test
    - name: Test
      run: >-
        go test
        ./internal/engine/... ./internal/harvest/... ./internal/fsutil/... ./internal/managed/... ./internal/providers/aws/... ./internal/providers/azure/...
        ./internal/importer/... ./internal/config/... ./internal/selection/...
        ./internal/driftpolicy/... ./internal/report/...
    - name: Test the CLI and the MCP server
      run: go test -tags minimal,aws,google ./internal/cli/... ./internal/mcpserver/...
    - name: Save the Go cache
      if: github.event_name == 'push' && steps.cache.outputs.hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.cache.outputs.paths }}
        key: ${{ steps.cache.outputs.key }}

  # The whole module on macOS, which the release builds for but no other
  # job runs on. With main's cache it takes about five minutes; a pull
  # request that changes go.sum builds from an older cache.
  test-macos:
    name: macos test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
    - name: Check out the code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: false
    - name: Restore the Go cache
      id: cache
      uses: ./.github/actions/restore-go-cache
      with:
        name: test
    - name: Build
      run: go build -o infraharvest .
    - name: Test
      run: go test ./...
    - name: Save the Go cache
      if: github.event_name == 'push' && steps.cache.outputs.hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.cache.outputs.paths }}
        key: ${{ steps.cache.outputs.key }}

  govulncheck:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Check out the code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Free disk space
      run: .github/scripts/free-disk-space.sh start
    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: true
    # Ubuntu runners have ~14 GB free, too little for this module's
    # dependencies.
    - name: Wait for free disk space
      run: .github/scripts/free-disk-space.sh wait
    - name: Build
      run: go build -o infraharvest .
    # Binary mode checks the symbols compiled into the binary; source mode
    # needs more memory than a standard runner has for this module. Fails
    # unless .github/govulncheck-allowlist.txt covers every finding.
    - name: govulncheck
      run: .github/scripts/govulncheck-gate.sh ./infraharvest

  # Fuzzes the parsers of what people and clouds hand infraharvest (state,
  # selection files, filters, CloudFormation templates) and the secret
  # detectors, briefly: go test ./... runs only their seed inputs. go test
  # fuzzes one target at a time.
  # A failing input is uploaded; commit it under the package's
  # testdata/fuzz to keep it as a seed.
  fuzz:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Check out the code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: true
    - name: Fuzz
      run: |
        while read -r target pkg; do
          echo "::group::$target ($pkg)"
          # A new input is minimised for 60s by default, which would leave a
          # 30s run fuzzing almost nothing.
          go test -run='^$' -fuzz="^$target\$" -fuzztime=30s -fuzzminimizetime=1s "$pkg"
          echo "::endgroup::"
        done <<'EOF'
        FuzzSecretsInJSONString ./internal/engine/
        FuzzSecretsInHCL ./internal/engine/
        FuzzLiteralSecrets ./internal/engine/
        FuzzDriftNeverWritesSecrets ./internal/engine/
        FuzzDriftReportsNoSecrets ./internal/engine/
        FuzzParse ./internal/managed/
        FuzzLoad ./internal/selection/
        FuzzParseFilters ./internal/harvest/
        FuzzParseConvert ./pkg/cfn/
        EOF
    - name: Upload the failing inputs
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: fuzz-failures
        path: |
          internal/**/testdata/fuzz/
          pkg/**/testdata/fuzz/
        if-no-files-found: ignore

  # Runs the Terraform engine end to end against real Terraform and the
  # random provider (no cloud credentials needed), and plans the moved and
  # removed blocks of --regenerate with Terraform and OpenTofu.
  engine-integration:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Check out the code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: true
    # Terraform downloads itself; OpenTofu is installed.
    - name: Install OpenTofu
      uses: ./.github/actions/setup-engines
      with:
        engine: tofu
    - name: Test
      run: go test -tags integration ./internal/engine/...

  # Imports resources from Floci, a local AWS emulator, with the Terraform
  # engine and checks the generated configuration plans with no changes.
  # No AWS account or credentials are involved.
  # The same round trip with each engine: the output must work on both.
  # The tests that seed testdata/aws (TestAWSRoundTrip, TestAWSSelection,
  # TestAWSIncremental) take most of the time, so each runs on a runner of
  # its own, with its own Floci, TestAWSSelection with the tests of its
  # rules (TestAWSSelectionRules) and of --cfn-stack, from the command line
  # and the MCP server (TestAWSSelectionCloudFormation*). The options
  # tests (TestAWSOptions*), which import testdata/aws-options in an
  # account of their own many times over, run on two more: those of the
  # output (layout, modules, verify) and those of what is imported
  # (report, filters, exit codes). The drift
  # test (TestAWSDrift), which applies and changes its estate many times
  # over, runs on another, with the shorter drift tests of an S3 backend
  # (TestAWSDriftBackend) and of the MCP server's drift tools
  # (TestAWSDriftMCP), as do the tests of the MCP server's other tools
  # and of its drift tool with environments (TestAWSMCP), of its import
  # tool into an output again and with a configuration file
  # (TestAWSMCPImport), and of drift_accept's ordered rules and decisions
  # file (TestAWSDriftMCPRules), and the environments tests: the one
  # that imports two accounts many times over (TestAWSEnvironments),
  # with the test of a feature's data sources there
  # (TestAWSEnvironmentsData), and its drift with an S3 backend
  # (TestAWSEnvironmentsDrift) and --regenerate
  # (TestAWSEnvironmentsRegenerate), which each set the estate up as
  # TestAWSEnvironments leaves it, on two more; and the
  # tests of --regenerate's moved and removed blocks
  # (TestAWSRegenerate*), which each apply roots and generate them again
  # in accounts of their own. The other tests (TestAWSParallelAccounts,
  # TestAWSParallelRegions and TestAWSQuery, which create their resources
  # in other accounts, and TestAWSRegistryModuleMoves, which only plans)
  # share a last one.
  e2e-aws:
    name: e2e-aws (${{ matrix.engine }}, ${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        engine: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["terraform", "tofu"]' || github.event_name == 'schedule' && '["tofu"]' || '["terraform"]') }}
        shard: [round-trip, selection, incremental, options-output, options-input, drift, mcp, environments, environments-drift, environments-regenerate, regenerate, others]
        include:
        - shard: round-trip
          run: ^TestAWSRoundTrip$
          skip: ""
        - shard: selection
          run: ^TestAWSSelection(Rules|CloudFormation(MCP)?)?$
          skip: ""
        - shard: incremental
          run: ^TestAWSIncremental$
          skip: ""
        - shard: options-output
          run: ^TestAWSOptions(Layout|Modules)$
          skip: ""
        - shard: options-input
          run: ^TestAWSOptions(Report|Filters|ExitCodes)$
          skip: ""
        - shard: drift
          run: ^TestAWSDrift(Backend|MCP)?$
          skip: ""
        - shard: mcp
          run: ^TestAWS(MCP(Import)?|DriftMCPRules)$
          skip: ""
        - shard: environments
          run: ^TestAWSEnvironments(Data)?$
          skip: ""
        - shard: environments-drift
          run: ^TestAWSEnvironmentsDrift$
          skip: ""
        - shard: environments-regenerate
          run: ^TestAWSEnvironmentsRegenerate$
          skip: ""
        - shard: regenerate
          run: ^TestAWSRegenerate(Moves|Layout|Modules|CuratedModules)$
          skip: ""
        - shard: others
          run: ""
          skip: ^TestAWS(RoundTrip|Selection.*|Incremental|Options.*|Drift.*|MCP.*|Environments.*|Regenerate.*)$
    steps:
    - name: Check out the code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Free disk space
      run: .github/scripts/free-disk-space.sh start
    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: true
    # The gate runs the scanners it finds (G5): tflint must find nothing in
    # the generated configuration; trivy only reports.
    - name: Install the engine and scanners
      uses: ./.github/actions/setup-engines
      with:
        engine: ${{ matrix.engine }}
        scanners: "true"
    - name: Format
      env:
        ENGINE: ${{ matrix.engine }}
      run: $ENGINE fmt -check -recursive -diff e2e
    - name: Start Floci
      run: docker compose -f e2e/compose.yaml up -d --wait
    # The AWS provider is ~700 MB unpacked and is installed twice.
    - name: Wait for free disk space
      run: .github/scripts/free-disk-space.sh wait
    - name: Test
      env:
        # Fail, rather than skip, if the test has nothing to run against.
        INFRAHARVEST_E2E_REQUIRED: "1"
        AWS_ENDPOINT_URL: http://localhost:4566
        E2E_ENGINE: ${{ matrix.engine }}
        RUN: ${{ matrix.run }}
        SKIP: ${{ matrix.skip }}
      run: go test -tags e2e,minimal,aws -timeout 45m -v -run "$RUN" -skip "$SKIP" ./e2e/
    - name: Floci logs
      if: failure()
      run: docker compose -f e2e/compose.yaml logs
    # The sandbox test runs only by hand (sandbox-aws), so check here that
    # it builds, and run the tests of its checks (TestCheck*), which need
    # no account.
    - name: Vet the sandbox test
      if: matrix.engine == 'terraform' && matrix.shard == 'others'
      run: |
        go vet -tags e2e,sandbox,minimal,aws ./e2e/
        go test -tags e2e,sandbox,minimal,aws -run '^TestCheck' ./e2e/

  # TestGoogleIncremental adds to the estate the other tests import, and
  # TestGoogleDrift and TestGoogleEnvironments change it, so each runs on a
  # runner of its own, with its own floci-gcp, as does the round trip; the
  # other tests share a fifth.
  e2e-google:
    name: e2e-google (${{ matrix.engine }}, ${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        engine: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["terraform", "tofu"]' || github.event_name == 'schedule' && '["tofu"]' || '["terraform"]') }}
        shard: [round-trip, incremental, drift, environments, others]
        include:
        - shard: round-trip
          run: ^TestGoogleRoundTrip$
          skip: ""
        - shard: incremental
          run: ^TestGoogleIncremental$
          skip: ""
        - shard: drift
          run: ^TestGoogleDrift$
          skip: ""
        - shard: environments
          run: ^TestGoogleEnvironments$
          skip: ""
        - shard: others
          run: ^TestGoogle
          skip: ^TestGoogle(RoundTrip|Incremental|Drift|Environments)$
    steps:
    - name: Check out the code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: true
    - name: Install the engine and scanners
      uses: ./.github/actions/setup-engines
      with:
        engine: ${{ matrix.engine }}
    - name: Start floci-gcp
      run: |
        docker compose -f e2e/compose.yaml --profile google up -d floci-gcp
        for _ in $(seq 60); do curl -s -o /dev/null http://localhost:4588/ && exit 0; sleep 2; done
        echo "floci-gcp didn't start"; exit 1
    - name: Test
      env:
        # Fail, rather than skip, if the test has nothing to run against.
        INFRAHARVEST_E2E_REQUIRED: "1"
        INFRAHARVEST_GOOGLE_ENDPOINT: http://localhost:4588
        E2E_ENGINE: ${{ matrix.engine }}
        RUN: ${{ matrix.run }}
        SKIP: ${{ matrix.skip }}
      run: go test -tags e2e,minimal,google -timeout 35m -v -run "$RUN" -skip "$SKIP" ./e2e/
    - name: floci-gcp logs
      if: failure()
      run: docker compose -f e2e/compose.yaml --profile google logs floci-gcp
    # The sandbox test runs only by hand (sandbox-google), so check here
    # that it builds.
    - name: Vet the sandbox test
      if: matrix.engine == 'terraform' && matrix.shard == 'others'
      run: go vet -tags e2e,sandbox,minimal,google ./e2e/

  # TestAzureIncremental adds to the estate the other tests import, and
  # TestAzureDrift changes it, so each runs on a runner of its own, with
  # its own floci-az, as does the round trip, and TestAzureEnvironments,
  # which takes merged environments through the whole chain; the other
  # tests share a fifth.
  e2e-azure:
    name: e2e-azure (${{ matrix.engine }}, ${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        engine: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["terraform", "tofu"]' || github.event_name == 'schedule' && '["tofu"]' || '["terraform"]') }}
        shard: [round-trip, incremental, drift, environments, others]
        include:
        - shard: round-trip
          run: ^TestAzureRoundTrip$
          skip: ""
        - shard: incremental
          run: ^TestAzureIncremental$
          skip: ""
        - shard: drift
          run: ^TestAzureDrift$
          skip: ""
        - shard: environments
          run: ^TestAzureEnvironments$
          skip: ""
        - shard: others
          run: ^TestAzure
          skip: ^TestAzure(RoundTrip|Incremental|Drift|Environments)$
    steps:
    - name: Check out the code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: true
    - name: Install the engine and scanners
      uses: ./.github/actions/setup-engines
      with:
        engine: ${{ matrix.engine }}
    # The azurerm provider and the listers reach floci-az over HTTPS: trust
    # the CA it generates at startup.
    - name: Start floci-az
      run: |
        docker compose -f e2e/compose.yaml --profile azure up -d floci-az
        for _ in $(seq 60); do
          if curl -sf http://localhost:4577/_floci/tls-cert -o floci-az.crt && grep -q "BEGIN CERTIFICATE" floci-az.crt; then
            sudo cp floci-az.crt /usr/local/share/ca-certificates/floci-az.crt
            sudo update-ca-certificates
            exit 0
          fi
          sleep 2
        done
        echo "floci-az didn't start"; exit 1
    - name: Test
      env:
        # Fail, rather than skip, if the test has nothing to run against.
        INFRAHARVEST_E2E_REQUIRED: "1"
        E2E_AZURE_METADATA_HOST: localhost:4577
        E2E_ENGINE: ${{ matrix.engine }}
        RUN: ${{ matrix.run }}
        SKIP: ${{ matrix.skip }}
      run: go test -tags e2e,minimal,azure -timeout 40m -v -run "$RUN" -skip "$SKIP" ./e2e/
    - name: floci-az logs
      if: failure()
      run: docker compose -f e2e/compose.yaml --profile azure logs floci-az
    # The sandbox test runs only by hand (sandbox-azure), so check here
    # that it builds.
    - name: Vet the sandbox test
      if: matrix.engine == 'terraform' && matrix.shard == 'others'
      run: go vet -tags e2e,sandbox,minimal,azure ./e2e/

  # A required check, whatever the shards: passes when every e2e job passed,
  # or was skipped.
  e2e:
    needs: [changes, e2e-aws, e2e-google, e2e-azure]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Check the jobs passed
      env:
        NEEDS: ${{ toJSON(needs) }}
      run: |
        jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
        jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "$NEEDS" > /dev/null

  # The read-only permission templates must stay formatted and valid, and
  # so must the sandboxes' estates and bootstraps, which apply them and
  # otherwise run only by hand.
  permissions:
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.permissions == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Check out the code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install the engine and scanners
      uses: ./.github/actions/setup-engines
      with:
        engine: terraform
    - name: Format
      run: terraform fmt -check -recursive -diff permissions e2e/testdata/sandbox
    - name: Validate
      run: |
        # Each provider is downloaded once.
        export TF_PLUGIN_CACHE_DIR="$RUNNER_TEMP/plugins"
        mkdir -p "$TF_PLUGIN_CACHE_DIR"
        for dir in permissions/*/ e2e/testdata/sandbox/*/; do
          terraform -chdir="$dir" init -backend=false -input=false
          terraform -chdir="$dir" validate
        done
    # The templates' own tests, against a mock provider: what the role
    # trusts, and the inputs refused.
    - name: Test
      run: |
        export TF_PLUGIN_CACHE_DIR="$RUNNER_TEMP/plugins"
        for dir in permissions/*/; do
          if [ -d "${dir}tests" ]; then
            terraform -chdir="$dir" test
          fi
        done
    - name: Policy JSON
      run: jq empty permissions/aws/deny-data-reads.json

  # The built-in catalogue's types, arguments, nested blocks and defaults
  # must be in the schemas of the providers' newest releases, the ones
  # generated roots pin: a rename in the provider would otherwise leave an
  # omit or a default doing nothing.
  catalogue-schemas:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Check out the code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: true
    - name: Install the engine and scanners
      uses: ./.github/actions/setup-engines
      with:
        engine: terraform
    - name: Provider schemas
      run: |
        dir="$RUNNER_TEMP/schemas"
        mkdir -p "$dir/root"
        printf '%s\n' 'terraform {' '  required_providers {' \
          '    aws     = { source = "hashicorp/aws" }' \
          '    azapi   = { source = "Azure/azapi" }' \
          '    azurerm = { source = "hashicorp/azurerm" }' \
          '    google  = { source = "hashicorp/google" }' '  }' '}' > "$dir/root/main.tf"
        terraform -chdir="$dir/root" init -backend=false -input=false
        terraform -chdir="$dir/root" providers schema -json > "$dir/schemas.json"
        terraform -chdir="$dir/root" version -json > "$dir/versions.json"
        jq -r '.provider_selections | to_entries[] | "\(.key) \(.value)"' "$dir/versions.json"
        echo "INFRAHARVEST_PROVIDER_SCHEMAS=$dir" >> "$GITHUB_ENV"
    - name: Check the catalogue against them
      run: go test -run '^TestCatalogueMatchesProviderSchemas$' -v ./internal/catalogue/

  # `-tags minimal,<provider>` builds only the named providers; check the
  # registry works with none and with one, and that a build links no SDK
  # of a cloud it leaves out.
  build-tags:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Check out the code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: true
    - name: No providers
      run: |
        go vet -tags minimal ./internal/cli/...
        go build -tags minimal -o infraharvest-none .
        ./infraharvest-none import --help
    - name: AWS only
      run: |
        go build -tags minimal,aws -o infraharvest-aws .
        ./infraharvest-aws import aws --help > /dev/null
        # import's help lists its provider subcommands, one per line.
        if ! ./infraharvest-aws import --help | grep -Eq '^ +aws +'; then
          echo "::error::aws should be listed under import in a minimal,aws build"; exit 1
        fi
        if ./infraharvest-aws import --help | grep -Eq '^ +google +'; then
          echo "::error::google should not be compiled into a minimal,aws build"; exit 1
        fi
    - name: No other cloud's SDK
      run: |
        # The listers and the stores --managed-state reads with come with
        # their provider, so a build links only its own clouds' SDKs.
        aws='github.com/aws/aws-sdk-go-v2|github.com/aws/smithy-go'
        azure='github.com/Azure/azure-sdk-for-go'
        google='google.golang.org/api|cloud.google.com/go'
        check() {
          deps=$(go list -deps -tags "$1" .)
          linked=$(echo "$deps" | grep -E "$2" || true)
          if [ -n "$linked" ]; then
            echo "::error::-tags $1 links $(echo "$linked" | wc -l) packages of an SDK it should not, such as $(echo "$linked" | head -1)"; exit 1
          fi
          echo "-tags $1: $(echo "$deps" | wc -l) packages, none of another cloud's SDK"
        }
        check minimal "$aws|$azure|$google"
        check minimal,aws "$azure|$google"
        check minimal,azure "$aws|$google"
        check minimal,google "$aws|$azure"

  # The release's other targets, which no job above compiles: the full
  # module for linux/arm64 and windows/arm64 (test-windows builds only some
  # packages, and test-macos covers darwin/arm64), built and vetted, so that
  # a dependency bump that breaks one shows on the pull request, not at the
  # release.
  cross:
    name: ${{ matrix.goos }}/${{ matrix.goarch }} build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
        - goos: linux
          goarch: arm64
        - goos: windows
          goarch: arm64
    steps:
    - name: Check out the code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Free disk space
      run: .github/scripts/free-disk-space.sh start
    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: false
    - name: Restore the Go cache
      id: cache
      uses: ./.github/actions/restore-go-cache
      with:
        name: ${{ matrix.goos }}-${{ matrix.goarch }}
    - name: Wait for free disk space
      run: .github/scripts/free-disk-space.sh wait
    - name: Build
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: "0"
      run: go build ./...
    - name: Vet
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: "0"
      run: go vet ./...
    - name: Save the Go cache
      if: github.event_name == 'push' && steps.cache.outputs.hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.cache.outputs.paths }}
        key: ${{ steps.cache.outputs.key }}

  # A required check: passes when the other Go and Terraform checks passed,
  # or were skipped. Not the fuzzing, which can find an input a pull request
  # didn't bring: it reports on its own.
  checks:
    needs: [changes, test-windows, test-macos, govulncheck, engine-integration, permissions, catalogue-schemas, build-tags, cross]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Check the jobs passed
      env:
        NEEDS: ${{ toJSON(needs) }}
      run: |
        jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
        jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "$NEEDS" > /dev/null

  # Every Go file carries the AGPL-3.0-only licence line, no tracked file
  # uses the names in scripts/check-names.sh, and every file has a copyright
  # and a licence, from its own header or from REUSE.toml, with every licence
  # in LICENSES/. The pre-commit hook runs the same scripts
  # (scripts/fast-checks.sh); the linters run in the megalinter workflow.
  repository:
    name: licences and names
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Check out the code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # The whole history for the root commit check, without the contents
        # of past commits: only the checked-out commit's files are fetched.
        fetch-depth: 0
        filter: blob:none
        persist-credentials: false
    - name: Licence headers
      run: scripts/check-headers.sh
    # The repository's history grows from one root commit. A branch with an
    # unrelated history (another repository's, or one started again from
    # scratch) brings more roots, and merging it would graft that history
    # onto main: stop it here.
    - name: Root commit
      if: ${{ !cancelled() }}
      env:
        ROOT: 6aa52900d5c930fa2cd34091e24995b3b00f4771
      run: |
        roots=$(git rev-list --max-parents=0 HEAD)
        if [ "$roots" != "$ROOT" ]; then
          echo "::error::the history must grow from the single root commit $ROOT, but its roots are:"
          echo "$roots"
          exit 1
        fi
    - name: Names
      if: ${{ !cancelled() }}
      run: scripts/check-names.sh
    # The workflows test with the engines the release image ships.
    - name: Engine and scanner versions
      if: ${{ !cancelled() }}
      run: .github/scripts/check-versions.sh
    - name: reuse lint
      if: ${{ !cancelled() }}
      uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0
