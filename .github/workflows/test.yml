name: tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
    # Ubuntu runners have ~14 GB free, too little for this module's dependencies.
    - name: Free disk space
      if: runner.os == 'Linux'
      run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: true
    - name: Check go.mod and go.sum are tidy
      run: go mod tidy -diff
    # Build only the shipped binary: `go build ./...` also links every
    # tests/* program, each a full binary with all providers, and fills the
    # runner's disk. `go test ./...` compiles every package anyway.
    - name: Build
      run: go build -o infraharvest .
    - name: Test
      run: go test ./...

  # Windows runners are slow to compile all providers, so test the packages
  # with OS-specific behaviour (file modes, paths, home directory lookup).
  test-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: true
    - name: Test
      run: go test ./engine/... ./terraformutils/... ./providers/aws/... ./providers/alicloud/...

  govulncheck:
    runs-on: ubuntu-latest
    steps:
    # Ubuntu runners have ~14 GB free, too little for this module's dependencies.
    - name: Free disk space
      if: runner.os == 'Linux'
      run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: true
    - name: Build
      run: go build -o infraharvest .
    # Binary mode checks the symbols compiled into the binary; source mode
    # needs more memory than a standard runner has for this module. Fails
    # unless .github/govulncheck-allowlist.txt covers every finding.
    - name: govulncheck
      run: .github/scripts/govulncheck-gate.sh ./infraharvest

  # Runs the Terraform engine end to end against real Terraform and the
  # random provider (no cloud credentials needed).
  engine-integration:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: true
    - name: Test
      run: go test -tags integration ./engine/...

  # The read-only permission templates must stay formatted and valid.
  permissions:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_wrapper: false
    - name: Format
      run: terraform fmt -check -recursive -diff permissions
    - name: Validate
      run: |
        for dir in permissions/*/; do
          terraform -chdir="$dir" init -backend=false -input=false
          terraform -chdir="$dir" validate
        done
    - name: Policy JSON
      run: jq empty permissions/aws/deny-data-reads.json


  # `-tags minimal,<provider>` builds only the named providers; check the
  # registry works with none and with one.
  build-tags:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: true
    - name: No providers
      run: |
        go vet -tags minimal ./cmd/
        go build -tags minimal -o infraharvest-none .
        ./infraharvest-none import --help
    - name: AWS only
      run: |
        go build -tags minimal,aws -o infraharvest-aws .
        ./infraharvest-aws import aws --help > /dev/null
        if ./infraharvest-aws import google --help 2>/dev/null | grep -q "Import current state to Terraform configuration from Google"; then
          echo "::error::google should not be compiled into a minimal,aws build"; exit 1
        fi
