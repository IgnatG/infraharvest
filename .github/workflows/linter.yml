name: linter

on:
  push:
    branches:
    - master
    - legacy
  pull_request:
    branches:
    - master
    - legacy

permissions:
  contents: read
  pull-requests: write # reviewdog posts lint findings as review comments

jobs:
  linter:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: golangci-lint
      uses: reviewdog/action-golangci-lint@284129a3ac23bc5d8ac1522e0b6511df74a8836d # v2.10.2
      with:
        go_version_file: go.mod
        github_token: ${{ secrets.GITHUB_TOKEN }}
        tool_name: golangci-lint
