name: linter

# Lint only lines changed by a pull request. The inherited Terraformer code
# has ~400 findings from current linters; fix them as code is touched,
# and keep new code clean.
on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # reviewdog posts lint findings as review comments

jobs:
  linter:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # reviewdog falls back to `git fetch` when a PR diff is too large for
        # the GitHub API; the token here only reads code and posts reviews.
        persist-credentials: true
        fetch-depth: 0
    - name: golangci-lint
      uses: reviewdog/action-golangci-lint@284129a3ac23bc5d8ac1522e0b6511df74a8836d # v2.10.2
      with:
        go_version_file: go.mod
        github_token: ${{ secrets.GITHUB_TOKEN }}
        tool_name: golangci-lint
        golangci_lint_version: v2.14.0
        reporter: github-pr-review
        filter_mode: added
        fail_level: error
