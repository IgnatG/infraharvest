name: Links

# Checks the external links in the Markdown files, with lychee
# (https://lychee.cli.rs). It is not a required check: a site that is down
# or rate-limits the runner shouldn't block an unrelated pull request.
# MegaLinter's lychee checks only the links within the repository, which
# can't fail that way. Runs on pull requests that change Markdown, every
# week (catching links that broke since) and on demand.
on:
  pull_request:
    paths: ["**/*.md", ".github/workflows/links.yml"]
  schedule:
    - cron: "11 6 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lychee:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The same exclusions as MegaLinter's (.mega-linter.yml). The token
      # (the action's default) keeps github.com from rate-limiting the
      # runner.
      - name: Check the links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          fail: true
          args: >-
            --no-progress
            --exclude-loopback
            --max-retries 5
            --retry-wait-time 5
            --timeout 30
            --exclude '(\$\{|\$%7B|\{\{)'
            './**/*.md'
