name: macos

# Builds and tests on macOS after each merge to main, every week, and on
# demand, rather than on every pull request: the macOS build of this
# module takes about 40 minutes. The release builds the macOS binaries on
# Linux either way.
on:
  push:
    branches: [main]
  schedule:
  - cron: "37 3 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: true
    - name: Build
      run: go build -o infraharvest .
    - name: Test
      run: go test ./...
