name: Action test

# Runs the GitHub Action (action/) with a binary built from this commit
# against the Floci emulators of AWS, Azure and Google Cloud: no cloud account is
# involved. It also runs when the CLI changes, since the action relies on
# its flags, report path and exit codes. It imports with Terraform and
# OpenTofu, through a selection file, with environments that share roots,
# and with managed-state; checks drift on the roots once they're applied,
# per environment for roots environments share; and checks what the action
# would open its pull request with. On main, once the repository lets
# workflows open pull requests, it opens a real one too (see the
# pull-request job), and commits to a branch (the commit job).
on:
  pull_request:
    paths:
      - action/**
      - internal/cli/**
      - internal/engine/**
      - internal/importer/**
      - internal/report/**
      - internal/selection/**
      - main.go
      - go.mod
      - go.sum
      - e2e/compose.yaml
      - e2e/testdata/azure/**
      - e2e/testdata/google/**
      - .github/workflows/action-test.yml
      - .github/scripts/free-disk-space.sh
      - .github/actions/setup-engines/**
  # Only the pull-request and commit jobs run on a push: a pull request ran
  # the rest.
  push:
    branches: [main]
    paths:
      - action/**
      - .github/workflows/action-test.yml
  workflow_dispatch:

permissions:
  contents: read

# The module proxy drops a download now and then (stream error
# INTERNAL_ERROR); fetching that module from its repository instead keeps
# the job from failing on it. go.sum still checks what is fetched.
env:
  GOPROXY: https://proxy.golang.org|direct

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  action:
    # Terraform's keeps the name the job had before OpenTofu's.
    name: ${{ matrix.engine == 'terraform' && 'action' || format('action ({0})', matrix.engine) }}
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        engine: [terraform, tofu]
    env:
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      ENGINE: ${{ matrix.engine }}
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space
        run: .github/scripts/free-disk-space.sh start
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Wait for free disk space
        run: .github/scripts/free-disk-space.sh wait
      - name: Build
        run: go build -tags minimal,aws -o "$RUNNER_TEMP/infraharvest" .
      - name: Install the engine and scanners
        uses: ./.github/actions/setup-engines
        with:
          engine: ${{ matrix.engine }}
      - name: Start Floci and create a queue
        run: |
          docker compose -f e2e/compose.yaml up -d --wait
          aws sqs create-queue --queue-name infraharvest-action
      - name: Run the action
        id: infraharvest
        uses: ./action
        with:
          binary: ${{ runner.temp }}/infraharvest
          engine: ${{ matrix.engine }}
          provider: aws
          services: sqs
          regions: us-east-1
          out: ${{ runner.temp }}/out
      - name: Check the output
        env:
          EXIT_CODE: ${{ steps.infraharvest.outputs.exit-code }}
          REPORT: ${{ steps.infraharvest.outputs.report }}
        run: |
          test "$EXIT_CODE" = 0
          test -f "$REPORT"
          grep -r --include=imports.tf "aws_sqs_queue" "$RUNNER_TEMP/out"
      # Drift needs applied roots: apply them, then change the queue in the
      # emulator, as someone would in the console. The state goes outside
      # the roots, as a backend keeps it: a state file in a root is one to
      # commit, which the import's checks refuse.
      - name: Apply the roots and tag the queue
        run: |
          mkdir -p "$RUNNER_TEMP/state"
          n=0
          find "$RUNNER_TEMP/out" -name imports.tf -not -path '*/.terraform/*' | while IFS= read -r file; do
            root=$(dirname "$file")
            n=$((n + 1))
            printf 'terraform {\n  backend "local" {\n    path = "%s"\n  }\n}\n' "$RUNNER_TEMP/state/$n.tfstate" > "$root/backend.tf"
            "$ENGINE" -chdir="$root" init -input=false
            "$ENGINE" -chdir="$root" apply -input=false -auto-approve
          done
          url=$(aws sqs get-queue-url --queue-name infraharvest-action --query QueueUrl --output text)
          aws sqs tag-queue --queue-url "$url" --tags Drift=console
      # A scheduled run on a fresh checkout: the roots are there, infraharvest's
      # checkpoints (gitignored) are not, and a queue is new. Drift is checked
      # first, and only reported: the code stays as it is, and the decisions
      # file is written outside out, where the repository keeps it.
      - name: Add a queue
        run: |
          # The resources' files, whose blocks adding to the roots leaves as
          # they are: new ones go after them.
          mkdir "$RUNNER_TEMP/before"
          cd "$RUNNER_TEMP/out"
          find . -name '*.tf' -not -path '*/.terraform/*' \
            -not -name imports.tf -not -name data.tf -not -name variables.tf -not -name locals.tf \
            -exec cp --parents {} "$RUNNER_TEMP/before" \;
          test -n "$(find "$RUNNER_TEMP/before" -name '*.tf')"
          rm -rf "$RUNNER_TEMP/out/.infraharvest"
          mkdir -p "$RUNNER_TEMP/decisions"
          aws sqs create-queue --queue-name infraharvest-action-new
      - name: Run the action again
        id: again
        uses: ./action
        with:
          binary: ${{ runner.temp }}/infraharvest
          engine: ${{ matrix.engine }}
          provider: aws
          services: sqs
          regions: us-east-1
          out: ${{ runner.temp }}/out
          drift: report
          drift-decisions: ${{ runner.temp }}/decisions/drift.yaml
      - name: Check the drift was reported
        env:
          DRIFT_FOUND: ${{ steps.again.outputs.drift-found }}
          DRIFT_EXIT_CODE: ${{ steps.again.outputs.drift-exit-code }}
          DRIFT_REPORT: ${{ steps.again.outputs.drift-report }}
        run: |
          test "$DRIFT_EXIT_CODE" = 4
          test "$DRIFT_FOUND" = true
          test -f "$DRIFT_REPORT"
          jq -e '[.changes[] | select(.attribute == "tags.Drift" and .outcome == "kept")] | length == 1' "$RUNNER_TEMP/out/report/drift.json"
          grep -q "decision: undecided" "$RUNNER_TEMP/decisions/drift.yaml"
          test ! -e "$RUNNER_TEMP/out/drift.yaml"
      - name: Check the new queue was added
        env:
          EXIT_CODE: ${{ steps.again.outputs.exit-code }}
        run: |
          test "$EXIT_CODE" = 0
          # What each file had stays at its start; what follows, and the
          # files that are new, is what was added.
          added=""
          cd "$RUNNER_TEMP/out"
          while IFS= read -r file; do
            if [ -f "$RUNNER_TEMP/before/$file" ]; then
              size=$(wc -c < "$RUNNER_TEMP/before/$file")
              cmp -n "$size" "$RUNNER_TEMP/before/$file" "$file"
              added+=$(tail -c +"$((size + 1))" "$file")
            else
              added+=$(cat "$file")
            fi
          done < <(find . -name '*.tf' -not -path '*/.terraform/*' \
            -not -name imports.tf -not -name data.tf -not -name variables.tf -not -name locals.tf)
          grep -q "infraharvest-action-new" <<< "$added"
          ! grep -q '"infraharvest-action"' <<< "$added"
      # Review the decisions file as a person would: accept the change.
      - name: Decide to accept the drift
        run: |
          sed -i 's/decision: undecided/decision: accept/' "$RUNNER_TEMP/decisions/drift.yaml"
      - name: Accept the drift
        id: accept
        uses: ./action
        with:
          binary: ${{ runner.temp }}/infraharvest
          engine: ${{ matrix.engine }}
          import: "false"
          out: ${{ runner.temp }}/out
          drift: accept
          drift-decisions: ${{ runner.temp }}/decisions/drift.yaml
          # Matches nothing here: the file's decision stands.
          drift-accept: |
            # Security groups are reviewed by hand.
            keep type=aws_security_group
      - name: Check the drift was accepted
        env:
          EXIT_CODE: ${{ steps.accept.outputs.exit-code }}
          DRIFT_FOUND: ${{ steps.accept.outputs.drift-found }}
          DRIFT_EXIT_CODE: ${{ steps.accept.outputs.drift-exit-code }}
        run: |
          test -z "$EXIT_CODE"
          test "$DRIFT_EXIT_CODE" = 0
          test "$DRIFT_FOUND" = false
          jq -e '[.changes[] | select(.attribute == "tags.Drift" and .outcome == "written")] | length == 1' "$RUNNER_TEMP/out/report/drift.json"
          grep -rq --include='*.tf' -E 'Drift += +"console"' "$RUNNER_TEMP/out"
      # The steady state: the roots applied with what the runs added, their
      # import blocks deleted, and infraharvest's checkpoints not checked
      # out. Only their state, kept outside them, says what they have: a
      # scheduled run finds it through managed-state, and adds only what is
      # new.
      - name: Apply the roots, delete their import blocks and add a queue
        id: applied
        run: |
          find "$RUNNER_TEMP/out" -name imports.tf -not -path '*/.terraform/*' | while IFS= read -r file; do
            "$ENGINE" -chdir="$(dirname "$file")" apply -input=false -auto-approve
            rm "$file"
          done
          rm -rf "$RUNNER_TEMP/out/.infraharvest" "$RUNNER_TEMP/before"
          mkdir "$RUNNER_TEMP/before"
          cd "$RUNNER_TEMP/out"
          find . -name '*.tf' -not -path '*/.terraform/*' \
            -not -name imports.tf -not -name data.tf -not -name variables.tf -not -name locals.tf \
            -exec cp --parents {} "$RUNNER_TEMP/before" \;
          echo "states=$(find "$RUNNER_TEMP/state" -name '*.tfstate' | sort | paste -sd, -)" >> "$GITHUB_OUTPUT"
          aws sqs create-queue --queue-name infraharvest-action-managed
      - name: Run the action on the applied roots
        id: managed
        uses: ./action
        with:
          binary: ${{ runner.temp }}/infraharvest
          engine: ${{ matrix.engine }}
          provider: aws
          services: sqs
          regions: us-east-1
          out: ${{ runner.temp }}/out
          managed-state: ${{ steps.applied.outputs.states }}
      - name: Check only the new queue was added
        env:
          EXIT_CODE: ${{ steps.managed.outputs.exit-code }}
        run: |
          test "$EXIT_CODE" = 0
          added=""
          cd "$RUNNER_TEMP/out"
          while IFS= read -r file; do
            if [ -f "$RUNNER_TEMP/before/$file" ]; then
              size=$(wc -c < "$RUNNER_TEMP/before/$file")
              cmp -n "$size" "$RUNNER_TEMP/before/$file" "$file"
              added+=$(tail -c +"$((size + 1))" "$file")
            else
              added+=$(cat "$file")
            fi
          done < <(find . -name '*.tf' -not -path '*/.terraform/*' \
            -not -name imports.tf -not -name data.tf -not -name variables.tf -not -name locals.tf)
          grep -q "infraharvest-action-managed" <<< "$added"
          # The state has the others: none is added again.
          if grep -q -E '"infraharvest-action(-new)?"' <<< "$added"; then exit 1; fi
          # The new import blocks import the new queue alone.
          imports=$(find . -name imports.tf -not -path '*/.terraform/*' -exec cat {} +)
          test "$(grep -c '^import {' <<< "$imports")" = 1
          grep -q "infraharvest-action-managed" <<< "$imports"
      - name: Floci logs
        if: failure()
        run: docker compose -f e2e/compose.yaml logs

  # Imports through a selection file whose rules choose the queues by name,
  # as a person writes it before the first discover: an include rule with a
  # name glob, an exclude rule after it that wins, and the defaults
  # excluding the rest.
  selection:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space
        run: .github/scripts/free-disk-space.sh start
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Wait for free disk space
        run: .github/scripts/free-disk-space.sh wait
      - name: Build
        run: go build -tags minimal,aws -o "$RUNNER_TEMP/infraharvest" .
      - name: Install the engine and scanners
        uses: ./.github/actions/setup-engines
        with:
          engine: terraform
      - name: Start Floci, create queues and write the selection file
        run: |
          docker compose -f e2e/compose.yaml up -d --wait
          for name in shop-orders shop-orders-dlq audit; do
            aws sqs create-queue --queue-name "$name"
          done
          cat > "$RUNNER_TEMP/selection.yaml" << 'EOF'
          version: 1
          defaults:
            include: false
          rules:
            - include: { type: aws_sqs_queue, name: "shop-*" }
            - exclude: { type: aws_sqs_queue, name: "*-dlq" }
          resources: []
          EOF
      - name: Run the action
        id: infraharvest
        uses: ./action
        with:
          binary: ${{ runner.temp }}/infraharvest
          provider: aws
          services: sqs
          regions: us-east-1
          selection: ${{ runner.temp }}/selection.yaml
          out: ${{ runner.temp }}/out
      - name: Check what the rules chose
        env:
          EXIT_CODE: ${{ steps.infraharvest.outputs.exit-code }}
        run: |
          test "$EXIT_CODE" = 0
          imports=$(find "$RUNNER_TEMP/out" -name imports.tf -not -path '*/.terraform/*' -exec cat {} +)
          test "$(grep -c '^import {' <<< "$imports")" = 1
          grep -q '/shop-orders"' <<< "$imports"
          coverage="$RUNNER_TEMP/out/report/coverage.json"
          jq -e '[.excluded[] | select(.type == "aws_sqs_queue" and (.id | endswith("/shop-orders-dlq")) and .reason == "excluded by a rule in the selection file")] | length == 1' "$coverage"
          jq -e '[.excluded[] | select(.type == "aws_sqs_queue" and (.id | endswith("/audit")) and .reason == "excluded by the selection file'"'"'s defaults")] | length == 1' "$coverage"
      - name: Floci logs
        if: failure()
        run: docker compose -f e2e/compose.yaml logs

  # A configuration file with environments in two accounts of the emulator,
  # which takes the access key ID as the account: their roots merge into one
  # root they share, which each environment applies into its workspace, as
  # its README says. Drift then runs as a matrix job per environment would,
  # with environment and that environment's credentials; without
  # environment, the action refuses the root.
  environments:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      DEV: "131313131313"
      PROD: "242424242424"
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space
        run: .github/scripts/free-disk-space.sh start
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Wait for free disk space
        run: .github/scripts/free-disk-space.sh wait
      - name: Build
        run: go build -tags minimal,aws -o "$RUNNER_TEMP/infraharvest" .
      - name: Install the engine and scanners
        uses: ./.github/actions/setup-engines
        with:
          engine: terraform
      - name: Start Floci, create a queue in each environment and write the configuration
        run: |
          docker compose -f e2e/compose.yaml up -d --wait
          AWS_ACCESS_KEY_ID=$DEV aws sqs create-queue --queue-name shop-dev-orders --tags Environment=dev
          AWS_ACCESS_KEY_ID=$PROD aws sqs create-queue --queue-name shop-prd-orders --tags Environment=prd
          # The role the import assumes in each account (--accounts), which
          # the emulator lets the job's own account assume.
          trust='{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":"arn:aws:iam::000000000000:root"},"Action":"sts:AssumeRole"}]}'
          for account in "$DEV" "$PROD"; do
            AWS_ACCESS_KEY_ID=$account aws iam create-role --role-name infraharvest-readonly --assume-role-policy-document "$trust"
          done
          cat > "$RUNNER_TEMP/infraharvest.yaml" << EOF
          version: 1
          providers:
            aws:
              accounts: ["$DEV", "$PROD"]
          environments:
            dev:
              aws: { accounts: ["$DEV"] }
            prod:
              aws: { accounts: ["$PROD"] }
              tokens: [prd]
          EOF
      - name: Run the action
        id: infraharvest
        uses: ./action
        with:
          binary: ${{ runner.temp }}/infraharvest
          provider: aws
          services: sqs
          regions: us-east-1
          config: ${{ runner.temp }}/infraharvest.yaml
          out: ${{ runner.temp }}/out
      - name: Check the roots merged, and apply each environment
        env:
          EXIT_CODE: ${{ steps.infraharvest.outputs.exit-code }}
        run: |
          test "$EXIT_CODE" = 0
          root="$RUNNER_TEMP/out/aws/us-east-1"
          test -f "$root/vars/dev/terraform.tfvars"
          test -f "$root/vars/prod/terraform.tfvars"
          jq -e '[.merges[] | select(.path == "aws/us-east-1" and .merged)] | length == 1' "$RUNNER_TEMP/out/report/coverage.json"
          terraform -chdir="$root" init -input=false
          for env in dev prod; do
            if [[ "$env" == dev ]]; then account=$DEV; else account=$PROD; fi
            vars=()
            for file in vars/common.tfvars "vars/$env/terraform.tfvars" "vars/$env/imports.tfvars"; do
              if [[ -f "$root/$file" ]]; then vars+=("-var-file=$file"); fi
            done
            terraform -chdir="$root" workspace new "$env"
            AWS_ACCESS_KEY_ID=$account terraform -chdir="$root" apply -input=false -auto-approve "${vars[@]}"
          done
          url=$(AWS_ACCESS_KEY_ID=$DEV aws sqs get-queue-url --queue-name shop-dev-orders --query QueueUrl --output text)
          AWS_ACCESS_KEY_ID=$DEV aws sqs tag-queue --queue-url "$url" --tags Drift=console
          mkdir -p "$RUNNER_TEMP/decisions"
      - name: Check drift without environment
        id: refused
        continue-on-error: true
        uses: ./action
        with:
          binary: ${{ runner.temp }}/infraharvest
          import: "false"
          out: ${{ runner.temp }}/out
          drift: report
      - name: Check the action refused the root
        env:
          OUTCOME: ${{ steps.refused.outcome }}
          DRIFT_EXIT_CODE: ${{ steps.refused.outputs.drift-exit-code }}
        run: |
          test "$OUTCOME" = failure
          # It refused before checking anything.
          test -z "$DRIFT_EXIT_CODE"
          test ! -e "$RUNNER_TEMP/out/report/drift.json"
      - name: Check drift as dev
        id: dev
        uses: ./action
        env:
          AWS_ACCESS_KEY_ID: ${{ env.DEV }}
        with:
          binary: ${{ runner.temp }}/infraharvest
          import: "false"
          out: ${{ runner.temp }}/out
          drift: report
          environment: dev
          drift-decisions: ${{ runner.temp }}/decisions/drift-dev.yaml
      - name: Check dev's drift was found
        env:
          DRIFT_FOUND: ${{ steps.dev.outputs.drift-found }}
          DRIFT_EXIT_CODE: ${{ steps.dev.outputs.drift-exit-code }}
        run: |
          test "$DRIFT_EXIT_CODE" = 4
          test "$DRIFT_FOUND" = true
          drift="$RUNNER_TEMP/out/report/drift.json"
          jq -e '[.roots[] | .path + " " + .environment] == ["aws/us-east-1 dev"]' "$drift"
          jq -e '[.changes[] | select(.environment == "dev" and .attribute == "tags.Drift" and .outcome == "kept")] | length == 1' "$drift"
          grep -q "decision: undecided" "$RUNNER_TEMP/decisions/drift-dev.yaml"
      - name: Check drift as prod
        id: prod
        uses: ./action
        env:
          AWS_ACCESS_KEY_ID: ${{ env.PROD }}
        with:
          binary: ${{ runner.temp }}/infraharvest
          import: "false"
          out: ${{ runner.temp }}/out
          drift: report
          environment: prod
          drift-decisions: ${{ runner.temp }}/decisions/drift-prod.yaml
      - name: Check prod has no drift
        env:
          DRIFT_FOUND: ${{ steps.prod.outputs.drift-found }}
          DRIFT_EXIT_CODE: ${{ steps.prod.outputs.drift-exit-code }}
        run: |
          test "$DRIFT_EXIT_CODE" = 0
          test "$DRIFT_FOUND" = false
          drift="$RUNNER_TEMP/out/report/drift.json"
          jq -e '[.roots[] | .path + " " + .environment] == ["aws/us-east-1 prod"] and (.changes // []) == []' "$drift"
      - name: Floci logs
        if: failure()
        run: docker compose -f e2e/compose.yaml logs

  # The action with Azure, on floci-az: testdata/azure, the Azure e2e
  # tests' resources, imported from its resource group, which the
  # configuration file names. floci-az has no Resource Graph, which reads
  # tags, so the import is partial (exit code 3) or complete.
  azure:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ARM_ENVIRONMENT: stack
      ARM_METADATA_HOSTNAME: localhost:4577
      ARM_SUBSCRIPTION_ID: 00000000-0000-0000-0000-000000000001
      ARM_TENANT_ID: 00000000-0000-0000-0000-000000000002
      ARM_USE_MSI: "true"
      ARM_MSI_ENDPOINT: https://localhost:4577/metadata/identity/oauth2/token
      ARM_USE_CLI: "false"
      ARM_RESOURCE_PROVIDER_REGISTRATIONS: none
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build
        run: go build -tags minimal,azure -o "$RUNNER_TEMP/infraharvest" .
      - name: Install the engine and scanners
        uses: ./.github/actions/setup-engines
        with:
          engine: terraform
      # The azurerm provider and the listers reach floci-az over HTTPS:
      # trust the CA it generates at startup.
      - name: Start floci-az
        run: |
          docker compose -f e2e/compose.yaml --profile azure up -d floci-az
          for _ in $(seq 60); do
            if curl -sf http://localhost:4577/_floci/tls-cert -o floci-az.crt && grep -q "BEGIN CERTIFICATE" floci-az.crt; then
              sudo cp floci-az.crt /usr/local/share/ca-certificates/floci-az.crt
              sudo update-ca-certificates
              exit 0
            fi
            sleep 2
          done
          echo "floci-az didn't start"; exit 1
      - name: Create the resources and write the configuration
        run: |
          mkdir "$RUNNER_TEMP/seed"
          cp e2e/testdata/azure/main.tf "$RUNNER_TEMP/seed/"
          terraform -chdir="$RUNNER_TEMP/seed" init -input=false
          terraform -chdir="$RUNNER_TEMP/seed" apply -input=false -auto-approve
          printf 'version: 1\nproviders:\n  azure:\n    resource-group: infraharvest-e2e\n' > "$RUNNER_TEMP/infraharvest.yaml"
      - name: Run the action
        id: infraharvest
        uses: ./action
        with:
          binary: ${{ runner.temp }}/infraharvest
          provider: azure
          services: managed_identity,network_interface,network_security_group,public_ip,resource_group,subnet,virtual_network
          config: ${{ runner.temp }}/infraharvest.yaml
          allow-partial: "true"
          out: ${{ runner.temp }}/out
      - name: Check the output
        env:
          EXIT_CODE: ${{ steps.infraharvest.outputs.exit-code }}
          REPORT: ${{ steps.infraharvest.outputs.report }}
        run: |
          [[ "$EXIT_CODE" == 0 || "$EXIT_CODE" == 3 ]]
          test -f "$REPORT"
          imports=$(find "$RUNNER_TEMP/out" -name imports.tf -not -path '*/.terraform/*' -exec cat {} +)
          grep -q "azurerm_virtual_network" <<< "$imports"
          grep -q "azurerm_network_security_group" <<< "$imports"
          # Nothing failed but the tags floci-az can't list.
          jq -e '.totals.failed == 0 and .totals.left_out == 0 and all(.failures[]?; startswith("tags:"))' "$RUNNER_TEMP/out/report/coverage.json"
      - name: floci-az logs
        if: failure()
        run: docker compose -f e2e/compose.yaml --profile azure logs floci-az

  # The action with Google Cloud, on floci-gcp: the bucket and the topic of
  # testdata/google, the Google Cloud e2e tests' resources, imported from
  # the project the args input names. cloud_asset lists through Cloud
  # Asset Inventory, which floci-gcp lacks: as the e2e tests do (see
  # assetSearch in e2e/google_test.go), a stand-in answers its search with
  # the two resources and passes every other request on to floci-gcp. The
  # listers reach it through INFRAHARVEST_GOOGLE_ENDPOINT, the Terraform
  # provider floci-gcp through its custom endpoints.
  google:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      INFRAHARVEST_GOOGLE_ENDPOINT: http://localhost:4589
      GOOGLE_CLOUD_PROJECT: infraharvest-e2e
      GOOGLE_OAUTH_ACCESS_TOKEN: e2e-placeholder
      GOOGLE_COMPUTE_CUSTOM_ENDPOINT: http://localhost:4588/compute/v1/
      GOOGLE_STORAGE_CUSTOM_ENDPOINT: http://localhost:4588/storage/v1/
      GOOGLE_PUBSUB_CUSTOM_ENDPOINT: http://localhost:4588/v1/
      GOOGLE_RESOURCE_MANAGER_CUSTOM_ENDPOINT: http://localhost:4588/v1/
      GOOGLE_SERVICE_USAGE_CUSTOM_ENDPOINT: http://localhost:4588/v1/
      GOOGLE_IAM_BETA_CUSTOM_ENDPOINT: http://localhost:4588/v1/
      GOOGLE_KMS_CUSTOM_ENDPOINT: http://localhost:4588/v1/
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build
        run: go build -tags minimal,google -o "$RUNNER_TEMP/infraharvest" .
      - name: Install the engine and scanners
        uses: ./.github/actions/setup-engines
        with:
          engine: terraform
      - name: Start floci-gcp
        run: |
          docker compose -f e2e/compose.yaml --profile google up -d floci-gcp
          for _ in $(seq 60); do curl -s -o /dev/null http://localhost:4588/ && exit 0; sleep 2; done
          echo "floci-gcp didn't start"; exit 1
      - name: Create the resources
        run: |
          mkdir "$RUNNER_TEMP/seed"
          cp e2e/testdata/google/main.tf "$RUNNER_TEMP/seed/"
          terraform -chdir="$RUNNER_TEMP/seed" init -input=false
          terraform -chdir="$RUNNER_TEMP/seed" apply -input=false -auto-approve \
            -target=google_storage_bucket.assets -target=google_pubsub_topic.events
      # What Cloud Asset Inventory would find of them, named as it names
      # them, with the project's number as their project.
      - name: Start the Cloud Asset Inventory stand-in
        run: |
          cat > "$RUNNER_TEMP/assets.json" << 'EOF'
          [
            {"assetType": "storage.googleapis.com/Bucket", "name": "//storage.googleapis.com/infraharvest-e2e-assets",
             "displayName": "infraharvest-e2e-assets", "location": "us", "labels": {"team": "web", "env": "prod"},
             "project": "projects/123456789012"},
            {"assetType": "pubsub.googleapis.com/Topic", "name": "//pubsub.googleapis.com/projects/infraharvest-e2e/topics/infraharvest-e2e-events",
             "displayName": "infraharvest-e2e-events", "location": "global", "project": "projects/123456789012"}
          ]
          EOF
          cat > "$RUNNER_TEMP/asset-search.py" << 'EOF'
          import json
          import sys
          import urllib.error
          import urllib.request
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          from urllib.parse import parse_qs, unquote, urlsplit

          EMULATOR = "http://localhost:4588"
          SCOPE = "/v1/projects/infraharvest-e2e:searchAllResources"
          with open(sys.argv[1], encoding="utf-8") as f:
              RESULTS = json.load(f)


          class Handler(BaseHTTPRequestHandler):
              def answer(self, status, body, content_type="application/json"):
                  self.send_response(status)
                  self.send_header("Content-Type", content_type)
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def search(self, path, query):
                  if path != SCOPE:
                      self.answer(400, b"unexpected scope " + path.encode(), "text/plain")
                      return
                  types = parse_qs(query).get("assetTypes", [])
                  found = [r for r in RESULTS if r["assetType"] in types]
                  self.answer(200, json.dumps({"results": found}).encode())

              def forward(self):
                  length = int(self.headers.get("Content-Length") or 0)
                  body = self.rfile.read(length) if length else None
                  headers = {k: v for k, v in self.headers.items() if k.lower() not in ("host", "content-length", "connection")}
                  req = urllib.request.Request(EMULATOR + self.path, data=body, headers=headers, method=self.command)
                  try:
                      with urllib.request.urlopen(req) as resp:
                          status, ctype, data = resp.status, resp.headers.get("Content-Type", ""), resp.read()
                  except urllib.error.HTTPError as err:
                      status, ctype, data = err.code, err.headers.get("Content-Type", ""), err.read()
                  self.answer(status, data, ctype)

              def route(self):
                  url = urlsplit(self.path)
                  path = unquote(url.path)
                  if path.endswith(":searchAllResources"):
                      self.search(path, url.query)
                  else:
                      self.forward()

              do_GET = do_POST = do_PUT = do_PATCH = do_DELETE = route


          ThreadingHTTPServer(("127.0.0.1", 4589), Handler).serve_forever()
          EOF
          nohup python3 "$RUNNER_TEMP/asset-search.py" "$RUNNER_TEMP/assets.json" > "$RUNNER_TEMP/asset-search.log" 2>&1 &
          for _ in $(seq 30); do curl -s -o /dev/null http://localhost:4589/ && exit 0; sleep 1; done
          echo "the stand-in didn't start"; exit 1
      - name: Run the action
        id: infraharvest
        uses: ./action
        with:
          binary: ${{ runner.temp }}/infraharvest
          provider: google
          services: cloud_asset
          regions: global
          args: --projects=infraharvest-e2e
          out: ${{ runner.temp }}/out
      - name: Check the output
        env:
          EXIT_CODE: ${{ steps.infraharvest.outputs.exit-code }}
          REPORT: ${{ steps.infraharvest.outputs.report }}
        run: |
          test "$EXIT_CODE" = 0
          test -f "$REPORT"
          root="$RUNNER_TEMP/out/google/infraharvest-e2e/global"
          test -f "$root/imports.tf"
          grep -q "google_storage_bucket" "$root/imports.tf"
          grep -q "google_pubsub_topic" "$root/imports.tf"
          # The labels are in the code, not only in the state.
          grep -rqE '"?team"?[[:space:]]*=[[:space:]]*"web"' --include='*.tf' "$root"
          # Nothing failed or was left out, and every check of the root,
          # its plan with no changes among them, passed.
          coverage="$RUNNER_TEMP/out/report/coverage.json"
          jq -e '.totals.failed == 0 and .totals.left_out == 0 and (.failures // []) == []' "$coverage"
          jq -e '[.directories[].path] == ["google/infraharvest-e2e/global"] and all(.directories[].checks[]?; .passed)' "$coverage"
          # Planned again, the root imports the two and changes nothing but,
          # with Google, the labels the provider keeps only in the state
          # (labels, terraform_labels, effective_labels; see docs/drift.md).
          terraform -chdir="$root" init -input=false
          terraform -chdir="$root" plan -input=false -out=tfplan
          terraform -chdir="$root" show -json tfplan > "$RUNNER_TEMP/plan.json"
          rm "$root/tfplan"
          # Each change's attributes that differ, leaving out what is known
          # only after the apply.
          changed='.change as $ch | ($ch.after_unknown // {}) as $u
            | [($ch.before // {} | keys[]), ($ch.after // {} | keys[])] | unique
            | map(select(($u[.] // false) != true and $ch.before[.] != $ch.after[.]))'
          jq "[.resource_changes[] | select(.mode == \"managed\") | {address, actions: .change.actions, changed: ($changed)}]" "$RUNNER_TEMP/plan.json"
          jq -e "[.resource_changes[] | select(.mode == \"managed\")] as \$c
            | (\$c | length) == 2 and all(\$c[]; .change.importing != null and (
                .change.actions == [\"no-op\"] or (.change.actions == [\"update\"]
                  and (($changed) | all(. == \"labels\" or . == \"terraform_labels\" or . == \"effective_labels\")))))" "$RUNNER_TEMP/plan.json"
      - name: floci-gcp and stand-in logs
        if: failure()
        run: |
          docker compose -f e2e/compose.yaml --profile google logs floci-gcp
          cat "$RUNNER_TEMP/asset-search.log" || true

  # Opens a real pull request with the action, from a branch of the run's
  # own into another of its own, made from this commit, and checks it is
  # there with the import report as its body; then closes it and deletes
  # both branches, whatever happened. Only the report goes into it: the
  # generated configuration stays out of the repository, git excluding it
  # in this checkout. It runs on main and by hand, never for a pull
  # request, whose token from a fork couldn't push. It opens it with
  # github.token, so that GitHub starts no workflow for it, which needs the
  # repository's "Allow GitHub Actions to create and approve pull requests"
  # setting on: the repository variable ACTION_TEST_PULL_REQUEST, set to
  # true, says it is.
  pull-request:
    if: github.event_name != 'pull_request' && github.repository == 'IgnatG/infraharvest' && vars.ACTION_TEST_PULL_REQUEST == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    env:
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      BASE_BRANCH: action-test/base-${{ github.run_id }}-${{ github.run_attempt }}
      PR_BRANCH: action-test/pull-request-${{ github.run_id }}-${{ github.run_attempt }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space
        run: .github/scripts/free-disk-space.sh start
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Wait for free disk space
        run: .github/scripts/free-disk-space.sh wait
      - name: Build
        run: go build -tags minimal,aws -o "$RUNNER_TEMP/infraharvest" .
      - name: Install the engine and scanners
        uses: ./.github/actions/setup-engines
        with:
          engine: terraform
      - name: Start Floci and create a queue
        run: |
          docker compose -f e2e/compose.yaml up -d --wait
          aws sqs create-queue --queue-name infraharvest-action
      # The pull request goes into the branch checked out.
      - name: Create the base branch
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/heads/$BASE_BRANCH" -f "sha=$GITHUB_SHA" > /dev/null
          git checkout -b "$BASE_BRANCH"
          # As a checkout of an existing branch has it: create-pull-request
          # resets the base to its remote-tracking ref.
          git update-ref "refs/remotes/origin/$BASE_BRANCH" "$GITHUB_SHA"
          printf '/action-test-out/*\n!/action-test-out/report/\n' >> .git/info/exclude
      - name: Run the action
        id: infraharvest
        uses: ./action
        with:
          binary: ${{ runner.temp }}/infraharvest
          provider: aws
          services: sqs
          regions: us-east-1
          out: action-test-out
          pull-request: "true"
          pull-request-branch: ${{ env.PR_BRANCH }}
      - name: Check the pull request
        env:
          URL: ${{ steps.infraharvest.outputs.pull-request-url }}
          REPORT: ${{ steps.infraharvest.outputs.report }}
        run: |
          test -n "$URL"
          pr="$RUNNER_TEMP/pull-request.json"
          gh pr view "$URL" -R "$GITHUB_REPOSITORY" --json title,body,baseRefName,headRefName,state,files > "$pr"
          jq -e --arg base "$BASE_BRANCH" --arg head "$PR_BRANCH" \
            '.title == "Import existing resources with infraharvest" and .baseRefName == $base and .headRefName == $head and .state == "OPEN"' "$pr"
          # The report alone, and nothing generated.
          jq -e '(.files | length) > 0 and all(.files[]; .path | startswith("action-test-out/report/"))' "$pr"
          # The body is the import report, as GitHub keeps it, and as the
          # pull request's branch has it: the action leaves the checkout on
          # the base branch, without the report.
          normalise() { tr -d '\r' | sed 's/[[:space:]]*$//' | grep -v '^$'; }
          gh api "repos/$GITHUB_REPOSITORY/contents/$REPORT?ref=$PR_BRANCH" --jq .content | base64 -d > "$RUNNER_TEMP/report.md"
          cmp <(jq -r .body "$pr" | normalise) <(normalise < "$RUNNER_TEMP/report.md")
      - name: Close the pull request and delete the branches
        if: always()
        run: |
          gh pr close "$PR_BRANCH" -R "$GITHUB_REPOSITORY" --comment "Opened by the action test, run $GITHUB_RUN_ID; closed once checked." || true
          for branch in "$PR_BRANCH" "$BASE_BRANCH"; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" > /dev/null 2>&1 || true
          done
      - name: Floci logs
        if: failure()
        run: docker compose -f e2e/compose.yaml logs

  # Commits with the action, with no pull request, to a branch of the
  # run's own, made from this commit, that isn't the one checked out, and
  # checks the branch's head is that commit, with the report alone and the
  # import's commit message; then deletes the branch, whatever happened. As
  # in the pull-request job, git excludes the generated configuration in
  # this checkout, and it runs on main and by hand only, when
  # ACTION_TEST_PULL_REQUEST is true. It also checks that the action fails
  # with commit and pull-request together, and with commit from a detached
  # checkout without commit-branch, before pushing anything.
  commit:
    if: github.event_name != 'pull_request' && github.repository == 'IgnatG/infraharvest' && vars.ACTION_TEST_PULL_REQUEST == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      COMMIT_BRANCH: action-test/commit-${{ github.run_id }}-${{ github.run_attempt }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space
        run: .github/scripts/free-disk-space.sh start
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Wait for free disk space
        run: .github/scripts/free-disk-space.sh wait
      - name: Build
        run: go build -tags minimal,aws -o "$RUNNER_TEMP/infraharvest" .
      - name: Install the engine and scanners
        uses: ./.github/actions/setup-engines
        with:
          engine: terraform
      - name: Start Floci and create a queue
        run: |
          docker compose -f e2e/compose.yaml up -d --wait
          aws sqs create-queue --queue-name infraharvest-action
      - name: Create the branch
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/heads/$COMMIT_BRANCH" -f "sha=$GITHUB_SHA" > /dev/null
          printf '/action-test-out/*\n!/action-test-out/report/\n' >> .git/info/exclude
      - name: Run the action with commit and pull-request
        id: both
        continue-on-error: true
        uses: ./action
        with:
          binary: ${{ runner.temp }}/infraharvest
          provider: aws
          services: sqs
          out: action-test-out
          commit: "true"
          pull-request: "true"
      - name: Run the action
        id: infraharvest
        uses: ./action
        with:
          binary: ${{ runner.temp }}/infraharvest
          provider: aws
          services: sqs
          regions: us-east-1
          out: action-test-out
          commit: "true"
          commit-branch: ${{ env.COMMIT_BRANCH }}
      - name: Check the commit
        env:
          BOTH: ${{ steps.both.outcome }}
          SHA: ${{ steps.infraharvest.outputs.commit-sha }}
        run: |
          test "$BOTH" = failure
          test -n "$SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/$COMMIT_BRANCH" --jq .commit.sha)" = "$SHA"
          commit="$RUNNER_TEMP/commit.json"
          gh api "repos/$GITHUB_REPOSITORY/commits/$SHA" > "$commit"
          jq -e --arg parent "$GITHUB_SHA" \
            '.commit.message == "feat: import existing resources with infraharvest" and [.parents[].sha] == [$parent]' "$commit"
          # The report alone, and nothing generated.
          jq -e '(.files | length) > 0 and all(.files[]; .filename | startswith("action-test-out/report/"))' "$commit"
          jq -e 'any(.files[]; .filename == "action-test-out/report/report.md")' "$commit"
      - name: Check out no branch
        run: git checkout --detach
      - name: Run the action from a detached checkout
        id: detached
        continue-on-error: true
        uses: ./action
        with:
          binary: ${{ runner.temp }}/infraharvest
          provider: aws
          services: sqs
          regions: us-east-1
          out: action-test-out
          commit: "true"
      - name: Check the detached run failed without pushing
        env:
          DETACHED: ${{ steps.detached.outcome }}
          SHA: ${{ steps.infraharvest.outputs.commit-sha }}
        run: |
          test "$DETACHED" = failure
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/$COMMIT_BRANCH" --jq .commit.sha)" = "$SHA"
      - name: Delete the branch
        if: always()
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$COMMIT_BRANCH" > /dev/null 2>&1 || true
      - name: Floci logs
        if: failure()
        run: docker compose -f e2e/compose.yaml logs

  # What the action opens its pull request with, worked out by
  # action/pull-request-details.sh, is checked for each kind of run, the
  # script run as the action runs it; the step that opens the pull
  # request, peter-evans/create-pull-request, only passes it on. The
  # pull-request job opens one for an import only.
  pull-request-details:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Work out the pull request of each kind of run
        run: |
          printf '# Import report\n' > "$RUNNER_TEMP/report.md"
          printf '# Drift report\n' > "$RUNNER_TEMP/drift.md"
          # details <run> <VAR=value>...: runs the script with only the
          # variables given, as the action sets them, writing its outputs
          # to $RUNNER_TEMP/<run>.out and its body under $RUNNER_TEMP/<run>.
          details() {
            local run=$1
            shift
            mkdir -p "$RUNNER_TEMP/$run"
            : > "$RUNNER_TEMP/$run.out"
            env -i PATH="$PATH" RUNNER_TEMP="$RUNNER_TEMP/$run" GITHUB_OUTPUT="$RUNNER_TEMP/$run.out" "$@" bash action/pull-request-details.sh
          }
          # output <run> <name>: the value of the output name, on one line
          # or, as add-paths, on several.
          output() {
            awk -v name="$2" '
              index($0, name "<<") == 1 { end = substr($0, length(name) + 3); next }
              end != "" && $0 == end { end = ""; next }
              end != "" { print; next }
              index($0, name "=") == 1 { print substr($0, length(name) + 2) }
            ' "$RUNNER_TEMP/$1.out"
          }
          expect() {
            local got
            got=$(output "$1" "$2")
            if [[ "$got" != "$3" ]]; then
              echo "::error::$1: $2 is '$got', want '$3'"
              exit 1
            fi
          }

          # A scheduled import.
          details import IMPORT=true DRIFT=off OUT=infraharvest-out BRANCH= DRIFT_DECISIONS= \
            IMPORT_REPORT="$RUNNER_TEMP/report.md" DRIFT_REPORT=
          expect import title "Import existing resources with infraharvest"
          expect import commit-message "feat: import existing resources with infraharvest"
          expect import branch infraharvest/import
          expect import body-path "$RUNNER_TEMP/import/infraharvest-pull-request.md"
          expect import add-paths infraharvest-out
          cmp "$RUNNER_TEMP/report.md" "$(output import body-path)"

          # Drift accepted, then an import: both reports, and the decisions
          # file, wherever it is.
          details both IMPORT=true DRIFT=accept OUT=infraharvest-out BRANCH= DRIFT_DECISIONS=decisions/drift.yaml \
            IMPORT_REPORT="$RUNNER_TEMP/report.md" DRIFT_REPORT="$RUNNER_TEMP/drift.md"
          expect both title "Accept cloud changes (drift) and import new resources"
          expect both commit-message "fix: accept drift found by infraharvest"
          expect both branch infraharvest/import
          expect both add-paths "$(printf 'infraharvest-out\ndecisions/drift.yaml')"
          printf '# Import report\n\n# Drift report\n' > "$RUNNER_TEMP/both.md"
          cmp "$RUNNER_TEMP/both.md" "$(output both body-path)"

          # Drift reported, then an import: the changes are recorded for
          # review, and none accepted.
          details recorded IMPORT=true DRIFT=report OUT=infraharvest-out BRANCH= DRIFT_DECISIONS=decisions/drift.yaml \
            IMPORT_REPORT="$RUNNER_TEMP/report.md" DRIFT_REPORT="$RUNNER_TEMP/drift.md"
          expect recorded title "Import new resources, and record cloud changes (drift) for review"
          expect recorded commit-message "feat: import new resources and record drift found by infraharvest"
          expect recorded branch infraharvest/import
          expect recorded add-paths "$(printf 'infraharvest-out\ndecisions/drift.yaml')"
          cmp "$RUNNER_TEMP/both.md" "$(output recorded body-path)"

          # Drift accepted alone, on a branch of its own.
          details accepted IMPORT=false DRIFT=accept OUT=infraharvest-out BRANCH= DRIFT_DECISIONS= \
            IMPORT_REPORT= DRIFT_REPORT="$RUNNER_TEMP/drift.md"
          expect accepted title "Accept cloud changes (drift)"
          expect accepted commit-message "fix: accept drift found by infraharvest"
          expect accepted branch infraharvest/drift
          cmp "$RUNNER_TEMP/drift.md" "$(output accepted body-path)"

          # Drift reported alone, on a branch of its own, with no drift
          # report: on a first run, out doesn't exist yet.
          details drift IMPORT=false DRIFT=report OUT=infraharvest-out BRANCH=infraharvest/weekly DRIFT_DECISIONS= \
            IMPORT_REPORT= DRIFT_REPORT="$RUNNER_TEMP/missing/drift.md"
          expect drift title "Record cloud changes (drift) for review"
          expect drift commit-message "chore: record drift found by infraharvest for review"
          expect drift branch infraharvest/weekly
          expect drift add-paths infraharvest-out
          test ! -s "$(output drift body-path)"

          # Drift accepted as one environment, in a matrix job of its own:
          # that environment's pull request, on a branch of its own.
          details prod IMPORT=false DRIFT=accept OUT=infraharvest-out BRANCH= DRIFT_DECISIONS=decisions/drift-prod.yaml \
            ENVIRONMENT=prod IMPORT_REPORT= DRIFT_REPORT="$RUNNER_TEMP/drift.md"
          expect prod title "Accept cloud changes (drift) in prod"
          expect prod commit-message "fix: accept drift found by infraharvest in prod"
          expect prod branch infraharvest/drift-prod
          expect prod add-paths "$(printf 'infraharvest-out\ndecisions/drift-prod.yaml')"

          # Every environment at once, with one set of credentials: as
          # without environment.
          details all IMPORT=true DRIFT=report OUT=infraharvest-out BRANCH= DRIFT_DECISIONS= \
            ENVIRONMENT=all IMPORT_REPORT="$RUNNER_TEMP/report.md" DRIFT_REPORT="$RUNNER_TEMP/drift.md"
          expect all title "Import new resources, and record cloud changes (drift) for review"
          expect all branch infraharvest/import

  # What action/commit.sh commits and pushes, checked against a repository
  # of the job's own, which it pushes to over file://, so that it needs no
  # token: only the paths given, nothing when they haven't changed, a
  # branch of its own, and the failures without a branch and on a branch
  # that has moved on. The commit job runs it through the action, on
  # GitHub.
  commit-script:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Commit and push each kind of change
        run: |
          script="$GITHUB_WORKSPACE/action/commit.sh"
          remote="$RUNNER_TEMP/remote/infraharvest.git"
          work="$RUNNER_TEMP/work"
          other="$RUNNER_TEMP/other"
          git init --quiet --bare -b main "$remote"
          git init --quiet -b main "$work"
          cd "$work"
          git config user.name test
          git config user.email test@example.com
          mkdir out
          printf 'readme\n' > README.md
          printf 'one\n' > out/main.tf
          printf 'ignored.txt\n' > out/.gitignore
          git add .
          git commit --quiet -m "chore: start"
          git push --quiet "$remote" main
          # commit <name> <VAR=value>...: runs the script as the action
          # does, writing its outputs to $RUNNER_TEMP/<name>.out.
          commit() {
            local name=$1
            shift
            : > "$RUNNER_TEMP/$name.out"
            env -i PATH="$PATH" HOME="$HOME" RUNNER_TEMP="$RUNNER_TEMP" GITHUB_OUTPUT="$RUNNER_TEMP/$name.out" \
              GITHUB_SERVER_URL="file://$RUNNER_TEMP/remote" GITHUB_REPOSITORY=infraharvest TOKEN=token \
              ADD_PATHS="$(printf 'out\ndecisions/drift.yaml')" COMMIT_MESSAGE="feat: import existing resources with infraharvest" \
              "$@" bash "$script"
          }
          sha() { sed -n 's/^commit-sha=//p' "$RUNNER_TEMP/$1.out"; }
          remote_head() { git --git-dir="$remote" rev-parse "refs/heads/$1"; }
          start=$(git rev-parse HEAD)

          # Nothing changed: no commit, and nothing pushed.
          commit unchanged
          test -z "$(sha unchanged)"
          test "$(git rev-parse HEAD)" = "$start"

          # The output only: not what out's .gitignore ignores, nor what
          # else the job changed, staged or not; the decisions file, which
          # doesn't exist, is left out.
          printf 'two\n' > out/main.tf
          printf 'new\n' > out/new.tf
          printf 'secret\n' > out/ignored.txt
          printf 'changed\n' > README.md
          git add README.md
          commit changed
          test "$(remote_head main)" = "$(sha changed)"
          test "$(git log -1 --format=%s "$(sha changed)")" = "feat: import existing resources with infraharvest"
          test "$(git diff-tree --no-commit-id --name-only -r "$(sha changed)" | paste -sd, -)" = "out/main.tf,out/new.tf"
          test "$(git diff --cached --name-only)" = README.md
          git reset --quiet README.md

          # To a branch that isn't the one checked out, which the push
          # creates.
          printf 'three\n' > out/main.tf
          commit branch BRANCH=infraharvest/imported
          test "$(remote_head infraharvest/imported)" = "$(sha branch)"
          test "$(remote_head main)" = "$(sha changed)"

          # The branch has moved on: the push is rejected, not forced.
          git clone --quiet "$remote" "$other"
          git -C "$other" -c user.name=other -c user.email=other@example.com commit --quiet --allow-empty -m "chore: elsewhere"
          git -C "$other" push --quiet origin main
          moved=$(remote_head main)
          git reset --quiet --hard "$(sha changed)"
          printf 'four\n' > out/main.tf
          if commit rejected > "$RUNNER_TEMP/rejected.log" 2>&1; then
            echo "::error::the push to a branch that moved on succeeded"
            exit 1
          fi
          grep -q 'non-fast-forward' "$RUNNER_TEMP/rejected.log"
          test "$(remote_head main)" = "$moved"

          # No branch checked out, and no commit-branch.
          git checkout --quiet --detach
          printf 'five\n' > out/main.tf
          if commit detached > "$RUNNER_TEMP/detached.log" 2>&1; then
            echo "::error::a detached checkout pushed without commit-branch"
            exit 1
          fi
          grep -q 'detached HEAD' "$RUNNER_TEMP/detached.log"
          test "$(remote_head main)" = "$moved"
