name: action-test

# Runs the GitHub Action (action/) with a binary built from this commit
# against Floci, a local AWS emulator: no AWS account is involved.
on:
  pull_request:
    paths:
      - action/**
      - .github/workflows/action-test.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  action:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build
        run: go build -tags minimal,aws -o "$RUNNER_TEMP/infraharvest" .
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - name: Start Floci and create a queue
        run: |
          docker compose -f e2e/compose.yaml up -d --wait
          aws sqs create-queue --queue-name infraharvest-action
      - name: Run the action
        id: infraharvest
        uses: ./action
        with:
          binary: ${{ runner.temp }}/infraharvest
          provider: aws
          resources: sqs
          regions: us-east-1
          output: ${{ runner.temp }}/generated
      - name: Check the output
        env:
          EXIT_CODE: ${{ steps.infraharvest.outputs.exit-code }}
          REPORT: ${{ steps.infraharvest.outputs.report }}
        run: |
          test "$EXIT_CODE" = 0
          test -f "$REPORT"
          grep -r --include=imports.tf "aws_sqs_queue" "$RUNNER_TEMP/generated"
      # A scheduled run on a fresh checkout: the roots are there, infraharvest's
      # checkpoints (gitignored) are not, and a queue is new.
      - name: Add a queue
        run: |
          find "$RUNNER_TEMP/generated" -name generated.tf -exec sha256sum {} + > "$RUNNER_TEMP/generated.sha256"
          rm -rf "$RUNNER_TEMP/generated/.infraharvest"
          aws sqs create-queue --queue-name infraharvest-action-new
      - name: Run the action again
        id: again
        uses: ./action
        with:
          binary: ${{ runner.temp }}/infraharvest
          provider: aws
          resources: sqs
          regions: us-east-1
          output: ${{ runner.temp }}/generated
      - name: Check the new queue was added
        env:
          EXIT_CODE: ${{ steps.again.outputs.exit-code }}
        run: |
          test "$EXIT_CODE" = 0
          sha256sum --check "$RUNNER_TEMP/generated.sha256"
          added=$(find "$RUNNER_TEMP/generated" -name generated_2.tf)
          test -n "$added"
          grep -q "infraharvest-action-new" $added
          ! grep -q '"infraharvest-action"' $added
      - name: Floci logs
        if: failure()
        run: docker compose -f e2e/compose.yaml logs
