name: Action test

# Runs the GitHub Action (action/) with a binary built from this commit
# against Floci, a local AWS emulator: no AWS account is involved. It also
# runs when the CLI changes, since the action relies on its flags, report
# path and exit codes, and checks drift on the roots once they're applied,
# and what the action would open its pull request with.
on:
  pull_request:
    paths:
      - action/**
      - internal/cli/**
      - internal/engine/drift*.go
      - internal/importer/**
      - internal/report/**
      - main.go
      - go.mod
      - go.sum
      - e2e/compose.yaml
      - .github/workflows/action-test.yml
      - .github/scripts/free-disk-space.sh
      - .github/actions/setup-engines/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  action:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space
        run: .github/scripts/free-disk-space.sh start
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Wait for free disk space
        run: .github/scripts/free-disk-space.sh wait
      - name: Build
        run: go build -tags minimal,aws -o "$RUNNER_TEMP/infraharvest" .
      - name: Install the engine and scanners
        uses: ./.github/actions/setup-engines
        with:
          engine: terraform
      - name: Start Floci and create a queue
        run: |
          docker compose -f e2e/compose.yaml up -d --wait
          aws sqs create-queue --queue-name infraharvest-action
      - name: Run the action
        id: infraharvest
        uses: ./action
        with:
          binary: ${{ runner.temp }}/infraharvest
          provider: aws
          services: sqs
          regions: us-east-1
          out: ${{ runner.temp }}/out
      - name: Check the output
        env:
          EXIT_CODE: ${{ steps.infraharvest.outputs.exit-code }}
          REPORT: ${{ steps.infraharvest.outputs.report }}
        run: |
          test "$EXIT_CODE" = 0
          test -f "$REPORT"
          grep -r --include=imports.tf "aws_sqs_queue" "$RUNNER_TEMP/out"
      # Drift needs applied roots: apply them, then change the queue in the
      # emulator, as someone would in the console. The state goes outside
      # the roots, as a backend keeps it: a state file in a root is one to
      # commit, which the import's checks refuse.
      - name: Apply the roots and tag the queue
        run: |
          mkdir -p "$RUNNER_TEMP/state"
          n=0
          find "$RUNNER_TEMP/out" -name imports.tf -not -path '*/.terraform/*' | while IFS= read -r file; do
            root=$(dirname "$file")
            n=$((n + 1))
            printf 'terraform {\n  backend "local" {\n    path = "%s"\n  }\n}\n' "$RUNNER_TEMP/state/$n.tfstate" > "$root/backend.tf"
            terraform -chdir="$root" init -input=false
            terraform -chdir="$root" apply -input=false -auto-approve
          done
          url=$(aws sqs get-queue-url --queue-name infraharvest-action --query QueueUrl --output text)
          aws sqs tag-queue --queue-url "$url" --tags Drift=console
      # A scheduled run on a fresh checkout: the roots are there, infraharvest's
      # checkpoints (gitignored) are not, and a queue is new. Drift is checked
      # first, and only reported: the code stays as it is, and the decisions
      # file is written outside out, where the repository keeps it.
      - name: Add a queue
        run: |
          # The resources' files, whose blocks adding to the roots leaves as
          # they are: new ones go after them.
          mkdir "$RUNNER_TEMP/before"
          cd "$RUNNER_TEMP/out"
          find . -name '*.tf' -not -path '*/.terraform/*' \
            -not -name imports.tf -not -name data.tf -not -name variables.tf -not -name locals.tf \
            -exec cp --parents {} "$RUNNER_TEMP/before" \;
          test -n "$(find "$RUNNER_TEMP/before" -name '*.tf')"
          rm -rf "$RUNNER_TEMP/out/.infraharvest"
          mkdir -p "$RUNNER_TEMP/decisions"
          aws sqs create-queue --queue-name infraharvest-action-new
      - name: Run the action again
        id: again
        uses: ./action
        with:
          binary: ${{ runner.temp }}/infraharvest
          provider: aws
          services: sqs
          regions: us-east-1
          out: ${{ runner.temp }}/out
          drift: report
          drift-decisions: ${{ runner.temp }}/decisions/drift.yaml
      - name: Check the drift was reported
        env:
          DRIFT_FOUND: ${{ steps.again.outputs.drift-found }}
          DRIFT_EXIT_CODE: ${{ steps.again.outputs.drift-exit-code }}
          DRIFT_REPORT: ${{ steps.again.outputs.drift-report }}
        run: |
          test "$DRIFT_EXIT_CODE" = 4
          test "$DRIFT_FOUND" = true
          test -f "$DRIFT_REPORT"
          jq -e '[.changes[] | select(.attribute == "tags.Drift" and .outcome == "kept")] | length == 1' "$RUNNER_TEMP/out/report/drift.json"
          grep -q "decision: undecided" "$RUNNER_TEMP/decisions/drift.yaml"
          test ! -e "$RUNNER_TEMP/out/drift.yaml"
      - name: Check the new queue was added
        env:
          EXIT_CODE: ${{ steps.again.outputs.exit-code }}
        run: |
          test "$EXIT_CODE" = 0
          # What each file had stays at its start; what follows, and the
          # files that are new, is what was added.
          added=""
          cd "$RUNNER_TEMP/out"
          while IFS= read -r file; do
            if [ -f "$RUNNER_TEMP/before/$file" ]; then
              size=$(wc -c < "$RUNNER_TEMP/before/$file")
              cmp -n "$size" "$RUNNER_TEMP/before/$file" "$file"
              added+=$(tail -c +"$((size + 1))" "$file")
            else
              added+=$(cat "$file")
            fi
          done < <(find . -name '*.tf' -not -path '*/.terraform/*' \
            -not -name imports.tf -not -name data.tf -not -name variables.tf -not -name locals.tf)
          grep -q "infraharvest-action-new" <<< "$added"
          ! grep -q '"infraharvest-action"' <<< "$added"
      # Review the decisions file as a person would: accept the change.
      - name: Decide to accept the drift
        run: |
          sed -i 's/decision: undecided/decision: accept/' "$RUNNER_TEMP/decisions/drift.yaml"
      - name: Accept the drift
        id: accept
        uses: ./action
        with:
          binary: ${{ runner.temp }}/infraharvest
          import: "false"
          out: ${{ runner.temp }}/out
          drift: accept
          drift-decisions: ${{ runner.temp }}/decisions/drift.yaml
          # Matches nothing here: the file's decision stands.
          drift-accept: |
            # Security groups are reviewed by hand.
            keep type=aws_security_group
      - name: Check the drift was accepted
        env:
          EXIT_CODE: ${{ steps.accept.outputs.exit-code }}
          DRIFT_FOUND: ${{ steps.accept.outputs.drift-found }}
          DRIFT_EXIT_CODE: ${{ steps.accept.outputs.drift-exit-code }}
        run: |
          test -z "$EXIT_CODE"
          test "$DRIFT_EXIT_CODE" = 0
          test "$DRIFT_FOUND" = false
          jq -e '[.changes[] | select(.attribute == "tags.Drift" and .outcome == "written")] | length == 1' "$RUNNER_TEMP/out/report/drift.json"
          grep -rq --include='*.tf' -E 'Drift += +"console"' "$RUNNER_TEMP/out"
      - name: Floci logs
        if: failure()
        run: docker compose -f e2e/compose.yaml logs

  # The action's pull request can't be opened here: this workflow can't
  # push, and a pull request of its own would be one more in the
  # repository for every run. What the action opens it with, worked out by
  # action/pull-request-details.sh, is checked for each kind of run
  # instead, the script run as the action runs it; the step that opens the
  # pull request, peter-evans/create-pull-request, only passes it on.
  pull-request-details:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Work out the pull request of each kind of run
        run: |
          printf '# Import report\n' > "$RUNNER_TEMP/report.md"
          printf '# Drift report\n' > "$RUNNER_TEMP/drift.md"
          # details <run> <VAR=value>...: runs the script with only the
          # variables given, as the action sets them, writing its outputs
          # to $RUNNER_TEMP/<run>.out and its body under $RUNNER_TEMP/<run>.
          details() {
            local run=$1
            shift
            mkdir -p "$RUNNER_TEMP/$run"
            : > "$RUNNER_TEMP/$run.out"
            env -i PATH="$PATH" RUNNER_TEMP="$RUNNER_TEMP/$run" GITHUB_OUTPUT="$RUNNER_TEMP/$run.out" "$@" bash action/pull-request-details.sh
          }
          # output <run> <name>: the value of the output name, on one line
          # or, as add-paths, on several.
          output() {
            awk -v name="$2" '
              index($0, name "<<") == 1 { end = substr($0, length(name) + 3); next }
              end != "" && $0 == end { end = ""; next }
              end != "" { print; next }
              index($0, name "=") == 1 { print substr($0, length(name) + 2) }
            ' "$RUNNER_TEMP/$1.out"
          }
          expect() {
            local got
            got=$(output "$1" "$2")
            if [[ "$got" != "$3" ]]; then
              echo "::error::$1: $2 is '$got', want '$3'"
              exit 1
            fi
          }

          # A scheduled import.
          details import IMPORT=true DRIFT=off OUT=infraharvest-out BRANCH= DRIFT_DECISIONS= \
            IMPORT_REPORT="$RUNNER_TEMP/report.md" DRIFT_REPORT=
          expect import title "Import existing resources with infraharvest"
          expect import commit-message "feat: import existing resources with infraharvest"
          expect import branch infraharvest/import
          expect import body-path "$RUNNER_TEMP/import/infraharvest-pull-request.md"
          expect import add-paths infraharvest-out
          cmp "$RUNNER_TEMP/report.md" "$(output import body-path)"

          # Drift accepted, then an import: both reports, and the decisions
          # file, wherever it is.
          details both IMPORT=true DRIFT=accept OUT=infraharvest-out BRANCH= DRIFT_DECISIONS=decisions/drift.yaml \
            IMPORT_REPORT="$RUNNER_TEMP/report.md" DRIFT_REPORT="$RUNNER_TEMP/drift.md"
          expect both title "Accept cloud changes (drift) and import new resources"
          expect both commit-message "fix: accept drift found by infraharvest"
          expect both branch infraharvest/import
          expect both add-paths "$(printf 'infraharvest-out\ndecisions/drift.yaml')"
          printf '# Import report\n\n# Drift report\n' > "$RUNNER_TEMP/both.md"
          cmp "$RUNNER_TEMP/both.md" "$(output both body-path)"

          # Drift alone, on a branch of its own, with no drift report: on a
          # first run, out doesn't exist yet.
          details drift IMPORT=false DRIFT=report OUT=infraharvest-out BRANCH=infraharvest/weekly DRIFT_DECISIONS= \
            IMPORT_REPORT= DRIFT_REPORT="$RUNNER_TEMP/missing/drift.md"
          expect drift title "Accept cloud changes (drift)"
          expect drift commit-message "fix: accept drift found by infraharvest"
          expect drift branch infraharvest/weekly
          expect drift add-paths infraharvest-out
          test ! -s "$(output drift body-path)"
