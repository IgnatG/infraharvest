name: release

# Publishes a release from main with GoReleaser (see .goreleaser.yaml):
#   gh workflow run release --ref main -f version=v0.2.0
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag (e.g. v0.2.0 or v0.2.0-rc.1)
        required: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write      # create the tag and the release
      packages: write      # push the image to ghcr.io
      id-token: write      # keyless cosign signing and provenance
      attestations: write  # build provenance
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Validate version and branch
        id: version
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::version must look like v1.2.3 or v1.2.3-rc.1, got '$VERSION'"
            exit 1
          fi
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::releases are made from main, not $GITHUB_REF"
            exit 1
          fi
          echo "number=${VERSION#v}" >> "$GITHUB_OUTPUT"
      # Ubuntu runners have ~14 GB free, too little for six platforms of
      # this module's dependencies.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # GoReleaser builds the changelog from history
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # never restore a cache into a release build
      - name: Test
        run: go test ./...
      - name: Tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag "$VERSION"
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$VERSION" -f sha="$GITHUB_SHA"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        id: goreleaser
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --clean --parallelism=1
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # The tag was pushed before GoReleaser ran: take it back when the
      # release failed, so the version can be released again.
      - name: Delete the tag of the failed release
        if: failure() && steps.goreleaser.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$VERSION"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/infraharvest_${{ steps.version.outputs.number }}_SHA256SUMS
