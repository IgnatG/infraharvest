name: MegaLinter

# Every linter CI runs, in one place: MegaLinter (https://megalinter.io),
# Go flavour, over the whole repository on every pull request. A merge to
# main doesn't run it again: the pull request ran it on the same code.
# .mega-linter.yml lists the linters, with their configuration, and says why
# the others are off. MegaLinter reports in one comment on the pull request,
# which it updates on each run, and in the run's summary; the report folder
# is uploaded as an artifact.
#
# Run it on a branch before opening a pull request, so a laptop never has
# to compile the module (make ci-lint does the same):
#   gh workflow run megalinter.yml --ref <branch>
# or locally, with Docker: npx mega-linter-runner --flavor go
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push makes a pull request's run moot.
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  megalinter:
    name: MegaLinter
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write # MegaLinter's comment on the pull request
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The image oxsecurity/megalinter/flavors/go@v10.1.0 runs, by digest:
      # the action names it only by its tag, which can move. To bump it, take
      # the image tag from the new release's flavors/go/action.yml and its
      # digest from the registry (docker buildx imagetools inspect).
      - name: MegaLinter
        uses: docker://ghcr.io/oxsecurity/megalinter-go@sha256:42e091a4bcbe9141fe420c2520ed7addf75ae60a0c9d42e3df1278eef1c90a88 # v10.1.0
        env:
          # For the pull request comment only; MegaLinter hides it from the
          # linters.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Run by hand there is no pull request to comment on; the run's
          # summary holds the report.
          GITHUB_COMMENT_REPORTER: ${{ github.event_name == 'pull_request' }}
          # The image's Go is older than go.mod asks for; let it switch to
          # the toolchain go.mod names, as setup-go would install, for
          # golangci-lint and osv-scanner's govulncheck.
          GOTOOLCHAIN: auto
          # Fetch a module the proxy drops from its repository instead.
          GOPROXY: https://proxy.golang.org|direct
      - name: Upload the MegaLinter report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: megalinter-reports
          path: |
            megalinter-reports
            mega-linter.log
          include-hidden-files: true
          if-no-files-found: warn
