name: Adapters

# Checks every night whether the modules the curated adapters pin have a
# newer release, whether each adapter fits it (its interface and the
# resources the adapter maps onto), and whether it accepts the newest major
# release of each provider the adapter uses. Findings go into one open
# issue labelled adapter-update, which the check keeps current. A pinned
# release that is the newest but accepts only an older major release of a
# provider is a note in the run's summary, not an issue: there is nothing
# to bump to yet.
#
# Alongside, the list-coverage job counts the resource types and the list
# resources (the types `terraform query` can discover) of the newest
# release of each provider, and names the list resources no infraharvest
# lister lists, in the run's summary and the artifact list-coverage. It
# opens no issue: the counts are for watching, not for acting on.
#
# The opa-capabilities job checks the OPA capabilities infraharvest gives
# conftest (internal/engine/conftest_capabilities.json) against the OPA
# release the newest conftest is built with
# (internal/engine/cmd/opacapabilities). When they are behind, it bumps
# them, says in the run's summary what the newer release adds, and the
# opa-capabilities-pr job opens a pull request with the bump, or updates
# the one already open, on the branch opa-capabilities/update, as the
# schema-metadata workflow does with its files: see there for the
# repository setting it needs and the checks it starts. A person reads the
# new built-in functions in its body before merging it, as one that
# reaches the network or reads files belongs in deniedBuiltins.
#
# Run on a branch with write set (gh workflow run adapters.yml --ref <branch>
# -f write=true), it fetches the interface of each version the adapters
# pin instead, into internal/adapters/testdata/interfaces, and uploads the files as
# the artifact interfaces: no local toolchain needed.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      write:
        description: Refresh the interface snapshots of the pinned versions, as an artifact
        type: boolean
        default: false

permissions:
  contents: read

# The module proxy drops a download now and then (stream error
# INTERNAL_ERROR); fetching that module from its repository instead keeps
# the job from failing on it. go.sum still checks what is fetched.
env:
  GOPROXY: https://proxy.golang.org|direct

jobs:
  check:
    if: ${{ !inputs.write }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write # open and update the adapter-update issue
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # A module the check couldn't read is a line of the report, and fails
      # the step once every adapter was checked: the report still goes out.
      - name: Check the adapters against the newest module releases
        id: check
        run: go run ./internal/adapters/cmd/adaptercheck -notes "$RUNNER_TEMP/notes.md" > "$RUNNER_TEMP/adapters.md"
      - name: Report
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKED: ${{ steps.check.outcome }}
        run: |
          if [[ "$CHECKED" != success && ! -s "$RUNNER_TEMP/adapters.md" ]]; then
            echo "::error::the check failed before it reported anything"
            exit 1
          fi
          if [[ -s "$RUNNER_TEMP/notes.md" ]]; then
            {
              echo "Pinned releases that aren't usable yet:"
              echo
              cat "$RUNNER_TEMP/notes.md"
            } | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --label adapter-update --state open --json number --jq '.[0].number // empty')
          if [[ ! -s "$RUNNER_TEMP/adapters.md" ]]; then
            echo "Every adapter pins its module's newest release."
            if [[ -n "$issue" ]]; then
              gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --comment "Every adapter pins its module's newest release again."
            fi
            exit 0
          fi
          {
            echo "The nightly adapter check found newer releases of curated modules:"
            echo
            cat "$RUNNER_TEMP/adapters.md"
            if [[ -s "$RUNNER_TEMP/notes.md" ]]; then
              echo
              echo "Pinned releases that aren't usable yet:"
              echo
              cat "$RUNNER_TEMP/notes.md"
            fi
          } > "$RUNNER_TEMP/body.md"
          if [[ -n "$issue" ]]; then
            gh issue edit "$issue" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/body.md"
          else
            gh label create adapter-update --repo "$GITHUB_REPOSITORY" --color 0e8a16 --description "A curated module has a newer release" --force
            gh issue create --repo "$GITHUB_REPOSITORY" --label adapter-update --title "Curated module adapters: newer module releases" --body-file "$RUNNER_TEMP/body.md"
          fi

  list-coverage:
    if: ${{ !inputs.write }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
          terraform_version: 1.16.6
      - name: Count the providers' list resources
        run: go run ./internal/catalogue/cmd/listcoverage -json "$RUNNER_TEMP/list-coverage.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the counts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: list-coverage
          path: ${{ runner.temp }}/list-coverage.json
          retention-days: 30

  snapshots:
    if: ${{ inputs.write }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Fetch the interfaces of the pinned versions
        run: go run ./internal/adapters/cmd/adaptercheck -write
      - name: List what changed
        run: git status --short -- internal/adapters/testdata/interfaces
      - name: Upload the interfaces
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: interfaces
          path: internal/adapters/testdata/interfaces/
          retention-days: 1

  opa-capabilities:
    if: ${{ !inputs.write }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      behind: ${{ steps.check.outputs.behind }}
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The report goes into the summary even when the check fails after
      # writing it: a denied function the newer OPA release dropped.
      - name: Check the OPA capabilities against the newest conftest
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }} # a higher rate limit on GitHub's API
        run: |
          mkdir -p "$RUNNER_TEMP/opa-capabilities/files"
          status=0
          go run ./internal/engine/cmd/opacapabilities -write > "$RUNNER_TEMP/opa-capabilities/report.md" || status=$?
          cat "$RUNNER_TEMP/opa-capabilities/report.md" >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          if [ ! -s "$RUNNER_TEMP/opa-capabilities/report.md" ]; then
            echo "The OPA capabilities are of the release the newest conftest is built with." >> "$GITHUB_STEP_SUMMARY"
            echo "behind=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only -z | xargs -0 cp --parents -t "$RUNNER_TEMP/opa-capabilities/files"
          git status --short
          echo "behind=true" >> "$GITHUB_OUTPUT"
      - name: Upload the bump
        if: ${{ steps.check.outputs.behind == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opa-capabilities
          path: ${{ runner.temp }}/opa-capabilities/
          retention-days: 7

  opa-capabilities-pr:
    needs: opa-capabilities
    # Not in a fork, whatever the repository is called.
    if: needs.opa-capabilities.outputs.behind == 'true' && github.event.repository.fork != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: opa-capabilities
      cancel-in-progress: false
    permissions:
      contents: write # push the branch
      pull-requests: write # open and update the pull request
      actions: write # start its checks (see schema-metadata.yml)
    env:
      BRANCH: opa-capabilities/update
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the bump
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: opa-capabilities
          path: ${{ runner.temp }}/opa-capabilities
      - name: Commit it
        run: |
          cp -R "$RUNNER_TEMP/opa-capabilities/files/." .
          opa=$(sed -n 's/^const opaVersion = "\([^"]*\)"$/\1/p' internal/engine/conftest_capabilities.go)
          title="chore(engine): bump the OPA capabilities to OPA $opa"
          echo "TITLE=$title" >> "$GITHUB_ENV"
          {
            echo "The nightly adapters workflow found the OPA capabilities behind the newest conftest and bumped them ([run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID))."
            echo
            cat "$RUNNER_TEMP/opa-capabilities/report.md"
            echo
            echo "Before merging, read the new built-in functions: one that reaches the network, reads files or the environment, or loads a schema goes into \`deniedBuiltins\` in \`internal/engine/conftest_capabilities.go\`, and into the list in docs/output.md."
            echo
            echo "The workflow started the required checks by dispatch, as GitHub starts none for a pull request a workflow opens. CodeQL can't be dispatched: close and reopen this pull request to start it."
          } > "$RUNNER_TEMP/body.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add -A
          git commit -m "$title"
      - name: Push it and open the pull request
        run: |
          remote="https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          # Each night finds the same bump until it is merged: push it, and
          # start the checks again, only when the branch differs.
          if git fetch --quiet "$remote" "refs/heads/$BRANCH" 2>/dev/null && git diff --quiet FETCH_HEAD HEAD; then
            echo "SAME=true" >> "$GITHUB_ENV"
          else
            git push --force "$remote" "HEAD:refs/heads/$BRANCH"
          fi
          number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" --title "$TITLE" --body-file "$RUNNER_TEMP/body.md"
          fi
      - name: Start its checks
        # What github.token pushes starts no workflow (see schema-metadata.yml).
        if: ${{ env.SAME != 'true' }}
        run: |
          for workflow in test.yml megalinter.yml docs.yml; do
            gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
          done
