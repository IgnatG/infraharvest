# Lists what the sandbox runs may have left in each cloud: resources still
# carrying a sandbox tag or name, and in AWS the kinds that cost the most
# while they exist (running instances, NAT gateways, Elastic IPs, load
# balancers, databases, Redshift, ElastiCache and EKS clusters), tagged or
# not. With delete set, it then deletes what AWS still holds with a sandbox
# tag: the sweep's kinds, ECS services, clusters and task definitions, VPC
# endpoints, and KMS keys, which are scheduled for deletion after the
# shortest wait, 7 days. Runs only when started by hand, and only after a
# reviewer of the sandbox environment approves it. It prints names and IDs
# only, to the run's summary, and no cost figures: the logs and summaries
# of a public repository's runs are public. The costs are in each
# cloud's console.
name: Sandbox leftovers

on:
  workflow_dispatch:
    inputs:
      delete:
        description: Delete what AWS still holds with a sandbox tag
        type: boolean
        default: false

permissions: {}

jobs:
  aws:
    runs-on: ubuntu-latest
    environment: sandbox
    permissions:
      contents: read
      id-token: write # OpenID Connect, for the roles
    # The delete sweeps every run's tags, a live run's too, so it shares
    # sandbox-aws's group and waits for the run in progress to finish. As
    # in any group, a run already waiting in it is cancelled by this one.
    # A listing deletes nothing and runs at once, in a group of its own.
    concurrency:
      group: ${{ inputs.delete && 'sandbox-aws' || format('sandbox-leftovers-{0}', github.run_id) }}
      cancel-in-progress: false
    # The sweep waits for CloudFront to deploy a distribution disabled
    # before it deletes it, which takes up to half an hour.
    timeout-minutes: 90
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      SANDBOX_AWS_SECOND_REGION: ${{ vars.AWS_SECOND_REGION || 'eu-west-1' }}
    steps:
    - name: Check out the code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    # The fixture role, which can list and delete what the estate holds.
    - name: Configure AWS credentials (fixture role)
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{ vars.AWS_FIXTURE_ROLE_ARN }}
        role-session-name: infraharvest-leftovers-${{ github.run_id }}
        aws-region: ${{ vars.AWS_REGION }}
    - name: Leftovers
      run: |
        found=0
        report() {
          if [ -n "$2" ]; then
            found=1
            echo "- $1: $(tr '\t\n' '  ' <<< "$2")" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
        }
        echo "## AWS" >> "$GITHUB_STEP_SUMMARY"
        # us-east-1 too, where the Tagging API lists CloudFront.
        for region in $(printf '%s\n' "$AWS_REGION" "$SANDBOX_AWS_SECOND_REGION" us-east-1 | sort -u); do
          echo "== $region"
          for key in infraharvest-sandbox infraharvest-sandbox-run; do
            report "$region, tagged $key" "$(aws resourcegroupstaggingapi get-resources --region "$region" \
              --tag-filters "Key=$key" --query 'ResourceTagMappingList[].ResourceARN' --output text)"
          done
          report "$region, running instances" "$(aws ec2 describe-instances --region "$region" \
            --filters Name=instance-state-name,Values=pending,running,stopping,stopped \
            --query 'Reservations[].Instances[].InstanceId' --output text)"
          report "$region, NAT gateways" "$(aws ec2 describe-nat-gateways --region "$region" \
            --filter Name=state,Values=pending,available --query 'NatGateways[].NatGatewayId' --output text)"
          report "$region, Elastic IPs" "$(aws ec2 describe-addresses --region "$region" \
            --query 'Addresses[].AllocationId' --output text)"
          report "$region, load balancers" "$(aws elbv2 describe-load-balancers --region "$region" \
            --query 'LoadBalancers[].LoadBalancerName' --output text)"
          report "$region, RDS instances" "$(aws rds describe-db-instances --region "$region" \
            --query 'DBInstances[].DBInstanceIdentifier' --output text)"
          report "$region, Redshift clusters" "$(aws redshift describe-clusters --region "$region" \
            --query 'Clusters[].ClusterIdentifier' --output text)"
          report "$region, ElastiCache replication groups" "$(aws elasticache describe-replication-groups \
            --region "$region" --query 'ReplicationGroups[].ReplicationGroupId' --output text)"
          report "$region, EKS clusters" "$(aws eks list-clusters --region "$region" --query 'clusters[]' --output text)"
        done
        if [ "$found" -eq 0 ]; then
          echo "Nothing left." | tee -a "$GITHUB_STEP_SUMMARY"
        fi
    - name: Delete
      if: ${{ inputs.delete }}
      env:
        RUN_ID: ${{ github.run_id }}
      run: |
        # Not -e: a lookup of what is already gone fails, and mustn't stop
        # the rest.
        set +e
        try() {
          if ! "$@" > /dev/null; then
            echo "failed: $*"
          fi
        }
        regions=$(printf '%s\n' "$AWS_REGION" "$SANDBOX_AWS_SECOND_REGION" us-east-1 | sort -u)
        # Everything every earlier run left with its run tag (see the
        # script).
        # shellcheck disable=SC2086
        .github/scripts/sandbox-aws-sweep.sh $regions
        # And what an estate applied without a run_id left with no run
        # tag, by the estate tag, which the sweep finds for every engine.
        # shellcheck disable=SC2086
        SWEEP_TAG_KEY=infraharvest-sandbox RUN_ID=terraform .github/scripts/sandbox-aws-sweep.sh $regions
        for region in $regions; do
          echo "== $region"
          clusters=()
          while read -r arn; do
            IFS=: read -r _ _ service _ _ resource <<< "$arn"
            case "$service:$resource" in
              ecs:service/*)
                IFS=/ read -r _ cluster name <<< "$resource"
                echo "deleting ECS service $cluster/$name"
                try aws ecs delete-service --region "$region" --cluster "$cluster" --service "$name" --force
                ;;
              ecs:cluster/*) clusters+=("${resource#cluster/}") ;;
              ecs:task-definition/*)
                status=$(aws ecs describe-task-definition --region "$region" --task-definition "$arn" \
                  --query 'taskDefinition.status' --output text 2> /dev/null)
                case "$status" in
                  ACTIVE)
                    try aws ecs deregister-task-definition --region "$region" --task-definition "$arn"
                    try aws ecs delete-task-definitions --region "$region" --task-definitions "$arn"
                    ;;
                  INACTIVE) try aws ecs delete-task-definitions --region "$region" --task-definitions "$arn" ;;
                esac
                ;;
              kms:key/*)
                state=$(aws kms describe-key --region "$region" --key-id "$arn" \
                  --query 'KeyMetadata.[KeyManager,KeyState]' --output text 2> /dev/null)
                echo "KMS key ${resource#key/}: $state"
                case "$state" in
                  CUSTOMER*Enabled | CUSTOMER*Disabled)
                    try aws kms schedule-key-deletion --region "$region" --key-id "$arn" --pending-window-in-days 7
                    ;;
                esac
                ;;
              ec2:vpc-endpoint/*)
                state=$(aws ec2 describe-vpc-endpoints --region "$region" --vpc-endpoint-ids "${resource#vpc-endpoint/}" \
                  --query 'VpcEndpoints[].State' --output text 2> /dev/null)
                if [ -n "$state" ] && [ "$state" != deleted ]; then
                  echo "deleting VPC endpoint ${resource#vpc-endpoint/} ($state)"
                  try aws ec2 delete-vpc-endpoints --region "$region" --vpc-endpoint-ids "${resource#vpc-endpoint/}"
                fi
                ;;
            esac
          done < <(aws resourcegroupstaggingapi get-resources --region "$region" --tag-filters Key=infraharvest-sandbox \
            --query 'ResourceTagMappingList[].ResourceARN' --output text | tr '\t' '\n' | sed '/^$/d')
          # A cluster goes once its services have.
          for cluster in "${clusters[@]}"; do
            status=$(aws ecs describe-clusters --region "$region" --clusters "$cluster" \
              --query 'clusters[].status' --output text 2> /dev/null)
            if [ "$status" = ACTIVE ]; then
              echo "deleting ECS cluster $cluster"
              for _ in $(seq 30); do
                aws ecs delete-cluster --region "$region" --cluster "$cluster" > /dev/null 2>&1 && break
                sleep 10
              done
            fi
          done
        done

  azure:
    runs-on: ubuntu-latest
    environment: sandbox
    permissions:
      id-token: write # OpenID Connect, for the roles
    timeout-minutes: 15
    env:
      SUBSCRIPTION: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'infraharvest-sandbox' }}
    steps:
    - name: Log in to Azure
      uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
      with:
        client-id: ${{ vars.AZURE_READONLY_CLIENT_ID }}
        tenant-id: ${{ vars.AZURE_TENANT_ID }}
        subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    - name: Leftovers
      run: |
        echo "## Azure" >> "$GITHUB_STEP_SUMMARY"
        left=$(az resource list --subscription "$SUBSCRIPTION" -g "$GROUP" --query '[].id' -o tsv)
        if [ -n "$left" ]; then
          echo "- in $GROUP: $(tr '\n' ' ' <<< "$left")" | tee -a "$GITHUB_STEP_SUMMARY"
        else
          echo "Nothing left in $GROUP." | tee -a "$GITHUB_STEP_SUMMARY"
        fi

  google:
    runs-on: ubuntu-latest
    environment: sandbox
    permissions:
      id-token: write # OpenID Connect, for the roles
    timeout-minutes: 15
    env:
      PROJECT: ${{ vars.GOOGLE_PROJECT_ID }}
    steps:
    - name: Authenticate as the read-only service account
      id: readonly
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ vars.GOOGLE_READONLY_SERVICE_ACCOUNT }}
        create_credentials_file: true
        export_environment_variables: false
    # One search over every kind of resource in the project, kept to the
    # sandbox's names (ih-sbx-, and ih_sbx_ for BigQuery datasets), but
    # not the KMS key rings and keys every run leaves, as they can't be
    # deleted; it may still list what a run deleted minutes ago.
    - name: Leftovers
      env:
        CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE: ${{ steps.readonly.outputs.credentials_file_path }}
      run: |
        echo "## Google Cloud" >> "$GITHUB_STEP_SUMMARY"
        left=$(gcloud asset search-all-resources --scope "projects/$PROJECT" \
          --format 'value(assetType,displayName)' | grep -E 'ih[-_]sbx[-_]' | grep -v '^cloudkms[.]googleapis[.]com/' || true)
        if [ -n "$left" ]; then
          echo "- in the project: $(tr '\t\n' '  ' <<< "$left")" | tee -a "$GITHUB_STEP_SUMMARY"
        else
          echo "Nothing left in the project." | tee -a "$GITHUB_STEP_SUMMARY"
        fi
    # Whether the project is billed, and no more: its costs are in the
    # console's billing report.
    - name: Billing
      if: ${{ !cancelled() }}
      env:
        CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE: ${{ steps.readonly.outputs.credentials_file_path }}
      run: |
        {
          echo "### Billing"
          gcloud billing projects describe "$PROJECT" --format 'value(billingEnabled)' 2> /dev/null ||
            echo "The account may not read the project's billing."
        } | tee -a "$GITHUB_STEP_SUMMARY"
