# The sandboxes' backstop, every day and when started by hand: in each
# cloud, deletes what the sweeps cover (.github/scripts/sandbox-*-sweep.sh,
# by the sandbox's tags and ih-sbx- names, both subscriptions or projects
# where the second is set up), then looks for anything of the sandbox's
# still there, by the clouds' own inventories rather than a list of kinds
# (sandbox-*-leftovers.sh), and fails when it finds any. It touches only
# what carries a sandbox tag or name, or is in the Azure estate's own
# resource group; anything else in the accounts is left alone.
#
# The round trips sweep as their last step, but a run that is cancelled,
# times out or loses its runner may not get that far, and the sandbox
# environment, which their jobs run in, waits for the repository admin's
# approval. These jobs run in the sandbox-cleanup environment instead,
# which needs no approval but deploys from main alone, so what runs
# unattended is this file as main has it: a clean-up, which creates
# nothing. Its fixture identities trust sandbox-cleanup's tokens as well
# as sandbox's (see the bootstraps in e2e/testdata/sandbox).
#
# Each cloud's job waits in the concurrency group of that cloud's sandbox
# workflow, so it never sweeps while a run is live. In a group, a run
# that is waiting for its turn is cancelled by the next one to queue, and
# a run waiting for approval holds its place in the group: so the idle
# job first looks for a sandbox run of the cloud that hasn't completed
# (queued, waiting for approval or running), and skips that cloud's
# clean-up when there is one, rather than queue behind it and maybe
# cancel the run queued after it. A sandbox run started later cancels a
# clean-up still waiting, never the other way round, and sweeps for
# itself. The next day's run catches up.
#
# On leftovers, or when a cloud's clean-up fails, it opens an issue for
# that cloud labelled sandbox-leftovers, or updates the one open, and
# closes it once a later run is clean. Everything it prints, in the logs,
# the summary and the issues, is names and IDs only, and no costs: the
# logs, summaries and issues of a public repository are public. The costs
# are in each cloud's console.
name: Sandbox leftovers

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      delete:
        description: Delete what the sweeps cover before looking for leftovers (off only lists them)
        type: boolean
        default: true

permissions: {}

jobs:
  idle:
    runs-on: ubuntu-latest
    permissions:
      actions: read # the sandbox workflows' runs
    timeout-minutes: 5
    outputs:
      aws: ${{ steps.idle.outputs.aws }}
      azure: ${{ steps.idle.outputs.azure }}
      google: ${{ steps.idle.outputs.google }}
    steps:
    - name: Clouds with no sandbox run going
      id: idle
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        REF: ${{ github.ref }}
      run: |
        if [ "$REF" != refs/heads/main ]; then
          echo "::error::The clean-up runs from main alone, as its environment, sandbox-cleanup, does."
          exit 1
        fi
        for cloud in aws azure google; do
          going=$(gh run list --workflow "sandbox-$cloud.yml" --limit 50 --json status \
            --jq '[.[] | select(.status != "completed")] | length')
          if [ "$going" -eq 0 ]; then
            echo "$cloud=true" >> "$GITHUB_OUTPUT"
          else
            echo "$cloud=false" >> "$GITHUB_OUTPUT"
            echo "- $cloud: a sandbox run hasn't completed; its own sweep cleans up, and the next scheduled run checks." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
        done

  aws:
    needs: idle
    if: needs.idle.outputs.aws == 'true'
    runs-on: ubuntu-latest
    environment: sandbox-cleanup
    permissions:
      contents: read
      id-token: write # OpenID Connect, for the fixture role
    concurrency:
      group: sandbox-aws
      cancel-in-progress: false
    # The sweep waits up to half an hour for CloudFront, and up to ten
    # minutes for the network to let go of what used it, twice; the
    # leftovers, a few minutes for what is still going.
    timeout-minutes: 150
    outputs:
      leftovers: ${{ steps.result.outputs.leftovers }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      SANDBOX_AWS_SECOND_REGION: ${{ vars.AWS_SECOND_REGION || 'eu-west-1' }}
      DELETE: ${{ github.event_name == 'schedule' || inputs.delete }}
    steps:
    # Where the leftovers scripts list what they find, for the issue.
    - name: Leftovers file
      run: echo "LEFTOVERS_FILE=$RUNNER_TEMP/leftovers" >> "$GITHUB_ENV"
    - name: Check out the code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Credentials of the fixture role
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{ vars.AWS_FIXTURE_ROLE_ARN }}
        role-session-name: infraharvest-cleanup-${{ github.run_id }}
        role-duration-seconds: 7200
        aws-region: ${{ vars.AWS_REGION }}
    # Every run's tag, which only what a run failed to delete still
    # carries, then the estate tag, every engine's, for what an estate
    # applied without a run_id left. us-east-1 too, where the Tagging API
    # lists CloudFront and Route 53.
    - name: Sweep
      if: env.DELETE == 'true'
      env:
        RUN_ID: ${{ github.run_id }}
      run: |
        .github/scripts/sandbox-aws-sweep.sh "$AWS_REGION" "$SANDBOX_AWS_SECOND_REGION" us-east-1
        SWEEP_TAG_KEY=infraharvest-sandbox RUN_ID=terraform \
          .github/scripts/sandbox-aws-sweep.sh "$AWS_REGION" "$SANDBOX_AWS_SECOND_REGION" us-east-1
    # What the sweep left or doesn't know, by tag key through the Tagging
    # API, deleted through Cloud Control where the ARN names its type.
    - name: Leftovers
      if: ${{ !cancelled() }}
      run: |
        args=()
        if [ "$DELETE" = true ]; then
          args+=(--delete)
        fi
        .github/scripts/sandbox-aws-leftovers.sh "${args[@]}" "$AWS_REGION" "$SANDBOX_AWS_SECOND_REGION" us-east-1
    - name: Result
      id: result
      if: ${{ !cancelled() }}
      run: .github/scripts/sandbox-leftovers-result.sh AWS

  azure:
    needs: idle
    if: needs.idle.outputs.azure == 'true'
    runs-on: ubuntu-latest
    environment: sandbox-cleanup
    permissions:
      contents: read
      id-token: write # OpenID Connect, for the fixture identities
    concurrency:
      group: sandbox-azure
      cancel-in-progress: false
    timeout-minutes: 60
    outputs:
      leftovers: ${{ steps.result.outputs.leftovers }}
    env:
      DELETE: ${{ github.event_name == 'schedule' || inputs.delete }}
    steps:
    # Where the leftovers scripts list what they find, for the issue.
    - name: Leftovers file
      run: echo "LEFTOVERS_FILE=$RUNNER_TEMP/leftovers" >> "$GITHUB_ENV"
    - name: Check out the code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Azure CLI as the fixture identity
      uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
      with:
        client-id: ${{ vars.AZURE_FIXTURE_CLIENT_ID }}
        tenant-id: ${{ vars.AZURE_TENANT_ID }}
        subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    - name: Sweep the resource group
      if: env.DELETE == 'true'
      env:
        ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        SANDBOX_AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'infraharvest-sandbox' }}
      run: .github/scripts/sandbox-azure-sweep.sh
    - name: Leftovers in the subscription
      if: ${{ !cancelled() }}
      env:
        ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        SANDBOX_AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'infraharvest-sandbox' }}
      run: .github/scripts/sandbox-azure-leftovers.sh
    # The second subscription, where the environments estate puts prod,
    # when it is set up. The CLI keeps both sign-ins.
    - name: Azure CLI as the second subscription's fixture identity
      if: ${{ !cancelled() && vars.AZURE_SECOND_SUBSCRIPTION_ID != '' }}
      uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
      with:
        client-id: ${{ vars.AZURE_SECOND_FIXTURE_CLIENT_ID }}
        tenant-id: ${{ vars.AZURE_TENANT_ID }}
        subscription-id: ${{ vars.AZURE_SECOND_SUBSCRIPTION_ID }}
    - name: Sweep the second subscription's resource group
      if: ${{ !cancelled() && env.DELETE == 'true' && vars.AZURE_SECOND_SUBSCRIPTION_ID != '' }}
      env:
        ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SECOND_SUBSCRIPTION_ID }}
        SANDBOX_AZURE_RESOURCE_GROUP: ${{ vars.AZURE_SECOND_RESOURCE_GROUP || 'infraharvest-sandbox' }}
      run: .github/scripts/sandbox-azure-sweep.sh
    - name: Leftovers in the second subscription
      if: ${{ !cancelled() && vars.AZURE_SECOND_SUBSCRIPTION_ID != '' }}
      env:
        ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SECOND_SUBSCRIPTION_ID }}
        SANDBOX_AZURE_RESOURCE_GROUP: ${{ vars.AZURE_SECOND_RESOURCE_GROUP || 'infraharvest-sandbox' }}
      run: .github/scripts/sandbox-azure-leftovers.sh
    - name: Result
      id: result
      if: ${{ !cancelled() }}
      run: .github/scripts/sandbox-leftovers-result.sh Azure

  google:
    needs: idle
    if: needs.idle.outputs.google == 'true'
    runs-on: ubuntu-latest
    environment: sandbox-cleanup
    permissions:
      contents: read
      id-token: write # OpenID Connect, for the fixture service accounts
    concurrency:
      group: sandbox-google
      cancel-in-progress: false
    # Cloud Asset Inventory may take up to half an hour, in each project,
    # to stop listing what was just deleted.
    timeout-minutes: 120
    outputs:
      leftovers: ${{ steps.result.outputs.leftovers }}
    env:
      DELETE: ${{ github.event_name == 'schedule' || inputs.delete }}
      # The region of the estate's regional resources, which the sweep
      # lists by region; the second project shares it.
      SANDBOX_GOOGLE_REGION: ${{ vars.GOOGLE_REGION || 'europe-west2' }}
    steps:
    # Where the leftovers scripts list what they find, for the issue.
    - name: Leftovers file
      run: echo "LEFTOVERS_FILE=$RUNNER_TEMP/leftovers" >> "$GITHUB_ENV"
    - name: Check out the code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Credentials of the fixture service account
      id: fixture
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ vars.GOOGLE_FIXTURE_SERVICE_ACCOUNT }}
        create_credentials_file: true
        export_environment_variables: false
    - name: Sweep the project
      if: env.DELETE == 'true'
      env:
        CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE: ${{ steps.fixture.outputs.credentials_file_path }}
        CLOUDSDK_CORE_PROJECT: ${{ vars.GOOGLE_PROJECT_ID }}
      run: .github/scripts/sandbox-google-sweep.sh
    - name: Leftovers in the project
      if: ${{ !cancelled() && steps.fixture.outcome == 'success' }}
      env:
        CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE: ${{ steps.fixture.outputs.credentials_file_path }}
        CLOUDSDK_CORE_PROJECT: ${{ vars.GOOGLE_PROJECT_ID }}
      run: .github/scripts/sandbox-google-leftovers.sh
    # The second project, where the environments estate puts prod, when
    # it is set up.
    - name: Credentials of the second project's fixture service account
      id: second-fixture
      if: ${{ !cancelled() && vars.GOOGLE_SECOND_PROJECT_ID != '' }}
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        workload_identity_provider: ${{ vars.GOOGLE_SECOND_WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ vars.GOOGLE_SECOND_FIXTURE_SERVICE_ACCOUNT }}
        create_credentials_file: true
        export_environment_variables: false
    - name: Sweep the second project
      if: ${{ !cancelled() && env.DELETE == 'true' && steps.second-fixture.outcome == 'success' }}
      env:
        CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE: ${{ steps.second-fixture.outputs.credentials_file_path }}
        CLOUDSDK_CORE_PROJECT: ${{ vars.GOOGLE_SECOND_PROJECT_ID }}
      run: .github/scripts/sandbox-google-sweep.sh
    - name: Leftovers in the second project
      if: ${{ !cancelled() && steps.second-fixture.outcome == 'success' }}
      env:
        CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE: ${{ steps.second-fixture.outputs.credentials_file_path }}
        CLOUDSDK_CORE_PROJECT: ${{ vars.GOOGLE_SECOND_PROJECT_ID }}
      run: .github/scripts/sandbox-google-leftovers.sh
    - name: Result
      id: result
      if: ${{ !cancelled() }}
      run: .github/scripts/sandbox-leftovers-result.sh Google

  # One issue per cloud, found by its title: opened or updated when the
  # cloud's clean-up failed or found leftovers, closed when it was clean.
  # A cloud skipped, as a sandbox run of it was going, or cancelled, keeps
  # its issue as it is. No cloud credentials here.
  issues:
    needs: [idle, aws, azure, google]
    if: ${{ always() && needs.idle.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    timeout-minutes: 5
    steps:
    - name: Open, update or close the issues
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        AWS_RESULT: ${{ needs.aws.result }}
        AWS_LEFTOVERS: ${{ needs.aws.outputs.leftovers }}
        AZURE_RESULT: ${{ needs.azure.result }}
        AZURE_LEFTOVERS: ${{ needs.azure.outputs.leftovers }}
        GOOGLE_RESULT: ${{ needs.google.result }}
        GOOGLE_LEFTOVERS: ${{ needs.google.outputs.leftovers }}
      run: |
        gh label create sandbox-leftovers --color B60205 \
          --description "What the sandbox clean-up found left in a cloud" > /dev/null 2>&1 || true
        issue() {
          local cloud=$1 result=$2 left=$3 title number body
          title="Sandbox leftovers: $cloud"
          number=$(gh issue list --label sandbox-leftovers --state open --limit 100 --json number,title |
            jq -r --arg title "$title" '[.[] | select(.title == $title) | .number] | first // empty')
          case "$result" in
            success)
              if [ -n "$number" ]; then
                gh issue close "$number" --comment "Clean in $RUN_URL."
                echo "$cloud: clean, closed #$number"
              else
                echo "$cloud: clean"
              fi
              ;;
            failure)
              if [ -z "$left" ]; then
                left="(none listed: the clean-up failed before or while it looked; see the run)"
              fi
              body=$(printf '%s\n\n%s\n\n%s\n%s\n%s\n\n%s\n' \
                "The scheduled sandbox clean-up of $cloud failed, or found what follows still there after deleting what the sweeps cover: $RUN_URL" \
                "Names and IDs only, as by the clean-up's logs:" \
                '```text' "$left" '```' \
                "Delete what is listed, or teach the sweep to (.github/scripts/sandbox-*-sweep.sh). This issue closes when a later run is clean.")
              if [ -n "$number" ]; then
                gh issue edit "$number" --body "$body" > /dev/null
                gh issue comment "$number" --body "Still not clean in $RUN_URL." > /dev/null
                echo "$cloud: not clean, updated #$number"
              else
                gh issue create --title "$title" --label sandbox-leftovers --body "$body"
              fi
              ;;
            *) echo "$cloud: $result, its issue as it was" ;;
          esac
        }
        issue AWS "$AWS_RESULT" "$AWS_LEFTOVERS"
        issue Azure "$AZURE_RESULT" "$AZURE_LEFTOVERS"
        issue "Google Cloud" "$GOOGLE_RESULT" "$GOOGLE_LEFTOVERS"
