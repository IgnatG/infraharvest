# Imports a small estate from the Azure sandbox subscription and checks it
# plans with no changes. Runs only when started by hand, from a
# branch of this repository, once the repository admin approves its job:
# the sandbox environment requires that, and allows no other branches.
# The estate is created in
# its resource group as the fixture identity, imported as the read-only
# identity, which has what permissions/azure grants, and destroyed at the
# end, whatever happened. The identities and the resource group come from
# a one-time bootstrap (e2e/testdata/sandbox/azure-bootstrap); see
# e2e/README.md. The main estate (TestSandboxAzure) is the usual one;
# environments (TestSandboxAzureEnvironments) puts dev in the subscription
# and prod in a second one, which the same bootstrap sets up with
# slot=second, and the import merges them into one root: the first merge
# as the first subscription's read-only identity, then each environment's
# steps as its own.
#
# A cancelled job gets five minutes for its always() steps before GitHub
# stops it, too few for the destroy, and a job that times out or whose
# runner is lost runs no more steps. So the round trip sweeps as its last
# step, whatever happened, and nothing else: a second job in the sandbox
# environment would wait for another approval. What a run that never got
# to its sweep left, the scheduled clean-up (sandbox-leftovers.yml) deletes
# within a day, in the sandbox-cleanup environment, which needs no
# approval.
name: Sandbox (Azure)

on:
  workflow_dispatch:
    inputs:
      estate:
        description: Estate to create and import (environments is a network security group of dev in the subscription and one of prod in the second, merged into one root)
        type: choice
        options: [main, environments]
        default: main
      engine:
        description: Engine to import with
        type: choice
        options: [terraform, tofu]
        default: terraform

permissions: {}

# One run at a time, whatever its estate: each imports the whole of the
# estate's resource group, so another run's estate would show up in its
# import.
# The scheduled clean-up waits in this group too, so it never sweeps while
# a run is live (see sandbox-leftovers.yml).
concurrency:
  group: sandbox-azure
  cancel-in-progress: false

jobs:
  round-trip:
    name: round-trip (${{ inputs.estate }}, ${{ inputs.engine }})
    runs-on: ubuntu-latest
    environment: sandbox
    permissions:
      contents: read
      id-token: write # OpenID Connect, for the identities
    timeout-minutes: 120
    env:
      SANDBOX_ESTATE: ${{ inputs.estate }}
      E2E_ENGINE: ${{ inputs.engine }}
      # Terraform, OpenTofu and infraharvest sign in with the job's GitHub
      # ID token, as the identity ARM_CLIENT_ID names: the test sets it to
      # the fixture's to create the estate and to the read-only one's to
      # import it.
      ARM_USE_OIDC: "true"
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      SANDBOX_AZURE_FIXTURE_CLIENT_ID: ${{ vars.AZURE_FIXTURE_CLIENT_ID }}
      SANDBOX_AZURE_READONLY_CLIENT_ID: ${{ vars.AZURE_READONLY_CLIENT_ID }}
      SANDBOX_AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'infraharvest-sandbox' }}
      # The second subscription, which the environments estate puts prod in.
      SANDBOX_AZURE_SECOND_SUBSCRIPTION_ID: ${{ vars.AZURE_SECOND_SUBSCRIPTION_ID }}
      SANDBOX_AZURE_SECOND_FIXTURE_CLIENT_ID: ${{ vars.AZURE_SECOND_FIXTURE_CLIENT_ID }}
      SANDBOX_AZURE_SECOND_READONLY_CLIENT_ID: ${{ vars.AZURE_SECOND_READONLY_CLIENT_ID }}
      SANDBOX_AZURE_SECOND_RESOURCE_GROUP: ${{ vars.AZURE_SECOND_RESOURCE_GROUP || 'infraharvest-sandbox' }}
    steps:
    # First in the run's summary, where it shows at once.
    - name: Clean-up
      run: echo "If this job is cancelled, times out or loses its runner before its last step, the scheduled clean-up (sandbox-leftovers) sweeps what the run created within a day." >> "$GITHUB_STEP_SUMMARY"
    - name: Directories
      run: |
        {
          echo "SANDBOX_FIXTURE_DIR=$RUNNER_TEMP/fixture-azure"
          echo "SANDBOX_PLUGIN_CACHE=$RUNNER_TEMP/plugins"
          echo "SANDBOX_OUTPUT_DIR=$RUNNER_TEMP/out"
          echo "TF_PLUGIN_CACHE_DIR=$RUNNER_TEMP/plugins"
        } >> "$GITHUB_ENV"
    - name: Check out the code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: true
    # The gate runs the scanners it finds (G5), as in the e2e jobs.
    - name: Install the engine and scanners
      uses: ./.github/actions/setup-engines
      with:
        engine: ${{ inputs.engine }}
        scanners: "true"
    # The Azure CLI, as the fixture identity, for the sweeps; Terraform and
    # infraharvest don't use it.
    - name: Azure CLI as the fixture identity
      uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
      with:
        client-id: ${{ vars.AZURE_FIXTURE_CLIENT_ID }}
        tenant-id: ${{ vars.AZURE_TENANT_ID }}
        subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    # The CLI keeps both sign-ins, each for its own subscription.
    - name: Azure CLI as the second subscription's fixture identity
      if: inputs.estate == 'environments'
      uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
      with:
        client-id: ${{ vars.AZURE_SECOND_FIXTURE_CLIENT_ID }}
        tenant-id: ${{ vars.AZURE_TENANT_ID }}
        subscription-id: ${{ vars.AZURE_SECOND_SUBSCRIPTION_ID }}
    # What an earlier run may have left: the resource groups hold nothing
    # between runs. What they hold is swept at the end of the run.
    - name: Leftovers
      run: |
        groups=("$ARM_SUBSCRIPTION_ID $SANDBOX_AZURE_RESOURCE_GROUP")
        if [ "$SANDBOX_ESTATE" = environments ]; then
          groups+=("$SANDBOX_AZURE_SECOND_SUBSCRIPTION_ID $SANDBOX_AZURE_SECOND_RESOURCE_GROUP")
        fi
        for g in "${groups[@]}"; do
          read -r sub group <<< "$g"
          left=$(az resource list --subscription "$sub" -g "$group" --query '[].id' -o tsv)
          if [ -n "$left" ]; then
            echo "::warning::Resources in $group of $sub before the run: $left"
          fi
          # Role assignments and custom roles aren't resources of the group,
          # and take no tags: the estate's start with its prefix.
          scope="/subscriptions/$sub/resourceGroups/$group"
          roles=$(az role definition list --subscription "$sub" --custom-role-only true --scope "$scope" --query "[?starts_with(roleName, 'ih-sbx-')].roleName" -o tsv)
          if [ -n "$roles" ]; then
            echo "::warning::Custom roles in $group of $sub before the run: $roles"
          fi
        done
    - name: Round trip
      env:
        # Fail, rather than skip, if the test has nothing to run against.
        INFRAHARVEST_E2E_REQUIRED: "1"
      run: |
        case "$SANDBOX_ESTATE" in
          main) test=TestSandboxAzure ;;
          environments) test=TestSandboxAzureEnvironments ;;
          *) echo "::error::Unknown estate $SANDBOX_ESTATE"; exit 1 ;;
        esac
        go test -tags e2e,sandbox,minimal,azure -run "^${test}\$" -timeout 90m -v ./e2e/
    - name: Destroy the estate
      if: always()
      env:
        ARM_CLIENT_ID: ${{ vars.AZURE_FIXTURE_CLIENT_ID }}
      run: |
        if [ ! -f "$SANDBOX_FIXTURE_DIR/terraform.tfstate" ]; then
          echo "No estate state: nothing was created."
          exit 0
        fi
        cd "$SANDBOX_FIXTURE_DIR"
        vars=(-var "suffix=$E2E_ENGINE" -var "resource_group=$SANDBOX_AZURE_RESOURCE_GROUP")
        if [ "$SANDBOX_ESTATE" = environments ]; then
          vars+=(-var "dev_subscription_id=$ARM_SUBSCRIPTION_ID" -var "dev_client_id=$SANDBOX_AZURE_FIXTURE_CLIENT_ID")
          vars+=(-var "prod_subscription_id=$SANDBOX_AZURE_SECOND_SUBSCRIPTION_ID" -var "prod_client_id=$SANDBOX_AZURE_SECOND_FIXTURE_CLIENT_ID")
        fi
        "$E2E_ENGINE" init -input=false
        # A destroy that fails, as on a dependency AWS, Azure or Google Cloud
        # still deletes, is tried twice more before what is left counts.
        for attempt in 1 2 3; do
          "$E2E_ENGINE" destroy -auto-approve -input=false -lock-timeout=5m "${vars[@]}" && break
          echo "::warning::destroy attempt $attempt failed"
          sleep 60
        done
        left=$("$E2E_ENGINE" state list)
        if [ -n "$left" ]; then
          echo "::error::Left in the estate: $left"
          exit 1
        fi
    # The CLI's first sign-in may have run out by now: its federated token
    # lasts minutes, its access token an hour.
    - name: Azure CLI as the fixture identity, again
      if: always()
      uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
      with:
        client-id: ${{ vars.AZURE_FIXTURE_CLIENT_ID }}
        tenant-id: ${{ vars.AZURE_TENANT_ID }}
        subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    # Whatever happened, and in this job, which needs no second approval:
    # deletes what Terraform's state doesn't hold, such as a resource
    # whose creation failed half-way, and what an earlier run left (see the script).
    - name: Sweep the resource group
      if: always()
      run: .github/scripts/sandbox-azure-sweep.sh
    - name: Azure CLI as the second subscription's fixture identity, again
      if: always() && inputs.estate == 'environments'
      uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
      with:
        client-id: ${{ vars.AZURE_SECOND_FIXTURE_CLIENT_ID }}
        tenant-id: ${{ vars.AZURE_TENANT_ID }}
        subscription-id: ${{ vars.AZURE_SECOND_SUBSCRIPTION_ID }}
    - name: Sweep the second subscription's resource group
      if: always() && inputs.estate == 'environments'
      env:
        ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SECOND_SUBSCRIPTION_ID }}
        SANDBOX_AZURE_RESOURCE_GROUP: ${{ vars.AZURE_SECOND_RESOURCE_GROUP || 'infraharvest-sandbox' }}
      run: .github/scripts/sandbox-azure-sweep.sh
    # The generated configuration, encrypted to the OpenPGP key in the
    # SANDBOX_OUTPUT_KEY variable, so that only its owner can read it: the
    # artifacts of a public repository are public. Without the variable,
    # nothing more is kept. Never any state, .terraform directory or saved
    # inventory (.infraharvest/), which lists the estate as state does. The
    # generated vars/<env>/*.tfvars hold no secrets, and are kept.
    - name: Encrypt the output
      if: always() && vars.SANDBOX_OUTPUT_KEY != ''
      env:
        OUTPUT_KEY: ${{ vars.SANDBOX_OUTPUT_KEY }}
      run: |
        if [ ! -d "$SANDBOX_OUTPUT_DIR" ]; then
          echo "no output to keep"
          exit 0
        fi
        printf '%s\n' "$OUTPUT_KEY" > "$RUNNER_TEMP/output-key.asc"
        tar -C "$SANDBOX_OUTPUT_DIR" --exclude=.terraform --exclude=.infraharvest --exclude='*.tfstate*' -czf "$RUNNER_TEMP/output.tar.gz" .
        gpg --batch --yes --trust-model always --recipient-file "$RUNNER_TEMP/output-key.asc" \
          --output "$RUNNER_TEMP/output.tar.gz.gpg" --encrypt "$RUNNER_TEMP/output.tar.gz"
        rm "$RUNNER_TEMP/output.tar.gz"
    - name: Upload the encrypted output
      if: always() && vars.SANDBOX_OUTPUT_KEY != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: sandbox-azure-${{ inputs.estate }}-${{ inputs.engine }}-output
        path: ${{ runner.temp }}/output.tar.gz.gpg
        if-no-files-found: ignore
        retention-days: 7
    # The report as it is. The configuration describes the estate and the
    # artifacts of a public repository are public, so it is kept only
    # encrypted (above).
    - name: Upload the report
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: sandbox-azure-${{ inputs.estate }}-${{ inputs.engine }}
        path: |
          ${{ env.SANDBOX_OUTPUT_DIR }}/**/_reports/report.md
          ${{ env.SANDBOX_OUTPUT_DIR }}/**/_reports/report.json
        if-no-files-found: ignore
        retention-days: 7
