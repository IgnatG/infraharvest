# Imports a small estate from the Azure sandbox subscription and checks it
# plans with no changes. Runs only when started by hand, and only after a
# reviewer of the sandbox environment approves it. The estate is created in
# its resource group as the fixture identity, imported as the read-only
# identity, which has what permissions/azure grants, and destroyed at the
# end, whatever happened. The identities and the resource group come from
# a one-time bootstrap (e2e/testdata/sandbox/azure-bootstrap); see
# e2e/README.md.
name: Sandbox (Azure)

on:
  workflow_dispatch:
    inputs:
      engine:
        description: Engine to import with
        type: choice
        options: [terraform, tofu]
        default: terraform

permissions:
  contents: read
  id-token: write # OpenID Connect, for the identities

# One run at a time: each imports the whole of the estate's resource group,
# so another run's estate would show up in its import.
concurrency:
  group: sandbox-azure
  cancel-in-progress: false

jobs:
  round-trip:
    name: round-trip (${{ inputs.engine }})
    runs-on: ubuntu-latest
    environment: sandbox
    timeout-minutes: 120
    env:
      E2E_ENGINE: ${{ inputs.engine }}
      # Terraform, OpenTofu and infraharvest sign in with the job's GitHub
      # ID token, as the identity ARM_CLIENT_ID names: the test sets it to
      # the fixture's to create the estate and to the read-only one's to
      # import it.
      ARM_USE_OIDC: "true"
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      SANDBOX_AZURE_FIXTURE_CLIENT_ID: ${{ vars.AZURE_FIXTURE_CLIENT_ID }}
      SANDBOX_AZURE_READONLY_CLIENT_ID: ${{ vars.AZURE_READONLY_CLIENT_ID }}
      SANDBOX_AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'infraharvest-sandbox' }}
    steps:
    - name: Directories
      run: |
        {
          echo "SANDBOX_FIXTURE_DIR=$RUNNER_TEMP/fixture-azure"
          echo "SANDBOX_PLUGIN_CACHE=$RUNNER_TEMP/plugins"
          echo "SANDBOX_OUTPUT_DIR=$RUNNER_TEMP/out"
          echo "TF_PLUGIN_CACHE_DIR=$RUNNER_TEMP/plugins"
        } >> "$GITHUB_ENV"
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: true
    # The gate runs the scanners it finds (G5), as in the e2e jobs.
    - uses: ./.github/actions/setup-engines
      with:
        engine: ${{ inputs.engine }}
        scanners: "true"
    # The Azure CLI, as the fixture identity, for the sweeps; Terraform and
    # infraharvest don't use it.
    - name: Azure CLI as the fixture identity
      uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
      with:
        client-id: ${{ vars.AZURE_FIXTURE_CLIENT_ID }}
        tenant-id: ${{ vars.AZURE_TENANT_ID }}
        subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    # What an earlier run may have left: the resource group holds nothing
    # between runs. What it holds is swept at the end of the run.
    - name: Leftovers
      id: leftovers
      run: |
        left=$(az resource list --subscription "$ARM_SUBSCRIPTION_ID" -g "$SANDBOX_AZURE_RESOURCE_GROUP" --query '[].id' -o tsv)
        if [ -n "$left" ]; then
          echo "::warning::Resources in $SANDBOX_AZURE_RESOURCE_GROUP before the run: $left"
          echo "found=true" >> "$GITHUB_OUTPUT"
        fi
    - name: Round trip
      env:
        # Fail, rather than skip, if the test has nothing to run against.
        INFRAHARVEST_E2E_REQUIRED: "1"
      run: go test -tags e2e,sandbox,minimal,azure -run '^TestSandboxAzure$' -timeout 90m -v ./e2e/
    - name: Destroy the estate
      if: always()
      env:
        ARM_CLIENT_ID: ${{ vars.AZURE_FIXTURE_CLIENT_ID }}
      run: |
        if [ ! -f "$SANDBOX_FIXTURE_DIR/terraform.tfstate" ]; then
          echo "No estate state: nothing was created."
          exit 0
        fi
        cd "$SANDBOX_FIXTURE_DIR"
        vars=(-var "suffix=$E2E_ENGINE" -var "resource_group=$SANDBOX_AZURE_RESOURCE_GROUP")
        "$E2E_ENGINE" init -input=false
        # A destroy that fails, as on a dependency AWS, Azure or Google Cloud
        # still deletes, is tried twice more before what is left counts.
        for attempt in 1 2 3; do
          "$E2E_ENGINE" destroy -auto-approve -input=false -lock-timeout=5m "${vars[@]}" && break
          echo "::warning::destroy attempt $attempt failed"
          sleep 60
        done
        left=$("$E2E_ENGINE" state list)
        if [ -n "$left" ]; then
          echo "::error::Left in the estate: $left"
          exit 1
        fi
    # The CLI's first sign-in may have run out by now: its federated token
    # lasts minutes, its access token an hour.
    - name: Azure CLI as the fixture identity, again
      if: failure() || cancelled() || steps.leftovers.outputs.found == 'true'
      uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
      with:
        client-id: ${{ vars.AZURE_FIXTURE_CLIENT_ID }}
        tenant-id: ${{ vars.AZURE_TENANT_ID }}
        subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    # When the run failed, deletes what Terraform's state doesn't hold,
    # such as a resource whose creation failed half-way, and what an earlier
    # run left: the locks first, which would stop the rest, then every
    # resource tagged infraharvest-sandbox, whichever engine's run made it
    # (runs never overlap), a few rounds over, as some can only go once what
    # uses them has. The resource group itself stays.
    - name: Sweep the resource group
      if: failure() || cancelled() || steps.leftovers.outputs.found == 'true'
      run: |
        sub=(--subscription "$ARM_SUBSCRIPTION_ID")
        locks=$(az lock list "${sub[@]}" -g "$SANDBOX_AZURE_RESOURCE_GROUP" --query '[].id' -o tsv)
        while IFS= read -r lock; do
          if [ -n "$lock" ]; then
            az lock delete "${sub[@]}" --ids "$lock" || true
          fi
        done <<< "$locks"
        query="[?tags.\"infraharvest-sandbox\" != null].id"
        for _ in 1 2 3; do
          ids=$(az resource list "${sub[@]}" -g "$SANDBOX_AZURE_RESOURCE_GROUP" --query "$query" -o tsv)
          if [ -z "$ids" ]; then
            break
          fi
          while IFS= read -r id; do
            az resource delete "${sub[@]}" --ids "$id" || true
          done <<< "$ids"
        done
        left=$(az resource list "${sub[@]}" -g "$SANDBOX_AZURE_RESOURCE_GROUP" --query '[].id' -o tsv)
        if [ -n "$left" ]; then
          echo "::error::Left in $SANDBOX_AZURE_RESOURCE_GROUP: $left"
          exit 1
        fi
    # The generated configuration, encrypted to the OpenPGP key in the
    # SANDBOX_OUTPUT_KEY variable, so that only its owner can read it: the
    # artifacts of a public repository are public. Without the variable,
    # nothing more is kept. Never any state, .terraform directory or
    # variables file.
    - name: Encrypt the output
      if: always() && vars.SANDBOX_OUTPUT_KEY != ''
      env:
        OUTPUT_KEY: ${{ vars.SANDBOX_OUTPUT_KEY }}
      run: |
        if [ ! -d "$SANDBOX_OUTPUT_DIR" ]; then
          echo "no output to keep"
          exit 0
        fi
        printf '%s\n' "$OUTPUT_KEY" > "$RUNNER_TEMP/output-key.asc"
        tar -C "$SANDBOX_OUTPUT_DIR" --exclude=.terraform --exclude='*.tfstate*' --exclude='*.tfvars*' -czf "$RUNNER_TEMP/output.tar.gz" .
        gpg --batch --yes --trust-model always --recipient-file "$RUNNER_TEMP/output-key.asc" \
          --output "$RUNNER_TEMP/output.tar.gz.gpg" --encrypt "$RUNNER_TEMP/output.tar.gz"
        rm "$RUNNER_TEMP/output.tar.gz"
    - name: Upload the encrypted output
      if: always() && vars.SANDBOX_OUTPUT_KEY != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: sandbox-azure-${{ inputs.engine }}-output
        path: ${{ runner.temp }}/output.tar.gz.gpg
        if-no-files-found: ignore
        retention-days: 7
    # The report as it is. The configuration describes the estate and the
    # artifacts of a public repository are public, so it is kept only
    # encrypted (above).
    - name: Upload the report
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: sandbox-azure-${{ inputs.engine }}
        path: |
          ${{ env.SANDBOX_OUTPUT_DIR }}/**/report/report.md
          ${{ env.SANDBOX_OUTPUT_DIR }}/**/report/coverage.json
        if-no-files-found: ignore
        retention-days: 7
