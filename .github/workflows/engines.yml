name: engines

# Checks every night whether the Terraform and OpenTofu versions the release
# image pins (Dockerfile) are the newest releases. When one isn't, it opens
# (or updates) an engine-update issue with the new versions and the SHA-256
# lines to paste into the Dockerfile; it closes the issue once both match.
# CI's own jobs install the newest releases on every run, so they test a
# new version before the image moves to it.

on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # open, update and close the engine-update issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare the pinned versions with the newest releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pinned() { sed -n "s/^ARG $1=//p" Dockerfile; }
          terraform_pinned=$(pinned TERRAFORM_VERSION)
          tofu_pinned=$(pinned TOFU_VERSION)
          terraform_latest=$(curl -fsS https://checkpoint-api.hashicorp.com/v1/check/terraform | jq -r .current_version)
          tofu_latest=$(gh api repos/opentofu/opentofu/releases/latest --jq '.tag_name | ltrimstr("v")')
          body="$RUNNER_TEMP/body.md"
          : > "$body"
          if [[ "$terraform_latest" != "$terraform_pinned" ]]; then
            sums=$(curl -fsS "https://releases.hashicorp.com/terraform/${terraform_latest}/terraform_${terraform_latest}_SHA256SUMS")
            {
              echo "Terraform: the Dockerfile pins $terraform_pinned; the newest release is $terraform_latest."
              echo
              echo '```dockerfile'
              echo "ARG TERRAFORM_VERSION=$terraform_latest"
              for arch in amd64 arm64; do
                echo "ARG TERRAFORM_SHA256_${arch}=$(awk -v f="terraform_${terraform_latest}_linux_${arch}.zip" '$2 == f {print $1}' <<<"$sums")"
              done
              echo '```'
              echo
            } >> "$body"
          fi
          if [[ "$tofu_latest" != "$tofu_pinned" ]]; then
            sums=$(curl -fsSL "https://github.com/opentofu/opentofu/releases/download/v${tofu_latest}/tofu_${tofu_latest}_SHA256SUMS")
            {
              echo "OpenTofu: the Dockerfile pins $tofu_pinned; the newest release is $tofu_latest."
              echo
              echo '```dockerfile'
              echo "ARG TOFU_VERSION=$tofu_latest"
              for arch in amd64 arm64; do
                echo "ARG TOFU_SHA256_${arch}=$(awk -v f="tofu_${tofu_latest}_linux_${arch}.tar.gz" '$2 == f {print $1}' <<<"$sums")"
              done
              echo '```'
              echo
            } >> "$body"
          fi
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --label engine-update --state open --json number --jq '.[0].number // empty')
          if [[ ! -s "$body" ]]; then
            echo "The Dockerfile pins Terraform $terraform_pinned and OpenTofu $tofu_pinned, the newest releases."
            if [[ -n "$issue" ]]; then
              gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --comment "The Dockerfile pins the newest Terraform and OpenTofu releases again."
            fi
            exit 0
          fi
          cat "$body"
          if [[ -n "$issue" ]]; then
            gh issue edit "$issue" --repo "$GITHUB_REPOSITORY" --body-file "$body"
          else
            gh label create engine-update --repo "$GITHUB_REPOSITORY" --color 5319e7 --description "Terraform or OpenTofu has a newer release than the image pins" --force
            gh issue create --repo "$GITHUB_REPOSITORY" --label engine-update --title "Release image: newer Terraform or OpenTofu release" --body-file "$body"
          fi
