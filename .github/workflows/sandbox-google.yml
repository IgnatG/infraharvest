# Imports a small estate from the Google Cloud sandbox project and checks
# it plans with no changes. Runs only when started by hand, and only after
# a reviewer of the sandbox environment approves it. The estate is created
# as the fixture service account, imported as the read-only one, which has
# what permissions/google grants, and destroyed at the end, whatever
# happened. The service accounts, the workload identity provider they
# trust and the project's APIs come from a one-time bootstrap
# (e2e/testdata/sandbox/google-bootstrap); see e2e/README.md.
#
# A cancelled job gets five minutes for its always() steps before GitHub
# stops it, too few for the destroy, and a job that times out or whose
# runner is lost runs no more steps. So when the round trip doesn't
# succeed, the clean-up job, a job of its own with its full timeout,
# sweeps the project as the round trip does when it fails. Like any job
# of the sandbox environment, it waits for a reviewer to approve it
# first, after a cancel too, and the run, and so the next one, waits
# with it.
name: Sandbox (Google Cloud)

on:
  workflow_dispatch:
    inputs:
      engine:
        description: Engine to import with
        type: choice
        options: [terraform, tofu]
        default: terraform

permissions:
  contents: read
  id-token: write # OpenID Connect, for the service accounts

# One run at a time: each imports the whole project, so another run's
# estate would show up in its import.
# The group holds the whole run, its clean-up job too, so the next run
# starts only once this one's estate is swept.
concurrency:
  group: sandbox-google
  cancel-in-progress: false

jobs:
  round-trip:
    name: round-trip (${{ inputs.engine }})
    runs-on: ubuntu-latest
    environment: sandbox
    timeout-minutes: 120
    env:
      E2E_ENGINE: ${{ inputs.engine }}
      SANDBOX_GOOGLE_PROJECT: ${{ vars.GOOGLE_PROJECT_ID }}
      SANDBOX_GOOGLE_REGION: ${{ vars.GOOGLE_REGION || 'europe-west2' }}
      SANDBOX_GOOGLE_READONLY_SERVICE_ACCOUNT: ${{ vars.GOOGLE_READONLY_SERVICE_ACCOUNT }}
    steps:
    # First in the run's summary, where it shows at once.
    - name: Clean-up
      run: echo "If this job is cancelled, times out or fails, the clean-up job sweeps what the run created, once a reviewer of the sandbox environment approves it." >> "$GITHUB_STEP_SUMMARY"
    - name: Directories
      run: |
        {
          echo "SANDBOX_FIXTURE_DIR=$RUNNER_TEMP/fixture-google"
          echo "SANDBOX_PLUGIN_CACHE=$RUNNER_TEMP/plugins"
          echo "SANDBOX_OUTPUT_DIR=$RUNNER_TEMP/out"
          echo "TF_PLUGIN_CACHE_DIR=$RUNNER_TEMP/plugins"
        } >> "$GITHUB_ENV"
    - name: Check out the code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: true
    # The gate runs the scanners it finds (G5), as in the e2e jobs.
    - name: Install the engine and scanners
      uses: ./.github/actions/setup-engines
      with:
        engine: ${{ inputs.engine }}
        scanners: "true"
    # A credentials file for each service account: a workload identity
    # federation configuration that trades the job's GitHub ID token, which
    # it fetches again when it needs to, for the account's tokens. No key,
    # and nothing exported: each step names the file it signs in with. The
    # files are in the workspace, which isn't uploaded, and are deleted
    # when the job ends.
    - name: Credentials of the fixture service account
      id: fixture
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ vars.GOOGLE_FIXTURE_SERVICE_ACCOUNT }}
        create_credentials_file: true
        export_environment_variables: false
    - name: Credentials of the read-only service account
      id: readonly
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ vars.GOOGLE_READONLY_SERVICE_ACCOUNT }}
        create_credentials_file: true
        export_environment_variables: false
    # What an earlier run may have left: the project holds nothing named
    # after the sandbox between runs. One search, as the read-only account,
    # with the gcloud CLI of the runner image; it may still list what an
    # earlier run deleted minutes ago. What it finds is swept at the end of
    # the run.
    - name: Leftovers
      id: leftovers
      env:
        CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE: ${{ steps.readonly.outputs.credentials_file_path }}
      run: |
        types=compute.googleapis.com/Network,compute.googleapis.com/Subnetwork,compute.googleapis.com/Firewall
        types+=,compute.googleapis.com/Router,storage.googleapis.com/Bucket,pubsub.googleapis.com/Topic
        types+=,pubsub.googleapis.com/Subscription,dns.googleapis.com/ManagedZone,iam.googleapis.com/ServiceAccount
        types+=,compute.googleapis.com/Instance,compute.googleapis.com/Disk,compute.googleapis.com/FirewallPolicy
        left=$(gcloud asset search-all-resources --scope "projects/$SANDBOX_GOOGLE_PROJECT" --asset-types "$types" \
          --format 'value(name,displayName)' | grep 'ih-sbx-' || true)
        if [ -n "$left" ]; then
          echo "::warning::Sandbox resources in $SANDBOX_GOOGLE_PROJECT before the run: $left"
          echo "found=true" >> "$GITHUB_OUTPUT"
        fi
    - name: Round trip
      env:
        # Fail, rather than skip, if the test has nothing to run against.
        INFRAHARVEST_E2E_REQUIRED: "1"
        SANDBOX_GOOGLE_FIXTURE_CREDENTIALS: ${{ steps.fixture.outputs.credentials_file_path }}
        SANDBOX_GOOGLE_READONLY_CREDENTIALS: ${{ steps.readonly.outputs.credentials_file_path }}
      run: go test -tags e2e,sandbox,minimal,google -run '^TestSandboxGoogle$' -timeout 90m -v ./e2e/
    - name: Destroy the estate
      if: always()
      env:
        GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.fixture.outputs.credentials_file_path }}
      run: |
        if [ ! -f "$SANDBOX_FIXTURE_DIR/terraform.tfstate" ]; then
          echo "No estate state: nothing was created."
          exit 0
        fi
        cd "$SANDBOX_FIXTURE_DIR"
        vars=(-var "suffix=$E2E_ENGINE" -var "project=$SANDBOX_GOOGLE_PROJECT" -var "region=$SANDBOX_GOOGLE_REGION")
        "$E2E_ENGINE" init -input=false
        # A destroy that fails, as on a dependency AWS, Azure or Google Cloud
        # still deletes, is tried twice more before what is left counts.
        for attempt in 1 2 3; do
          "$E2E_ENGINE" destroy -auto-approve -input=false -lock-timeout=5m "${vars[@]}" && break
          echo "::warning::destroy attempt $attempt failed"
          sleep 60
        done
        left=$("$E2E_ENGINE" state list)
        if [ -n "$left" ]; then
          echo "::error::Left in the estate: $left"
          exit 1
        fi
    # When the run failed, or an earlier run left something: deletes what
    # Terraform's state doesn't hold, such as a resource whose creation
    # failed half-way, and what an earlier run left, by name, as the
    # fixture service account (see the script).
    - name: Sweep the project
      if: failure() || cancelled() || steps.leftovers.outputs.found == 'true'
      env:
        CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE: ${{ steps.fixture.outputs.credentials_file_path }}
        CLOUDSDK_CORE_PROJECT: ${{ vars.GOOGLE_PROJECT_ID }}
      run: .github/scripts/sandbox-google-sweep.sh
    # The generated configuration, encrypted to the OpenPGP key in the
    # SANDBOX_OUTPUT_KEY variable, so that only its owner can read it: the
    # artifacts of a public repository are public. Without the variable,
    # nothing more is kept. Never any state, .terraform directory, variables
    # file or saved inventory (.infraharvest/), which lists the estate as
    # state does.
    - name: Encrypt the output
      if: always() && vars.SANDBOX_OUTPUT_KEY != ''
      env:
        OUTPUT_KEY: ${{ vars.SANDBOX_OUTPUT_KEY }}
      run: |
        if [ ! -d "$SANDBOX_OUTPUT_DIR" ]; then
          echo "no output to keep"
          exit 0
        fi
        printf '%s\n' "$OUTPUT_KEY" > "$RUNNER_TEMP/output-key.asc"
        tar -C "$SANDBOX_OUTPUT_DIR" --exclude=.terraform --exclude=.infraharvest --exclude='*.tfstate*' --exclude='*.tfvars*' -czf "$RUNNER_TEMP/output.tar.gz" .
        gpg --batch --yes --trust-model always --recipient-file "$RUNNER_TEMP/output-key.asc" \
          --output "$RUNNER_TEMP/output.tar.gz.gpg" --encrypt "$RUNNER_TEMP/output.tar.gz"
        rm "$RUNNER_TEMP/output.tar.gz"
    - name: Upload the encrypted output
      if: always() && vars.SANDBOX_OUTPUT_KEY != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: sandbox-google-${{ inputs.engine }}-output
        path: ${{ runner.temp }}/output.tar.gz.gpg
        if-no-files-found: ignore
        retention-days: 7
    # The report as it is. The configuration describes the estate and the
    # artifacts of a public repository are public, so it is kept only
    # encrypted (above).
    - name: Upload the report
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: sandbox-google-${{ inputs.engine }}
        path: |
          ${{ env.SANDBOX_OUTPUT_DIR }}/**/report/report.md
          ${{ env.SANDBOX_OUTPUT_DIR }}/**/report/coverage.json
        if-no-files-found: ignore
        retention-days: 7

  # When the round trip was cancelled, timed out or failed: its destroy
  # and sweep may not have run, or not to the end. always() starts this
  # job after a cancel too, and keeps it running if the run is cancelled
  # again; a reviewer of the sandbox environment approves it first, as for
  # the round trip, or rejects it to skip it. The state was on the round
  # trip's runner, and is never uploaded (the artifacts of a public
  # repository are public), so it sweeps by name alone.
  clean-up:
    needs: round-trip
    if: always() && needs.round-trip.result != 'success'
    runs-on: ubuntu-latest
    environment: sandbox
    permissions:
      contents: read
      id-token: write # OpenID Connect, for the fixture service account
    timeout-minutes: 30
    steps:
    - name: Why
      env:
        RESULT: ${{ needs.round-trip.result }}
      run: |
        echo "The round trip ended $RESULT: sweeping the project." >> "$GITHUB_STEP_SUMMARY"
    - name: Check out the code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Credentials of the fixture service account
      id: fixture
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ vars.GOOGLE_FIXTURE_SERVICE_ACCOUNT }}
        create_credentials_file: true
        export_environment_variables: false
    - name: Sweep the project
      env:
        CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE: ${{ steps.fixture.outputs.credentials_file_path }}
        CLOUDSDK_CORE_PROJECT: ${{ vars.GOOGLE_PROJECT_ID }}
      run: .github/scripts/sandbox-google-sweep.sh
