# Imports a small estate from the AWS sandbox account and checks it plans
# with no changes. Runs only when started by hand, and only after a
# reviewer of the sandbox environment approves it. The estate is created as
# the fixture role, imported as the read-only role, and destroyed at the
# end, whatever happened. The main estate (TestSandboxAWS) is the usual
# one; clusters (TestSandboxAWSClusters) holds an RDS database, an
# ElastiCache replication group and an EKS cluster, which take longer and
# cost more, so it runs only when asked for; so does data
# (TestSandboxAWSData): an EC2 instance, a Lambda function, an RDS
# database, a Redshift cluster and an S3 bucket, destroyed straight after.
name: sandbox-aws

on:
  workflow_dispatch:
    inputs:
      estate:
        description: Estate to create and import (clusters is RDS, ElastiCache and EKS; data is EC2, Lambda, RDS, Redshift and S3; both slower and dearer)
        type: choice
        options: [main, clusters, data]
        default: main
      engine:
        description: Engine to import with
        type: choice
        options: [terraform, tofu]
        default: terraform

permissions:
  contents: read
  id-token: write # OpenID Connect, for the roles

# One run at a time: each imports the whole of its regions, so another
# run's estate would show up in its import, and change between its runs.
concurrency:
  group: sandbox-aws
  cancel-in-progress: false

# The Terraform and OpenTofu the jobs install, the ones the release image
# copies: bump them with the Dockerfile's hashicorp/terraform and
# opentofu/opentofu tags, which dependabot tracks.
env:
  TERRAFORM_VERSION: 1.16.6
  TOFU_VERSION: 1.13.1

jobs:
  round-trip:
    name: round-trip (${{ inputs.estate }}, ${{ inputs.engine }})
    runs-on: ubuntu-latest
    environment: sandbox
    # go test gets the test's own deadline plus the 30 minutes its cleanup
    # destroy has, and a margin, so that it never stops a destroy halfway;
    # the job, another half an hour for the destroy step below and one for
    # the sweep.
    timeout-minutes: ${{ inputs.estate == 'data' && 160 || 190 }}
    env:
      SANDBOX_ESTATE: ${{ inputs.estate }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      # The estate's second region, which the import keeps apart.
      SANDBOX_AWS_SECOND_REGION: ${{ vars.AWS_SECOND_REGION || 'eu-west-1' }}
      E2E_ENGINE: ${{ inputs.engine }}
      SANDBOX_AWS_FIXTURE_PROFILE: fixture
      SANDBOX_AWS_READONLY_PROFILE: readonly
      # Tags every resource of the estate with this run, for the sweep.
      TF_VAR_run_id: ${{ github.run_id }}
    steps:
    - name: Directories
      run: |
        {
          echo "SANDBOX_FIXTURE_DIR=$RUNNER_TEMP/fixture-$SANDBOX_ESTATE"
          echo "SANDBOX_PLUGIN_CACHE=$RUNNER_TEMP/plugins"
          echo "SANDBOX_OUTPUT_DIR=$RUNNER_TEMP/out"
          echo "TF_PLUGIN_CACHE_DIR=$RUNNER_TEMP/plugins"
        } >> "$GITHUB_ENV"
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: true
    - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      if: inputs.engine == 'terraform'
      with:
        terraform_wrapper: false
        terraform_version: ${{ env.TERRAFORM_VERSION }}
    - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
      if: inputs.engine == 'tofu'
      with:
        tofu_wrapper: false
        tofu_version: ${{ env.TOFU_VERSION }}
    # The gate runs the scanners it finds (G5), as in the e2e jobs.
    - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
      with:
        tflint_version: v0.64.0
    - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
      with:
        version: v0.75.0
    - name: Credentials to create the estate
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{ vars.AWS_FIXTURE_ROLE_ARN }}
        role-session-name: infraharvest-fixture-${{ github.run_id }}
        role-duration-seconds: 7200
        aws-region: ${{ vars.AWS_REGION }}
        aws-profile: fixture
    - name: Credentials to import it
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{ vars.AWS_READONLY_ROLE_ARN }}
        role-session-name: infraharvest-readonly-${{ github.run_id }}
        role-duration-seconds: 7200
        aws-region: ${{ vars.AWS_REGION }}
        aws-profile: readonly
    # What an earlier run may have left, in both regions and in us-east-1,
    # where the Tagging API lists CloudFront. Only a warning: AWS lists
    # deleted resources, such as terminated instances, for a while.
    - name: Leftovers
      run: |
        for region in $(printf '%s\n' "$AWS_REGION" "$SANDBOX_AWS_SECOND_REGION" us-east-1 | sort -u); do
          left=$(aws resourcegroupstaggingapi get-resources --profile fixture --region "$region" \
            --tag-filters "Key=infraharvest-sandbox,Values=$E2E_ENGINE" \
            --query 'ResourceTagMappingList[].ResourceARN' --output text)
          if [ -n "$left" ]; then
            echo "::warning::Resources tagged infraharvest-sandbox=$E2E_ENGINE in $region: $left"
          fi
        done
    # Redshift creates a cluster through its service-linked role, which an
    # account has only once a cluster was made; created with the cluster,
    # it isn't ready in time and CreateCluster fails ("Unable to assume the
    # SLR"). It is made here, once per account, and kept: it costs nothing,
    # and the account's later clusters use it.
    - name: Redshift's service-linked role
      if: inputs.estate == 'data'
      run: |
        if ! aws iam get-role --profile fixture --role-name AWSServiceRoleForRedshift > /dev/null 2>&1; then
          aws iam create-service-linked-role --profile fixture --aws-service-name redshift.amazonaws.com > /dev/null
          # IAM is eventually consistent: give Redshift time to see it.
          sleep 30
        fi
    # One test, by its whole name: -run takes a pattern, and TestSandboxAWS
    # alone would match the clusters test too.
    - name: Round trip
      env:
        # Fail, rather than skip, if the test has nothing to run against.
        INFRAHARVEST_E2E_REQUIRED: "1"
      run: |
        case "$SANDBOX_ESTATE" in
          main) test=TestSandboxAWS timeout=120m ;;
          clusters) test=TestSandboxAWSClusters timeout=120m ;;
          data) test=TestSandboxAWSData timeout=90m ;;
          *) echo "::error::Unknown estate $SANDBOX_ESTATE"; exit 1 ;;
        esac
        go test -tags e2e,sandbox,minimal,aws -run "^${test}\$" -timeout "$timeout" -v ./e2e/
    # The first session may have run out by now, after a long test.
    - name: Credentials to destroy the estate
      if: always()
      continue-on-error: true
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{ vars.AWS_FIXTURE_ROLE_ARN }}
        role-session-name: infraharvest-fixture-${{ github.run_id }}
        role-duration-seconds: 3600
        aws-region: ${{ vars.AWS_REGION }}
        aws-profile: fixture
        overwrite-aws-profile: true
    - name: Destroy the estate
      if: always()
      env:
        AWS_PROFILE: fixture
      run: |
        if [ ! -f "$SANDBOX_FIXTURE_DIR/terraform.tfstate" ]; then
          echo "No estate state: nothing was created."
          exit 0
        fi
        cd "$SANDBOX_FIXTURE_DIR"
        vars=(-var "suffix=$E2E_ENGINE")
        if [ "$SANDBOX_ESTATE" = main ]; then
          vars+=(-var "second_region=$SANDBOX_AWS_SECOND_REGION")
        fi
        "$E2E_ENGINE" init -input=false
        # A destroy that fails, as on a dependency AWS, Azure or Google Cloud
        # still deletes, is tried twice more before what is left counts.
        for attempt in 1 2 3; do
          "$E2E_ENGINE" destroy -auto-approve -input=false -lock-timeout=5m "${vars[@]}" && break
          echo "::warning::destroy attempt $attempt failed"
          sleep 60
        done
        left=$("$E2E_ENGINE" state list)
        if [ -n "$left" ]; then
          echo "::error::Left in the estate: $left"
          exit 1
        fi
    # The last resort, whatever the destroy did: deletes what still carries
    # this run's tag (TF_VAR_run_id) and costs the most while it exists, and
    # warns about the rest. It touches nothing without the tag.
    - name: Sweep what the run left
      if: always()
      timeout-minutes: 30
      env:
        AWS_PROFILE: fixture
        RUN_ID: ${{ github.run_id }}
      # Both regions, and us-east-1, as for the leftovers.
      run: .github/scripts/sandbox-aws-sweep.sh "$AWS_REGION" "$SANDBOX_AWS_SECOND_REGION" us-east-1
    # Only the report: the generated configuration describes the estate, and
    # the artifacts of a public repository are public.
    - name: Upload the report
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: sandbox-aws-${{ inputs.estate }}-${{ inputs.engine }}
        path: |
          ${{ env.SANDBOX_OUTPUT_DIR }}/**/report/report.md
          ${{ env.SANDBOX_OUTPUT_DIR }}/**/report/coverage.json
        if-no-files-found: ignore
        retention-days: 7
