# Imports a small estate from the AWS sandbox account and checks it plans
# with no changes. Runs only when started by hand, and only after a
# reviewer of the sandbox environment approves it. The estate is created as
# the fixture role, imported as the read-only role, and destroyed at the
# end, whatever happened. The main estate (TestSandboxAWS) is the usual
# one; clusters (TestSandboxAWSClusters) holds an RDS database, an
# ElastiCache replication group and an EKS cluster, which take longer and
# cost more, so it runs only when asked for; so does data
# (TestSandboxAWSData): an EC2 instance, a Lambda function, an RDS
# database, a Redshift cluster and an S3 bucket, destroyed straight after;
# cfn (TestSandboxAWSCloudFormation): two CloudFormation stacks, which
# the test moves to Terraform with --cfn-stack, deleting them as it goes;
# and environments (TestSandboxAWSEnvironments): two small estates, dev
# and prd, told apart by tag, which the import merges into one root.
#
# A cancelled job gets five minutes for its always() steps before GitHub
# stops it, too few for the destroy, and a job that times out or whose
# runner is lost runs no more steps. So when the round trip doesn't
# succeed, the clean-up job, a job of its own with its full timeout,
# sweeps whatever still carries the run's tag. Like any job of the
# sandbox environment, it waits for a reviewer to approve it first, after
# a cancel too, and the run, and so the next one, waits with it.
name: Sandbox (AWS)

on:
  workflow_dispatch:
    inputs:
      estate:
        description: Estate to create and import (clusters is RDS, ElastiCache and EKS; data is EC2, Lambda, RDS, Redshift and S3; both slower and dearer; cfn is two CloudFormation stacks, moved to Terraform with --cfn-stack; environments is dev and prd queues, buckets and parameters, merged into one root)
        type: choice
        options: [main, clusters, data, cfn, environments]
        default: main
      engine:
        description: Engine to import with
        type: choice
        options: [terraform, tofu]
        default: terraform

permissions: {}

# One run at a time: each imports the whole of its regions, so another
# run's estate would show up in its import, and change between its runs.
# The group holds the whole run, its clean-up job too, so the next run
# starts only once this one's estate is swept.
concurrency:
  group: sandbox-aws
  cancel-in-progress: false

jobs:
  round-trip:
    name: round-trip (${{ inputs.estate }}, ${{ inputs.engine }})
    runs-on: ubuntu-latest
    environment: sandbox
    permissions:
      contents: read
      id-token: write # OpenID Connect, for the roles
    # go test gets the test's own deadline plus the 30 minutes its cleanup
    # destroy has, and a margin, so that it never stops a destroy halfway
    # (the cfn estate's test 90 minutes, then 30 for what its stacks
    # retained and 30 for the destroy); the job, another half an hour for
    # the destroy step below and one for each sweep, of what earlier runs
    # left and of what this one did.
    timeout-minutes: ${{ inputs.estate == 'data' && 190 || inputs.estate == 'cfn' && 260 || 220 }}
    env:
      SANDBOX_ESTATE: ${{ inputs.estate }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      # The estate's second region, which the import keeps apart.
      SANDBOX_AWS_SECOND_REGION: ${{ vars.AWS_SECOND_REGION || 'eu-west-1' }}
      E2E_ENGINE: ${{ inputs.engine }}
      SANDBOX_AWS_FIXTURE_PROFILE: fixture
      SANDBOX_AWS_READONLY_PROFILE: readonly
      # Tags every resource of the estate with this run, for the sweep.
      TF_VAR_run_id: ${{ github.run_id }}
      # The boundary every role of the estate is created with, which the
      # fixture role may not create one without (see aws-bootstrap).
      TF_VAR_permissions_boundary_arn: ${{ vars.AWS_BOUNDARY_POLICY_ARN }}
    steps:
    # First in the run's summary, where it shows at once.
    - name: Clean-up
      run: echo "If this job is cancelled, times out or fails, the clean-up job sweeps what the run created, once a reviewer of the sandbox environment approves it." >> "$GITHUB_STEP_SUMMARY"
    # An unset variable is an empty string, which would surface only
    # minutes into the apply: without the boundary, the fixture role is
    # denied iam:CreateRole. The bootstrap's gh_commands output sets them.
    - name: Variables
      env:
        AWS_FIXTURE_ROLE_ARN: ${{ vars.AWS_FIXTURE_ROLE_ARN }}
        AWS_READONLY_ROLE_ARN: ${{ vars.AWS_READONLY_ROLE_ARN }}
        AWS_BOUNDARY_POLICY_ARN: ${{ vars.AWS_BOUNDARY_POLICY_ARN }}
      run: |
        missing=()
        for name in AWS_REGION AWS_FIXTURE_ROLE_ARN AWS_READONLY_ROLE_ARN AWS_BOUNDARY_POLICY_ARN; do
          if [ -z "${!name}" ]; then
            missing+=("$name")
          fi
        done
        if [ "${#missing[@]}" -gt 0 ]; then
          echo "::error::The sandbox environment lacks the variables ${missing[*]}. Set them with the commands the aws-bootstrap root's gh_commands output prints (see e2e/README.md)."
          exit 1
        fi
    - name: Directories
      run: |
        {
          echo "SANDBOX_FIXTURE_DIR=$RUNNER_TEMP/fixture-$SANDBOX_ESTATE"
          echo "SANDBOX_PLUGIN_CACHE=$RUNNER_TEMP/plugins"
          echo "SANDBOX_OUTPUT_DIR=$RUNNER_TEMP/out"
          echo "TF_PLUGIN_CACHE_DIR=$RUNNER_TEMP/plugins"
        } >> "$GITHUB_ENV"
    - name: Check out the code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: true
    # The gate runs the scanners it finds (G5), as in the e2e jobs.
    - name: Install the engine and scanners
      uses: ./.github/actions/setup-engines
      with:
        engine: ${{ inputs.engine }}
        scanners: "true"
    - name: Credentials to create the estate
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{ vars.AWS_FIXTURE_ROLE_ARN }}
        role-session-name: infraharvest-fixture-${{ github.run_id }}
        role-duration-seconds: 7200
        aws-region: ${{ vars.AWS_REGION }}
        aws-profile: fixture
    - name: Credentials to import it
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{ vars.AWS_READONLY_ROLE_ARN }}
        role-session-name: infraharvest-readonly-${{ github.run_id }}
        role-duration-seconds: 7200
        aws-region: ${{ vars.AWS_REGION }}
        aws-profile: readonly
    # What an earlier run may have left, in both regions and in us-east-1,
    # where the Tagging API lists CloudFront. A warning, as AWS lists
    # deleted resources, such as terminated instances, for a while; the
    # estate's names are fixed per engine, though, so what is still there
    # would stop the apply (a load balancer that already exists), and the
    # next step sweeps it.
    - name: Leftovers
      id: leftovers
      run: |
        for region in $(printf '%s\n' "$AWS_REGION" "$SANDBOX_AWS_SECOND_REGION" us-east-1 | sort -u); do
          left=$(aws resourcegroupstaggingapi get-resources --profile fixture --region "$region" \
            --tag-filters "Key=infraharvest-sandbox,Values=$E2E_ENGINE" \
            --query 'ResourceTagMappingList[].ResourceARN' --output text)
          if [ -n "$left" ]; then
            echo "::warning::Resources tagged infraharvest-sandbox=$E2E_ENGINE in $region: $left"
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
        done
    # Every earlier run's tag (see the script), which only what a run
    # failed to delete still carries: the group lets no other run be live.
    # Then the estate tag, every engine's, for what an estate applied
    # without a run_id left with no run tag, so that the estate starts from
    # an empty account as the Azure and Google Cloud sweeps make it.
    - name: Sweep what earlier runs left
      if: steps.leftovers.outputs.found == 'true'
      timeout-minutes: 30
      env:
        AWS_PROFILE: fixture
        RUN_ID: ${{ github.run_id }}
      run: |
        .github/scripts/sandbox-aws-sweep.sh "$AWS_REGION" "$SANDBOX_AWS_SECOND_REGION" us-east-1
        SWEEP_TAG_KEY=infraharvest-sandbox RUN_ID="$E2E_ENGINE" \
          .github/scripts/sandbox-aws-sweep.sh "$AWS_REGION" "$SANDBOX_AWS_SECOND_REGION" us-east-1
    # Redshift creates a cluster through its service-linked role, which an
    # account has only once a cluster was made; created with the cluster,
    # it isn't ready in time and CreateCluster fails ("Unable to assume the
    # SLR"). It is made here, once per account, and kept: it costs nothing,
    # and the account's later clusters use it.
    - name: Redshift's service-linked role
      if: inputs.estate == 'data'
      run: |
        if ! aws iam get-role --profile fixture --role-name AWSServiceRoleForRedshift > /dev/null 2>&1; then
          aws iam create-service-linked-role --profile fixture --aws-service-name redshift.amazonaws.com > /dev/null
          # IAM is eventually consistent: give Redshift time to see it.
          sleep 30
        fi
    # One test, by its whole name: -run takes a pattern, and TestSandboxAWS
    # alone would match the clusters test too.
    - name: Round trip
      env:
        # Fail, rather than skip, if the test has nothing to run against.
        INFRAHARVEST_E2E_REQUIRED: "1"
      run: |
        case "$SANDBOX_ESTATE" in
          main) test=TestSandboxAWS timeout=120m ;;
          clusters) test=TestSandboxAWSClusters timeout=120m ;;
          data) test=TestSandboxAWSData timeout=90m ;;
          cfn) test=TestSandboxAWSCloudFormation timeout=160m ;;
          environments) test=TestSandboxAWSEnvironments timeout=70m ;;
          *) echo "::error::Unknown estate $SANDBOX_ESTATE"; exit 1 ;;
        esac
        go test -tags e2e,sandbox,minimal,aws -run "^${test}\$" -timeout "$timeout" -v ./e2e/
    # The first session may have run out by now, after a long test.
    - name: Credentials to destroy the estate
      if: always()
      continue-on-error: true
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{ vars.AWS_FIXTURE_ROLE_ARN }}
        role-session-name: infraharvest-fixture-${{ github.run_id }}
        role-duration-seconds: 3600
        aws-region: ${{ vars.AWS_REGION }}
        aws-profile: fixture
        overwrite-aws-profile: true
    - name: Destroy the estate
      if: always()
      env:
        AWS_PROFILE: fixture
      run: |
        if [ ! -f "$SANDBOX_FIXTURE_DIR/terraform.tfstate" ]; then
          echo "No estate state: nothing was created."
          exit 0
        fi
        cd "$SANDBOX_FIXTURE_DIR"
        vars=(-var "suffix=$E2E_ENGINE")
        if [ "$SANDBOX_ESTATE" = main ]; then
          vars+=(-var "second_region=$SANDBOX_AWS_SECOND_REGION")
        fi
        "$E2E_ENGINE" init -input=false
        # A destroy that fails, as on a dependency AWS, Azure or Google Cloud
        # still deletes, is tried twice more before what is left counts.
        for attempt in 1 2 3; do
          "$E2E_ENGINE" destroy -auto-approve -input=false -lock-timeout=5m "${vars[@]}" && break
          echo "::warning::destroy attempt $attempt failed"
          sleep 60
        done
        left=$("$E2E_ENGINE" state list)
        if [ -n "$left" ]; then
          echo "::error::Left in the estate: $left"
          exit 1
        fi
    # The last resort, whatever the destroy did: deletes what still carries
    # this run's tag (TF_VAR_run_id), in the order its dependencies allow,
    # and warns about what is still tagged. It touches nothing without the
    # tag (see the script).
    - name: Sweep what the run left
      if: always()
      timeout-minutes: 30
      env:
        AWS_PROFILE: fixture
        RUN_ID: ${{ github.run_id }}
      # Both regions, and us-east-1, as for the leftovers.
      run: .github/scripts/sandbox-aws-sweep.sh "$AWS_REGION" "$SANDBOX_AWS_SECOND_REGION" us-east-1
    # The generated configuration, encrypted to the OpenPGP key in the
    # SANDBOX_OUTPUT_KEY variable, so that only its owner can read it: the
    # artifacts of a public repository are public. Without the variable,
    # nothing more is kept. Never any state, .terraform directory or saved
    # inventory (.infraharvest/), which lists the estate as state does. The
    # generated vars/<env>/*.tfvars hold no secrets, and are kept.
    - name: Encrypt the output
      if: always() && vars.SANDBOX_OUTPUT_KEY != ''
      env:
        OUTPUT_KEY: ${{ vars.SANDBOX_OUTPUT_KEY }}
      run: |
        if [ ! -d "$SANDBOX_OUTPUT_DIR" ]; then
          echo "no output to keep"
          exit 0
        fi
        printf '%s\n' "$OUTPUT_KEY" > "$RUNNER_TEMP/output-key.asc"
        tar -C "$SANDBOX_OUTPUT_DIR" --exclude=.terraform --exclude=.infraharvest --exclude='*.tfstate*' -czf "$RUNNER_TEMP/output.tar.gz" .
        gpg --batch --yes --trust-model always --recipient-file "$RUNNER_TEMP/output-key.asc" \
          --output "$RUNNER_TEMP/output.tar.gz.gpg" --encrypt "$RUNNER_TEMP/output.tar.gz"
        rm "$RUNNER_TEMP/output.tar.gz"
    - name: Upload the encrypted output
      if: always() && vars.SANDBOX_OUTPUT_KEY != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: sandbox-aws-${{ inputs.estate }}-${{ inputs.engine }}-output
        path: ${{ runner.temp }}/output.tar.gz.gpg
        if-no-files-found: ignore
        retention-days: 7
    # The report as it is. The configuration describes the estate and the
    # artifacts of a public repository are public, so it is kept only
    # encrypted (above).
    - name: Upload the report
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: sandbox-aws-${{ inputs.estate }}-${{ inputs.engine }}
        path: |
          ${{ env.SANDBOX_OUTPUT_DIR }}/**/_reports/report.md
          ${{ env.SANDBOX_OUTPUT_DIR }}/**/_reports/report.json
        if-no-files-found: ignore
        retention-days: 7

  # When the round trip was cancelled, timed out or failed: its destroy
  # and sweep may not have run, or not to the end. always() starts this
  # job after a cancel too, and keeps it running if the run is cancelled
  # again; a reviewer of the sandbox environment approves it first, as for
  # the round trip, or rejects it to skip it. The state was on the round
  # trip's runner, and is never uploaded (the artifacts of a public
  # repository are public), so it sweeps by the run's tag alone.
  clean-up:
    needs: round-trip
    if: always() && needs.round-trip.result != 'success'
    runs-on: ubuntu-latest
    environment: sandbox
    permissions:
      contents: read
      id-token: write # OpenID Connect, for the fixture role
    # The sweep waits up to half an hour for CloudFront, and up to ten
    # minutes for the network to let go of what used it.
    timeout-minutes: 90
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      SANDBOX_AWS_SECOND_REGION: ${{ vars.AWS_SECOND_REGION || 'eu-west-1' }}
    steps:
    - name: Why
      env:
        RESULT: ${{ needs.round-trip.result }}
      run: |
        echo "The round trip ended $RESULT: sweeping what still carries the run's tag." >> "$GITHUB_STEP_SUMMARY"
    - name: Check out the code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Credentials to sweep the estate
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{ vars.AWS_FIXTURE_ROLE_ARN }}
        role-session-name: infraharvest-cleanup-${{ github.run_id }}
        role-duration-seconds: 7200
        aws-region: ${{ vars.AWS_REGION }}
    # Both regions, and us-east-1, as in the round trip.
    - name: Sweep what the run left
      env:
        RUN_ID: ${{ github.run_id }}
      run: .github/scripts/sandbox-aws-sweep.sh "$AWS_REGION" "$SANDBOX_AWS_SECOND_REGION" us-east-1
