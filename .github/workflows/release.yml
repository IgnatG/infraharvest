name: release

# Publishes a release from main with GoReleaser (see .goreleaser.yaml):
#   gh workflow run release --ref main -f version=v0.1.0
#
# The tests run in a job of their own, with a read-only token: no test or
# dependency code runs where the token can write the repository or packages
# or mint the OIDC token cosign signs with. GoReleaser publishes a draft
# release; the release job makes it public only once the provenance is
# attested, and takes the draft and the tag back if any step after the tag
# fails, so the version can be released again.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag (e.g. v0.1.0 or v0.1.0-rc.1)
        type: string
        required: true

permissions:
  contents: read

# One release at a time; a second one waits rather than racing the first.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Validate version and branch
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::version must look like v1.2.3 or v1.2.3-rc.1, got '$VERSION'"
            exit 1
          fi
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::releases are made from main, not $GITHUB_REF"
            exit 1
          fi
      # Ubuntu runners have ~14 GB free, too little for this module's
      # dependencies.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # never restore a cache into a release run
      - name: Test
        run: go test ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    # Six targets built one at a time, about 12 minutes each: past
    # goreleaser's default --timeout of an hour.
    timeout-minutes: 180
    permissions:
      contents: write      # create the tag and the release
      packages: write      # push the image to ghcr.io
      id-token: write      # keyless cosign signing and provenance
      attestations: write  # build provenance
    env:
      VERSION: ${{ inputs.version }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Version number
        id: version
        run: echo "number=${VERSION#v}" >> "$GITHUB_OUTPUT"
      # Ubuntu runners have ~14 GB free, too little for six platforms of
      # this module's dependencies.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GoReleaser finds the previous release's tag in the history; GitHub
          # then writes the notes from the pull requests merged since that tag
          # (changelog: use: github-native in .goreleaser.yaml).
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # never restore a cache into a release build
      - name: Tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag "$VERSION"
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$VERSION" -f sha="$GITHUB_SHA"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # Publishes a draft release (release.draft in .goreleaser.yaml).
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --clean --parallelism=1 --timeout=150m
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/infraharvest_${{ steps.version.outputs.number }}_SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$VERSION" --draft=false
      # The tag was pushed before GoReleaser ran: when a later step failed,
      # take back the draft release and the tag, so the version can be
      # released again. Images GoReleaser already pushed stay in ghcr.io;
      # the next run of the same version pushes over their tags.
      - name: Delete the draft and the tag of the failed release
        if: failure() && steps.tag.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$VERSION" --json isDraft --jq .isDraft 2>/dev/null | grep -qx true; then
            gh release delete "$VERSION" --yes
          fi
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$VERSION"
