name: Remote tasks

# Runs the checks that need a Go toolchain on GitHub, so a change doesn't
# need one on a laptop (the Makefile's ci-* targets dispatch it). The task
# input picks what it does:
#
#   check   go vet and go test of the packages, on the runner os names:
#             gh workflow run remote.yml --ref <branch> -f task=check -f packages="./pkg/..." -f os=ubuntu-latest
#   golden  rewrites the golden files of the packages' tests that take
#           -update: ./internal/catalogue (the default), ./internal/cli (the
#           command-line contract and the generated references,
#           docs/reference/cli.md and docs/reference/services.md),
#           ./internal/engine (the roots environments share) and
#           ./internal/harvest. No other package takes -update, so go test
#           fails on it. It uploads them as the artifact golden; pushing a
#           branch named golden/<anything> does the same:
#             gh workflow run remote.yml --ref <branch> -f task=golden -f packages=./internal/catalogue
#   tidy    runs go mod tidy and uploads go.mod and go.sum as the artifact
#           go-mod; pushing a branch named tidy/<anything> does the same:
#             gh workflow run remote.yml --ref <branch> -f task=tidy
#   bench   runs the benchmarks bench matches in each of the packages (the
#           default ./internal/engine ./internal/importer), count times,
#           with a CPU profile per package, and puts the profile's top
#           functions in the job summary. With base, a commit that has the
#           same benchmarks, it runs them there too and compares the two
#           with benchstat. It uploads the results and profiles as the
#           artifact bench:
#             gh workflow run remote.yml --ref <branch> -f task=bench -f bench=ScanSecrets -f base=<sha>
#   schema-metadata
#           reads the defaults and the constraints between arguments out
#           of the aws, azurerm and google providers' code, at the release
#           versions names (name=release, space-separated) or else at each
#           one's newest, which generated roots pin: it checks out each
#           provider, runs internal/catalogue/schemameta/gen in it, and
#           uploads the JSON files as the artifact schema-metadata, at
#           their paths under internal/catalogue/schemameta:
#             gh workflow run remote.yml --ref <branch> -f task=schema-metadata -f versions="aws=6.70.0"
#
# Download an artifact from the repository's root, then review and commit
# it:
#   gh run download <run-id> -n golden    # or -n go-mod, -n schema-metadata
on:
  push:
    branches: ['golden/**', 'tidy/**']
  workflow_dispatch:
    inputs:
      task:
        description: What to run
        type: choice
        options: [check, golden, tidy, bench, schema-metadata]
        default: check
      packages:
        description: Space-separated Go package patterns (default ./... for check, ./internal/catalogue for golden, ./internal/engine ./internal/importer for bench; tidy takes none)
        type: string
        required: false
        default: ""
      os:
        description: Runner, for check (golden and tidy run on ubuntu-latest)
        type: choice
        options: [ubuntu-latest, windows-latest, macos-latest]
        default: ubuntu-latest
      bench:
        description: For bench, the benchmarks to run, as go test -bench takes them
        type: string
        required: false
        default: "."
      count:
        description: For bench, how many times to run each benchmark (benchstat wants at least 6)
        type: string
        required: false
        default: "10"
      base:
        description: For bench, a commit to compare with (full or short SHA)
        type: string
        required: false
        default: ""
      versions:
        description: For schema-metadata, provider releases as name=release, such as aws=6.70.0 (default each provider's newest)
        type: string
        required: false
        default: ""

permissions:
  contents: read

# The module proxy drops a download now and then (stream error
# INTERNAL_ERROR); fetching that module from its repository instead keeps
# the job from failing on it. go.sum still checks what is fetched.
env:
  GOPROXY: https://proxy.golang.org|direct

jobs:
  run:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.task || (startsWith(github.ref, 'refs/heads/golden/') && 'golden' || 'tidy') }}
    # schema-metadata has jobs of its own, below.
    if: github.event_name != 'workflow_dispatch' || inputs.task != 'schema-metadata'
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.task == 'check' && inputs.os || 'ubuntu-latest' }}
    # A cold macOS or Windows build of every package takes about 40
    # minutes.
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Plan
        # Sets TASK and PACKAGES for the steps below. Each package pattern is
        # checked on its own, so that none can start with '-' and be read by
        # go vet or go test as a flag.
        env:
          TASK: ${{ github.event_name == 'workflow_dispatch' && inputs.task || (startsWith(github.ref, 'refs/heads/golden/') && 'golden' || 'tidy') }}
          PACKAGES: ${{ inputs.packages }}
          BENCH: ${{ inputs.bench }}
          COUNT: ${{ inputs.count }}
          BASE: ${{ inputs.base }}
        run: |
          case $TASK in
            check) PACKAGES=${PACKAGES:-./...} ;;
            golden) PACKAGES=${PACKAGES:-./internal/catalogue} ;;
            tidy) PACKAGES= ;;
            bench) PACKAGES=${PACKAGES:-./internal/engine ./internal/importer} ;;
            *) echo "::error::unknown task '$TASK': use check, golden, tidy or bench"; exit 1 ;;
          esac
          if [ "$TASK" = bench ]; then
            if ! [[ "${COUNT:-10}" =~ ^[1-9][0-9]?$ ]]; then
              echo "::error::count must be a number from 1 to 99"
              exit 1
            fi
            if [ -n "$BASE" ] && ! [[ "$BASE" =~ ^[0-9a-f]{7,40}$ ]]; then
              echo "::error::base must be a commit SHA"
              exit 1
            fi
            if [[ "${BENCH:-.}" == -* ]]; then
              echo "::error::bench may not start with '-'"
              exit 1
            fi
            {
              echo "BENCH=${BENCH:-.}"
              echo "COUNT=${COUNT:-10}"
              echo "BASE=$BASE"
            } >> "$GITHUB_ENV"
          fi
          for package in $PACKAGES; do
            if ! [[ "$package" =~ ^[A-Za-z0-9_.][A-Za-z0-9_./-]*$ ]]; then
              echo "::error::package pattern '$package' may contain only letters, digits, '_', '.', '/' and '-', and may not start with '-'"
              exit 1
            fi
          done
          echo "$TASK: ${PACKAGES:-the module}"
          {
            echo "TASK=$TASK"
            echo "PACKAGES=$PACKAGES"
          } >> "$GITHUB_ENV"
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # go mod tidy may change go.sum, which keys the cache.
          cache: ${{ env.TASK != 'tidy' }}

      - name: Vet
        if: env.TASK == 'check'
        run: go vet $PACKAGES
      - name: Test
        if: env.TASK == 'check'
        run: go test $PACKAGES

      - name: Update golden files
        if: env.TASK == 'golden'
        run: go test $PACKAGES -run Golden -update
      - name: Collect changed files
        if: env.TASK == 'golden'
        run: |
          git ls-files --modified --others --exclude-standard -- '*/testdata/*' 'docs/reference/*' > changed.txt
          cat changed.txt
          test -s changed.txt || echo "::notice::no golden file changed"
      - name: Upload the golden files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.TASK == 'golden'
        with:
          name: golden
          path: |
            **/testdata/**/*.golden.*
            docs/reference/*.md
          retention-days: 1

      - name: Benchmark
        if: env.TASK == 'bench'
        # One go test per package, so that each gets a CPU profile.
        run: |
          mkdir -p bench
          for package in $PACKAGES; do
            name=$(echo "$package" | tr -c 'A-Za-z0-9\n' _)
            go test -run '^$' -bench "$BENCH" -benchmem -count "$COUNT" -cpuprofile "bench/cpu$name.out" "$package" | tee -a bench/head.txt
            if [ -s "bench/cpu$name.out" ]; then
              {
                echo "### CPU profile of $package"
                echo '```'
                go tool pprof -top -nodecount=25 "bench/cpu$name.out" 2>/dev/null
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.TASK == 'bench' && env.BASE != ''
        with:
          ref: ${{ env.BASE }}
          path: base
          persist-credentials: false
      - name: Benchmark the base
        if: env.TASK == 'bench' && env.BASE != ''
        working-directory: base
        run: |
          for package in $PACKAGES; do
            go test -run '^$' -bench "$BENCH" -benchmem -count "$COUNT" "$package" | tee -a ../bench/base.txt
          done
      - name: Compare
        if: env.TASK == 'bench' && env.BASE != ''
        run: |
          go run golang.org/x/perf/cmd/benchstat@v0.0.0-20260929162123-406019bb8b68 base=bench/base.txt head=bench/head.txt | tee bench/benchstat.txt
          {
            echo "### benchstat, $BASE against ${GITHUB_SHA::12}"
            echo '```'
            cat bench/benchstat.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the benchmarks
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.TASK == 'bench'
        with:
          name: bench
          path: bench/
          retention-days: 7

      - name: go mod tidy
        if: env.TASK == 'tidy'
        run: go mod tidy
      - name: Upload go.mod and go.sum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.TASK == 'tidy'
        with:
          name: go-mod
          path: |
            go.mod
            go.sum
          retention-days: 1

  # One job per provider: building one takes most of a runner's disk and
  # memory, the AWS provider most of all.
  schema-metadata:
    name: schema-metadata (${{ matrix.provider }})
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'schema-metadata'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        provider: [aws, azurerm, google]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space
        run: .github/scripts/free-disk-space.sh start
      - name: Choose the release
        # The release versions names, or else the provider's newest, as the
        # registry reports it: the one generated roots pin.
        env:
          PROVIDER: ${{ matrix.provider }}
          VERSIONS: ${{ inputs.versions }}
        run: |
          release=
          for pair in $VERSIONS; do
            if [ "${pair%%=*}" = "$PROVIDER" ]; then
              release=${pair#*=}
            fi
          done
          if [ -z "$release" ]; then
            release=$(curl -sSf --retry 3 "https://registry.terraform.io/v1/providers/hashicorp/$PROVIDER" | jq -r .version)
          fi
          if ! [[ "$release" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release '$release' of $PROVIDER isn't a version such as 6.70.0"
            exit 1
          fi
          echo "$PROVIDER $release"
          echo "RELEASE=$release" >> "$GITHUB_ENV"
      - name: Check out the provider
        env:
          PROVIDER: ${{ matrix.provider }}
        run: git clone --quiet --depth 1 --branch "v$RELEASE" "https://github.com/hashicorp/terraform-provider-$PROVIDER.git" "$RUNNER_TEMP/provider"
      - name: Add the generator to it
        # The generator's files carry the ignore build constraint, which
        # keeps them out of infraharvest's module: drop it here.
        env:
          PROVIDER: ${{ matrix.provider }}
        run: |
          mkdir "$RUNNER_TEMP/provider/ihschemameta"
          for file in main.go "provider_$PROVIDER.go"; do
            grep -vx '//go:build ignore' "internal/catalogue/schemameta/gen/$file" > "$RUNNER_TEMP/provider/ihschemameta/$file"
          done
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ runner.temp }}/provider/go.mod
          cache: false
      - name: Wait for free disk space
        run: .github/scripts/free-disk-space.sh wait
      - name: Generate
        working-directory: ${{ runner.temp }}/provider
        env:
          PROVIDER: ${{ matrix.provider }}
          OUT: ${{ github.workspace }}/schema-metadata/internal/catalogue/schemameta
        run: |
          mkdir -p "$OUT"
          go run ./ihschemameta -version "$RELEASE" -out "$OUT/$PROVIDER.json"
          ls -l "$OUT"
      - name: Upload the provider's file
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: schema-metadata-${{ matrix.provider }}
          path: schema-metadata/
          retention-days: 1

  # The three files as one artifact, at their paths in the repository.
  schema-metadata-artifact:
    name: schema-metadata (artifact)
    needs: schema-metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download the providers' files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: schema-metadata-*
          path: schema-metadata
          merge-multiple: true
      - name: Upload them
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: schema-metadata
          path: schema-metadata/
          retention-days: 1
