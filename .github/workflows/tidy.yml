name: tidy

# Runs `go mod tidy` on GitHub, so dependency changes don't need a local Go
# toolchain on large modules. Push a branch named tidy/<anything>, then:
#   gh run download <run-id> -n go-mod
# and commit the returned go.mod and go.sum.
on:
  push:
    branches: ['tidy/**']

permissions:
  contents: read

jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: false
    - name: go mod tidy
      run: go mod tidy
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: go-mod
        path: |
          go.mod
          go.sum
        retention-days: 1
