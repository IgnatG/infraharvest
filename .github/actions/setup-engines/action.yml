name: Set up the engine and scanners
description: >-
  Installs Terraform or OpenTofu, without the wrapper, and optionally the
  scanners the gate runs (tflint and trivy), at the one set of versions the
  test, e2e and sandbox jobs share. The Terraform and OpenTofu versions are
  the ones the release image copies: bump them with the Dockerfile's
  hashicorp/terraform and opentofu/opentofu tags, which Dependabot tracks;
  the tests workflow fails until they match (check-versions.sh).

inputs:
  engine:
    description: The engine to install, terraform or tofu
    required: true
  scanners:
    description: true to install tflint and trivy as well, for the gate's scanner check (G5)
    default: "false"

runs:
  using: composite
  steps:
    - name: Check the engine
      if: inputs.engine != 'terraform' && inputs.engine != 'tofu'
      shell: bash
      env:
        ENGINE: ${{ inputs.engine }}
      run: |
        echo "::error::Unknown engine $ENGINE: want terraform or tofu"
        exit 1
    - name: Install Terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      if: inputs.engine == 'terraform'
      with:
        terraform_wrapper: false
        terraform_version: 1.16.6
    - name: Install OpenTofu
      uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
      if: inputs.engine == 'tofu'
      with:
        tofu_wrapper: false
        tofu_version: 1.13.2
    - name: Install TFLint
      uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
      if: inputs.scanners == 'true'
      with:
        tflint_version: v0.64.0
    - name: Install Trivy
      uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
      if: inputs.scanners == 'true'
      with:
        version: v0.75.0
    # An install can end in success with nothing on PATH (setup-opentofu
    # once did): stop here, where it reads as a broken install, rather
    # than in a test, where it reads as a failure of infraharvest.
    - name: Check the installs
      shell: bash
      env:
        ENGINE: ${{ inputs.engine }}
        SCANNERS: ${{ inputs.scanners }}
      run: |
        "$ENGINE" version
        if [ "$SCANNERS" = true ]; then
          tflint --version
          trivy --version
        fi
