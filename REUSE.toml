# Copyright 2026 Gabriel Ignat
# SPDX-License-Identifier: AGPL-3.0-only

# Copyright and licence of the files that carry no header of their own
# (https://reuse.software/spec-3.3/): YAML, JSON and Terraform test data,
# golden files, the catalogue, documentation, configuration files and
# anything else that can't or doesn't take a comment. A file with its own
# header, as every Go file has, keeps it ("closest"). The tests workflow
# runs `reuse lint`.
version = 1

[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "Copyright 2026 Gabriel Ignat"
SPDX-License-Identifier = "AGPL-3.0-only"

# The schema metadata extracted from the Terraform providers' code
# (internal/catalogue/schemameta/*.json.gz): the defaults and argument
# constraints of hashicorp/terraform-provider-aws, -azurerm and -google, at
# the release each file records, which are MPL-2.0. infraharvest's own
# generator (internal/catalogue/schemameta/gen) and corrections
# (overrides.json) stay AGPL-3.0-only; the binary that embeds both is
# AGPL-3.0-only as a larger work, which MPL-2.0 section 3.3 allows.
[[annotations]]
path = "internal/catalogue/schemameta/*.json.gz"
precedence = "override"
SPDX-FileCopyrightText = "Copyright IBM Corp. 2014, 2026 (HashiCorp, Inc.: terraform-provider-aws, terraform-provider-azurerm, terraform-provider-google)"
SPDX-License-Identifier = "MPL-2.0"

# OPA's capabilities file (internal/engine/conftest_capabilities.json): the
# built-in functions, keywords and features of OPA 1.21.1, copied unchanged
# from capabilities/v1.21.1.json in open-policy-agent/opa, which is
# Apache-2.0. infraharvest passes it, less the functions it leaves out, to
# conftest; the code that does so stays AGPL-3.0-only, and the binary that
# embeds the file is AGPL-3.0-only as a larger work, which Apache-2.0
# section 4 allows.
[[annotations]]
path = "internal/engine/conftest_capabilities.json"
precedence = "override"
SPDX-FileCopyrightText = "Copyright The OPA Authors"
SPDX-License-Identifier = "Apache-2.0"

# The opacapabilities command's test data: conftest's go.mod at a release,
# recorded unchanged, and capabilities files cut down from OPA's, the newer
# with functions added. Both projects are Apache-2.0.
[[annotations]]
path = "internal/engine/cmd/opacapabilities/testdata/*-go.mod"
precedence = "override"
SPDX-FileCopyrightText = "Copyright The Conftest Authors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "internal/engine/cmd/opacapabilities/testdata/v*.json"
precedence = "override"
SPDX-FileCopyrightText = "Copyright The OPA Authors"
SPDX-License-Identifier = "Apache-2.0"
