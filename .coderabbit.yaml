# CodeRabbit's review settings (https://docs.coderabbit.ai/reference/configuration).
# It reviews every pull request, whatever its base branch, drafts included,
# with the default profile (chill).
reviews:
  auto_review:
    enabled: true
    drafts: true
    # Branches other than the default one; '.*' matches them all.
    base_branches: [".*"]
