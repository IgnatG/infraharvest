# markdownlint-cli2 configuration, for the pre-commit hook
# (scripts/fast-checks.sh): the files to leave out. The rules are in
# .markdownlint.yaml, which markdownlint-cli2 reads beside this file and
# MegaLinter's markdownlint reads too; .mega-linter.yml leaves out the same
# files.
ignores:
  - "**/node_modules/**"
  - "**/testdata/**"
  - "site/**"
  # Generated by the golden tests of internal/cli (clireference_test.go and
  # servicesreference_test.go): fix the generator, not the page.
  - "docs/reference/cli.md"
  - "docs/reference/services.md"
  # The Contributor Covenant, as published.
  - "CODE_OF_CONDUCT.md"
