# The documentation site, built from docs/ (see .github/workflows/docs.yml).
site_name: infraharvest
site_description: Terraform configuration for the infrastructure you already have, checked to plan with no changes.
site_url: https://ignatg.github.io/infraharvest/
repo_url: https://github.com/IgnatG/infraharvest
repo_name: IgnatG/infraharvest
edit_uri: edit/main/docs/
copyright: infraharvest is licensed under AGPL-3.0-only.
strict: true
# The build's own pins (docs/requirements.in and .txt) aren't part of the site.
exclude_docs: |
  /requirements.in
  /requirements.txt

theme:
  name: material
  features:
    - content.code.copy
    - content.tabs.link
    - navigation.sections
    - navigation.top
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Light mode

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: info
    unrecognized_links: info

nav:
  - Home: index.md
  - Getting started:
      - Install: install.md
      - Quickstart: quickstart.md
  - Guide:
      - Usage: usage.md
      - Drift: drift.md
      - Configuration: configuration.md
      - Output: output.md
      - Modules: modules.md
      - Permissions: permissions.md
      - AI agents (MCP): mcp.md
      - Catalogue: catalogue.md
      - Troubleshooting: troubleshooting.md
  - Clouds:
      - AWS: aws.md
      - Azure: azure.md
      - Google Cloud: google.md
  - Reference:
      - Command line: reference/cli.md
      - Services: reference/services.md
  - Contributing:
      - Development: development.md
