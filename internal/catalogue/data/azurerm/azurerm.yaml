# yaml-language-server: $schema=../../schema.json
# What Azure creates itself, which the default selection leaves out. The
# resource_graph service records each resource's name, its resource group
# (resource_group_name; a resource group's own name) and what manages the
# group (resource_group_managed_by) or the resource (managed_by; of a
# virtual machine's OS disk, os_disk_of too, while a data disk attached to
# a machine gets attached_to instead, see graphAttributes), and of a Log
# Analytics workspace's tables and saved searches what tells the built-in
# ones apart, and the private endpoint or Private Link service a network
# interface belongs to (see builtInAttributes in
# internal/providers/azure/resource_graph.go). Azure names ignore case, so
# the rules do too.
provider: azurerm
service: resource_graph
types:
  "*":
    skip:
      - reason: in a resource group another resource manages, such as an AKS cluster's node resource group (MC_*); that resource creates and deletes what is in it
        ignore_case: true
        attribute_prefixes: { resource_group_managed_by: [/subscriptions/] }
      - reason: another resource manages it (managedBy), such as the node resource group (MC_*) an AKS cluster creates and deletes, or a managed application's resource group
        ignore_case: true
        attribute_prefixes: { managed_by: [/subscriptions/] }
      - reason: in a DefaultResourceGroup-<region>, which Azure creates for default Log Analytics workspaces (Container insights, Defender for Cloud)
        ignore_case: true
        attribute_prefixes: { resource_group_name: [DefaultResourceGroup-] }
      - reason: in a cloud-shell-storage-<region> resource group, which Cloud Shell creates for its file share
        ignore_case: true
        attribute_prefixes: { resource_group_name: [cloud-shell-storage-] }
      - reason: in an AzureBackupRG_<region>_<n> resource group, which Azure Backup creates for the restore point collections of the virtual machines it backs up; select it to import it
        ignore_case: true
        attribute_prefixes: { resource_group_name: [AzureBackupRG_] }
  # NetworkWatcherRG and its network watchers, one per region, are Azure's;
  # the flow logs, connection monitors and anything else a user puts in
  # the group are theirs, and imported.
  azurerm_resource_group:
    skip:
      - reason: NetworkWatcherRG, which Azure creates to hold a network watcher per region when a virtual network is created
        ignore_case: true
        attributes: { resource_group_name: NetworkWatcherRG }
  azurerm_network_watcher:
    skip:
      - reason: a network watcher in NetworkWatcherRG, which Azure creates for the region when a virtual network is created; its flow logs and connection monitors are imported
        ignore_case: true
        attributes: { resource_group_name: NetworkWatcherRG }
  azurerm_monitor_data_collection_rule:
    skip:
      - reason: the data collection rule AKS creates when Container insights (MSCI-<region>-<cluster>) or managed Prometheus (MSProm-<region>-<cluster>) is enabled on a cluster; select it to import it
        ignore_case: true
        attribute_prefixes: { name: [MSCI-, MSProm-] }
  azurerm_monitor_data_collection_endpoint:
    skip:
      - reason: the data collection endpoint AKS creates when managed Prometheus is enabled on a cluster (MSProm-<region>-<cluster>); select it to import it
        ignore_case: true
        attribute_prefixes: { name: [MSProm-] }
  azurerm_monitor_alert_prometheus_rule_group:
    skip:
      - reason: a recording rule group AKS creates when managed Prometheus is enabled on a cluster, such as NodeRecordingRulesRuleGroup-<cluster>; select it to import it
        ignore_case: true
        attribute_prefixes: { name: [NodeRecordingRulesRuleGroup-, KubernetesRecordingRulesRuleGroup-, NodeAndKubernetesRecordingRulesRuleGroup-, UXRecordingRulesRuleGroup] }
  azurerm_log_analytics_solution:
    skip:
      - reason: the solution Microsoft Defender for Cloud (SecurityCenterFree) or AKS Container insights (ContainerInsights) adds to a Log Analytics workspace; select it to import it
        ignore_case: true
        attribute_prefixes: { name: ["SecurityCenterFree(", "ContainerInsights("] }
  azurerm_virtual_machine_extension:
    # The names the extensions are installed under, whole: Defender for
    # Cloud and Azure Policy name them so on every machine they reach.
    skip:
      - reason: an extension Microsoft Defender for Cloud installs on the virtual machine (Defender for Endpoint, MDE.*, or its security agent); select it to import it
        ignore_case: true
        attribute_prefixes: { name: [MDE.Linux, MDE.Windows, AzureSecurityLinuxAgent, AzureSecurityWindowsAgent] }
      - reason: the guest configuration extension Azure Policy installs on the virtual machine (AzurePolicyforLinux, AzurePolicyforWindows); select it to import it
        ignore_case: true
        attribute_prefixes: { name: [AzurePolicyforLinux, AzurePolicyforWindows] }
  azurerm_managed_disk:
    skip:
      - reason: the OS disk of a virtual machine, which the machine's os_disk block creates and manages; a data disk attached to a machine is imported
        ignore_case: true
        attribute_prefixes: { os_disk_of: [/subscriptions/] }
  azurerm_network_interface:
    skip:
      - reason: the network interface Azure creates for a private endpoint, which the endpoint creates and deletes with itself
        ignore_case: true
        attribute_prefixes: { private_endpoint: [/subscriptions/] }
      - reason: the network interface Azure creates for a Private Link service, which the service creates and deletes with itself
        ignore_case: true
        attribute_prefixes: { private_link_service: [/subscriptions/] }
  azurerm_security_center_subscription_pricing:
    service: security_center_subscription_pricing
    # Every subscription has every plan, on Free until Defender for Cloud
    # is turned on for it; the lister records each plan's tier.
    skip:
      - reason: a Microsoft Defender for Cloud plan left on the Free tier, as every subscription has each plan; select it to import it
        ignore_case: true
        attributes: { tier: Free }
  azurerm_management_lock:
    service: management_lock
    # The lister records each lock's name and the resource group of what
    # it locks, so the rules for every type leave out the locks in the
    # groups they leave out. Azure Backup adds a delete lock to each storage
    # account whose file shares it protects.
    skip:
      - reason: the delete lock Azure Backup adds to a storage account whose file shares it protects, and expects to stay; select it to import it
        ignore_case: true
        attributes: { name: AzureBackupProtectionLock }
  azurerm_monitor_smart_detector_alert_rule:
    skip:
      - reason: the Failure Anomalies rule Azure creates with each Application Insights resource
        ignore_case: true
        attribute_prefixes: { name: ["Failure Anomalies - "] }
  azurerm_monitor_action_group:
    skip:
      - reason: the action group Azure creates for Application Insights smart detection
        ignore_case: true
        attributes: { name: Application Insights Smart Detection }
  azurerm_log_analytics_workspace_table_microsoft:
    skip:
      - reason: a table Azure builds into every Log Analytics workspace, with its default plan and retention; select it to import it
        ignore_case: true
        attributes: { table_type: Microsoft, plan: Analytics, retention_in_days_as_default: "true", total_retention_in_days_as_default: "true" }
  azurerm_log_analytics_saved_search:
    skip:
      - reason: a saved search a solution adds to the Log Analytics workspace, such as the LogManagement searches every workspace has; select it to import it
        ignore_case: true
        attributes: { from_solution: "true" }
  azurerm_storage_account_queue_properties:
    skip:
      - reason: the queue service settings every storage account has, which Terraform reads through the storage data plane, with the account's keys or a data role, which the Reader role doesn't grant; select it to import it
        all: true
  azurerm_storage_account_table_properties:
    skip:
      - reason: the table service settings every storage account has, which Terraform reads through the storage data plane, with the account's keys or a data role, which the Reader role doesn't grant; select it to import it
        all: true
  # The defaults below are azurerm 5's, which the generated roots pin, or
  # what Azure reports for a resource created without the argument: the
  # arguments set to them are left out where the plan stays the same.
  # azurerm 4 had other names or defaults for some of them, such as a
  # storage account's allow_nested_items_to_be_public, true in 4.
  azurerm_storage_container:
    # A container without an encryption scope of its own reports the
    # account's, $account-encryption-key, which azurerm rejects as a scope
    # name; left out, the container keeps it. The override flag at its
    # default (true) needs a scope set, so it goes too: left out, it is
    # true anyway. metadata = {} is what Azure reports for a container
    # without metadata; metadata is optional and computed.
    omit: ["default_encryption_scope=$account-encryption-key", "encryption_scope_override_enabled=true", "metadata={}"]
    defaults: [container_access_type=private]
  azurerm_route_table:
    # Each route is imported as an azurerm_route of its own: inline, the
    # table would manage the routes too, and the two fight, as azurerm
    # warns. route is optional and computed, so left out, the table keeps
    # its routes; route = [] would delete them.
    omit: [route]
    defaults: [bgp_route_propagation_enabled=true]
  azurerm_virtual_network:
    # Each subnet is imported as an azurerm_subnet of its own: inline, the
    # network would manage the subnets too, and the two fight, as azurerm
    # warns; inline, Terraform also writes each subnet's id, which can't be
    # set. subnet is optional and computed, so left out, the network keeps
    # its subnets; subnet = [] would delete them. dns_servers = [] is what
    # Azure reports for a network on Azure's DNS: it is optional and
    # computed, so left out, the network keeps its DNS servers, and an
    # azurerm_virtual_network_dns_servers resource, which would fight [],
    # can manage them.
    omit: [subnet, "dns_servers=[]"]
    defaults: [private_endpoint_vnet_policies=Disabled]
  azurerm_network_security_group:
    # Each rule is imported as an azurerm_network_security_rule of its own:
    # inline, the group would manage the rules too, and the two fight, as
    # azurerm warns. security_rule is optional and computed, so left out,
    # the group keeps its rules; security_rule = [] would delete them.
    omit: [security_rule]
  azurerm_subnet:
    defaults:
      - default_outbound_access_enabled=true
      - private_endpoint_network_policies=Disabled
      - private_link_service_network_policies_enabled=true
  azurerm_key_vault:
    # access_policy = [] is what Azure reports for a vault that authorises
    # through Azure RBAC, or whose policies are separate
    # azurerm_key_vault_access_policy resources, which [] would delete:
    # access_policy is optional and computed, so left out, the vault keeps
    # its policies. So is network_acls, which Azure reports, with no rules,
    # for a vault open to every network; its bypass and default_action are
    # required in the block, so defaults can't leave it out.
    omit:
      - "access_policy=[]"
      - network_acls when network_acls.bypass=AzureServices and network_acls.default_action=Allow and network_acls.ip_rules=[] and network_acls.virtual_network_subnet_ids=[]
    defaults:
      - public_network_access_enabled=true
      - soft_delete_retention_days=90
  azurerm_log_analytics_workspace:
    # azurerm 5 replaced internet_ingestion_enabled and
    # internet_query_enabled with the *_access_type arguments.
    defaults:
      - allow_resource_only_permissions=true
      - daily_quota_gb=-1
      - internet_ingestion_access_type=Enabled
      - internet_query_access_type=Enabled
      - local_authentication_enabled=true
      - retention_in_days=30
      - sku=PerGB2018
  azurerm_storage_account:
    # public_network_access replaces public_network_access_enabled, which
    # azurerm 5 still reads; the file share retention of 7 days is the one
    # every account starts with.
    defaults:
      - access_tier=Hot
      - account_kind=StorageV2
      - allow_nested_items_to_be_public=false
      - dns_endpoint_type=Standard
      - https_traffic_only_enabled=true
      - large_file_share_enabled=false
      - local_user_enabled=true
      - min_tls_version=TLS1_2
      - public_network_access=Enabled
      - public_network_access_enabled=true
      - queue_encryption_key_type=Service
      - share_properties.retention_policy.days=7
      - shared_access_key_enabled=true
      - table_encryption_key_type=Service
