# yaml-language-server: $schema=../../schema.json
# Cloud Storage, as Cloud Asset Inventory lists it. A bucket's asset name
# is //storage.googleapis.com/<bucket>, so its ID is the bucket's name,
# which Terraform imports it by. Buckets go in gcs.tf.
provider: google
service: gcs
types:
  google_storage_bucket:
    inventory: { type: storage.googleapis.com/Bucket }
    defaults:
      - default_event_based_hold=false
      - enable_object_retention=false
      - force_destroy=false
      - hierarchical_namespace.enabled=false
      - public_access_prevention=inherited
      - requester_pays=false
      - soft_delete_policy.retention_duration_seconds=604800
      - storage_class=STANDARD
      - uniform_bucket_level_access=false
    skip:
      - reason: Cloud Functions, Cloud Run or Dataproc creates it for its own use
        attribute_prefixes: { asset.name: [gcf-sources-, gcf-v2-sources-, gcf-v2-uploads-, run-sources-, dataproc-staging-, dataproc-temp-] }
      - reason: Cloud Build creates it, as <project>_cloudbuild, for the sources gcloud builds submit uploads
        attribute_suffixes: { asset.name: [_cloudbuild] }
      # Only Google can create a bucket in the appspot.com domain.
      - reason: Container Registry creates it for the project's images
        attribute_prefixes: { asset.name: [artifacts., us.artifacts., eu.artifacts., asia.artifacts.] }
        attribute_suffixes: { asset.name: [.appspot.com] }
      - reason: App Engine creates it, as <project>.appspot.com or staging.<project>.appspot.com, with the project's app
        attribute_suffixes: { asset.name: [.appspot.com] }
      # The version label's value is always composer-<version>-airflow-<version>.
      - reason: Cloud Composer creates it for an environment's DAGs, plugins and data; select it to import it
        attribute_prefixes: { labels.goog-composer-version: [composer-] }
