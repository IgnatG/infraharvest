# yaml-language-server: $schema=../../schema.json
# IAM, as Cloud Asset Inventory lists it. A service account's asset name
# may end with its unique ID; Terraform imports it by its email, a
# searchable attribute.
provider: google
service: cloud_asset
types:
  google_service_account:
    inventory: { type: iam.googleapis.com/ServiceAccount }
    import_id:
      - "projects/{asset.project}/serviceAccounts/{asset.email}"
      - "{id}"
    skip:
      - reason: the Compute Engine default service account, which Google Cloud creates when the Compute Engine API is enabled; select it to import it
        attributes: { asset.display_name: Compute Engine default service account }
      - reason: the App Engine default service account, which Google Cloud creates with an App Engine app; select it to import it
        attributes: { asset.display_name: App Engine default service account }
  google_project_iam_custom_role:
    inventory:
      type: iam.googleapis.com/Role
      name: //iam.googleapis.com/projects/*/roles/*
  google_project_iam_member:
    # The iam service lists one grant per member of each role binding of
    # the project's IAM policy, with its role and member. Google Cloud
    # grants its service agents their roles when a service is enabled, and
    # some default service accounts roles/editor when they are created.
    service: iam
    skip:
      - reason: a service agent role, which Google Cloud grants a service's agent itself when the service is enabled; select it to import it
        ignore_case: true
        attribute_suffixes: { role: [serviceagent] }
      - reason: the Google APIs service agent's roles/editor, which Google Cloud grants it when the project is created; select it to import it
        attributes: { role: roles/editor }
        attribute_suffixes: { member: ["@cloudservices.gserviceaccount.com"] }
      - reason: the Compute Engine or App Engine default service account's roles/editor, which Google Cloud grants it when it creates the account; select it to import it
        attributes: { role: roles/editor }
        attribute_suffixes: { member: ["-compute@developer.gserviceaccount.com", "@appspot.gserviceaccount.com"] }
      - reason: the legacy Cloud Build service account's roles/cloudbuild.builds.builder, which Google Cloud grants it when the Cloud Build API is enabled; select it to import it
        attributes: { role: roles/cloudbuild.builds.builder }
        attribute_suffixes: { member: ["@cloudbuild.gserviceaccount.com"] }
      - reason: the Pub/Sub service agent's roles/iam.serviceAccountTokenCreator, which Google Cloud granted it in projects that enabled Pub/Sub before April 2021; select it to import it
        attributes: { role: roles/iam.serviceAccountTokenCreator }
        attribute_prefixes: { member: ["serviceAccount:service-"] }
        attribute_suffixes: { member: ["@gcp-sa-pubsub.iam.gserviceaccount.com"] }
      # IAM keeps a deleted principal's grants, as deleted:<member>?uid=<id>,
      # until they are removed or the principal is restored.
      - reason: a grant to a deleted principal, which no longer has it; select it to import it
        attribute_prefixes: { member: ["deleted:"] }
