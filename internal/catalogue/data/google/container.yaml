# yaml-language-server: $schema=../../schema.json
# GKE, as Cloud Asset Inventory lists it. A cluster's name has
# locations/<location> or, for some zonal clusters, zones/<zone>; the
# import IDs take the location the search returns either way. Resources
# the cloud_asset service didn't list import with their lister's ID.
# Cloud Composer labels the clusters it creates with goog-composer-*
# labels, which the search returns as the cluster's labels.
provider: google
service: cloud_asset
types:
  google_container_cluster:
    inventory: { type: container.googleapis.com/Cluster }
    import_id:
      - "projects/{asset.project}/locations/{asset.location}/clusters/{asset.name}"
      - "{id}"
    skip:
      # The version label's value is always composer-<version>-airflow-<version>;
      # a rule can't test whether a label is there whatever its value.
      - reason: Cloud Composer creates it for an environment and deletes it with the environment; select it to import it
        attribute_prefixes: { labels.goog-composer-version: [composer-] }
    # A cluster's node pools import as google_container_node_pool, so the
    # cluster leaves them, and its default pool's node_config, to those:
    # inline, they would have two owners, and a change to either would
    # replace the cluster. Both are computed, so the plan stays the same
    # without them. initial_node_count stays: the provider reads it back
    # and, unset, would plan to replace the cluster.
    # So does enable_autopilot, which an Autopilot cluster sets and which
    # can't change without replacing the cluster: GKE manages its node
    # pools, which google_container_node_pool leaves out by default.
    omit: [node_pool, node_config]
  google_container_node_pool:
    inventory: { type: container.googleapis.com/NodePool }
    import_id:
      - "{asset.project}/{asset.location}/{asset.parent|after_last:/}/{asset.name}"
      - "{id}"
    # A node pool has no labels of its own: the cloud_asset service
    # records its cluster's as asset.parent_labels.<key>, when the search
    # found the cluster too, and asset.parent_autopilot=true when the
    # cluster is an Autopilot cluster, whose pools, its default pool among
    # them, GKE manages, or unknown when the project's clusters couldn't
    # be listed. The pools node auto-provisioning adds are nap-*.
    skip:
      - reason: GKE's node auto-provisioning creates it for the cluster's workloads and deletes it when they no longer need it
        attribute_prefixes: { asset.name: [nap-] }
      - reason: a node pool of a cluster Cloud Composer created, which it deletes with the environment; select it to import it
        attribute_prefixes: { asset.parent_labels.goog-composer-version: [composer-] }
      - reason: a node pool of an Autopilot cluster, which GKE manages, creating and deleting its node pools itself
        attributes: { asset.parent_autopilot: "true" }
      - reason: GKE may manage it, as the project's clusters couldn't be listed to tell whether its cluster is an Autopilot cluster; select it to import it
        attributes: { asset.parent_autopilot: unknown }
