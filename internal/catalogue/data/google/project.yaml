# yaml-language-server: $schema=../../schema.json
# The project, as Cloud Asset Inventory lists it. Its asset name has the
# project's number (//cloudresourcemanager.googleapis.com/projects/<number>),
# which the cloud_asset service doesn't swap for the project's ID, as it
# does in the names of other resources. Terraform imports a project by its
# ID, which the service records as asset.project.
provider: google
service: cloud_asset
types:
  google_project:
    inventory: { type: cloudresourcemanager.googleapis.com/Project }
    import_id:
      - "{asset.project}"
      - "{id}"
    # A project's deletion_policy defaults to PREVENT instead.
    omit: [deletion_policy=PREVENT]
    defaults: [auto_create_network=true]
    # The curated modules name a project by its ID, alone or in a list: a
    # call takes its arguments from the resources it replaces, so it
    # refers to the project the root manages as they would.
    module_references: { attribute: project_id, arguments: [project, project_id, projects] }
