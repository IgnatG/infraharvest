# yaml-language-server: $schema=../../schema.json
provider: aws
types:
  "*":
    # region defaults to the provider's, the region the resources were
    # listed in; the provider computes tags_all from tags and default_tags,
    # also in nested blocks such as an instance's root_block_device.
    omit: [region, tags_all, "*.tags_all"]
  # The provider's other name for aws_lb, which no service lists: what the
  # engine knows of aws_lb holds for configuration that uses it.
  aws_alb:
    blocks_as_list: { block: subnet_mapping, attribute: subnet_id, argument: subnets }
    # The DNS names of Application and Network Load Balancers, with the
    # balancer's name and region: web-1234567890.eu-west-2.elb.amazonaws.com
    # and web-0123456789abcdef.elb.eu-west-2.amazonaws.com.
    named_by:
      - attribute: dns_name
        match:
          - '^(?:internal-)?(?P<name>[A-Za-z0-9-]+)-[0-9]+\.(?P<region>[a-z0-9-]+)\.elb\.amazonaws\.com$'
          - '^(?:internal-)?(?P<name>[A-Za-z0-9-]+)-[0-9a-f]+\.elb\.(?P<region>[a-z0-9-]+)\.amazonaws\.com$'
        id: "arn:{partition}:elasticloadbalancing:{region}:{account}:loadbalancer/{kind}/{name}/{lb_id}"
