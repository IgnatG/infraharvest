# yaml-language-server: $schema=../../schema.json
provider: aws
service: sns
types:
  aws_sns_topic:
    # Optional and computed, at what AWS gives a topic that doesn't set
    # them: the access policy AWS writes, which lets the account's
    # principals use the topic.
    omit:
      - signature_version=1
      - tracing_config=PassThrough
      - 'policy={"Version":"2008-10-17","Id":"__default_policy_ID","Statement":[{"Sid":"__default_statement_ID","Effect":"Allow","Principal":{"AWS":"*"},"Action":["SNS:GetTopicAttributes","SNS:SetTopicAttributes","SNS:AddPermission","SNS:RemovePermission","SNS:DeleteTopic","SNS:Subscribe","SNS:ListSubscriptionsByTopic","SNS:Publish"],"Resource":"arn:{*}:sns:{*}:{*}:{name}","Condition":{"StringEquals":{"AWS:SourceOwner":"{*}"}}}]}'
  aws_sns_topic_subscription:
    # Terraform's own settings for waiting on confirmation, which AWS
    # doesn't record.
    state_only: [confirmation_timeout_in_minutes, endpoint_auto_confirms]
