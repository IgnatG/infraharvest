# yaml-language-server: $schema=../../schema.json
provider: aws
service: kinesis
types:
  aws_kinesis_stream:
    arn: { service: kinesis, resource_type: "stream" }
    omit:
      # Computed, written back as an argument.
      - arn
      # Provisioned shards, the shard count given.
      - stream_mode_details when stream_mode_details.stream_mode=PROVISIONED
    # What AWS gives a stream that doesn't set them: records of up to
    # 1 MiB, kept for a day.
    defaults: [max_record_size_in_kib=1024, retention_period=24]
