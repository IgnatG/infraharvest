# yaml-language-server: $schema=../../schema.json
provider: aws
service: cognito
types:
  aws_cognito_user_pool:
    arn: { service: cognito-idp, resource_type: "userpool" }
  aws_cognito_user_pool_client:
    # The lister records the client ID; Terraform imports a client by its
    # user pool and its ID.
    import_id: "{user_pool_id}/{id}"
