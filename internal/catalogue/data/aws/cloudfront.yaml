# yaml-language-server: $schema=../../schema.json
provider: aws
service: cloudfront
types:
  aws_cloudfront_distribution:
    arn: { service: cloudfront, resource_type: "distribution" }
    omit:
      # The legacy TTLs CloudFront reports for a cache behaviour with a
      # cache policy, which sets its TTLs instead.
      - default_cache_behavior.default_ttl when default_cache_behavior.cache_policy_id and !default_cache_behavior.cache_policy_id=
      - default_cache_behavior.max_ttl when default_cache_behavior.cache_policy_id and !default_cache_behavior.cache_policy_id=
      - ordered_cache_behavior.default_ttl when ordered_cache_behavior.cache_policy_id and !ordered_cache_behavior.cache_policy_id=
      - ordered_cache_behavior.max_ttl when ordered_cache_behavior.cache_policy_id and !ordered_cache_behavior.cache_policy_id=
      # Fixed by CloudFront for its default certificate.
      - viewer_certificate.minimum_protocol_version when viewer_certificate.cloudfront_default_certificate=true
    # What CloudFront gives an origin that doesn't set it: no limit on
    # the time a response takes.
    defaults: [origin.response_completion_timeout=0]
    # The policies AWS manages, the same in every account, read by name.
    # An ID missing here stays a literal; one that names another policy
    # than its data source reads would change the plan, which keeps the
    # literal.
    lookups:
      - arguments: [cache_policy_id]
        names:
          658327ea-f89d-4fab-a63d-7e88639e58f6: Managed-CachingOptimized
          4135ea2d-6df8-44a3-9df3-4b5a84be39ad: Managed-CachingDisabled
          b2884449-e4de-46a7-ac36-70bc7f1ddd6d: Managed-CachingOptimizedForUncompressedObjects
          08627262-05a9-4f76-9ded-b50ca2e3a84f: Managed-Elemental-MediaPackage
          2e54312d-136d-493c-8eb9-b001f22f67d2: Managed-Amplify
        data_source: { type: aws_cloudfront_cache_policy, label: "{name|trim_prefix:Managed-}", arguments: { name: "{name}" }, attribute: id }
      - arguments: [origin_request_policy_id]
        names:
          216adef6-5c7f-47e4-b989-5492eafa07d3: Managed-AllViewer
          b689b0a8-53d0-40ab-baf2-68738e2966ac: Managed-AllViewerExceptHostHeader
          33f36d7e-f396-46d9-90e0-52428a34d9dc: Managed-AllViewerAndCloudFrontHeaders-2022-06
          59781a5b-3903-41f3-afcb-af62929ccde1: Managed-CORS-CustomOrigin
          88a5eaf4-2fd4-4709-b370-b4c650ea3fcf: Managed-CORS-S3Origin
          acba4595-bd28-49b8-b9fe-13317c0390fa: Managed-UserAgentRefererHeaders
          775133bc-15f2-49f9-abea-afb2e0bf67d2: Managed-Elemental-MediaTailor-PersonalizedManifests
        data_source: { type: aws_cloudfront_origin_request_policy, label: "{name|trim_prefix:Managed-}", arguments: { name: "{name}" }, attribute: id }
      - arguments: [response_headers_policy_id]
        names:
          60669652-455b-4ae9-85a4-c4c02393f86c: Managed-SimpleCORS
          5cc3b908-e619-4b99-88e5-2cf7f45965bd: Managed-CORS-With-Preflight
          67f7725c-6f97-4210-82d7-5512b31e9d03: Managed-SecurityHeadersPolicy
          e61eb60c-9c35-4d20-a928-2b84e02af89c: Managed-CORS-and-SecurityHeadersPolicy
          eaab4381-ed33-4a86-88ca-d9558dc6cd63: Managed-CORS-with-preflight-and-SecurityHeadersPolicy
        data_source: { type: aws_cloudfront_response_headers_policy, label: "{name|trim_prefix:Managed-}", arguments: { name: "{name}" }, attribute: id }
