# yaml-language-server: $schema=../../schema.json
provider: aws
service: cloudfront
types:
  aws_cloudfront_distribution:
    arn: { service: cloudfront, resource_type: "distribution" }
    omit:
      # The legacy TTLs CloudFront reports for a cache behaviour with a
      # cache policy, which sets its TTLs instead.
      - default_cache_behavior.default_ttl when default_cache_behavior.cache_policy_id and !default_cache_behavior.cache_policy_id=
      - default_cache_behavior.max_ttl when default_cache_behavior.cache_policy_id and !default_cache_behavior.cache_policy_id=
      - ordered_cache_behavior.default_ttl when ordered_cache_behavior.cache_policy_id and !ordered_cache_behavior.cache_policy_id=
      - ordered_cache_behavior.max_ttl when ordered_cache_behavior.cache_policy_id and !ordered_cache_behavior.cache_policy_id=
      # Fixed by CloudFront for its default certificate.
      - viewer_certificate.minimum_protocol_version when viewer_certificate.cloudfront_default_certificate=true
    # What CloudFront gives an origin that doesn't set it: no limit on
    # the time a response takes.
    defaults: [origin.response_completion_timeout=0]
