# yaml-language-server: $schema=../../schema.json
provider: aws
service: ec2_instance
types:
  aws_instance:
    arn: { service: ec2, resource_type: "instance" }
    omit:
      # The network interface the instance was launched with, which AWS
      # reports and the provider computes; set, it conflicts with subnet_id,
      # private_ip and the security groups the generated configuration has.
      - primary_network_interface
      # The subnet's zone.
      - availability_zone when subnet_id
      # gp3's baseline performance.
      - root_block_device.iops=3000 when root_block_device.volume_type=gp3
      - root_block_device.throughput=125 when root_block_device.volume_type=gp3
      # The instance type's default cores and threads, or a type CPU
      # options can't be set for: the lister compares them with
      # DescribeInstanceTypes.
      - cpu_options when @cpu_options=default
      # The credit option each burstable family launches with.
      - credit_specification when instance_type=t2.{*} and credit_specification.cpu_credits=standard
      - credit_specification when instance_type=t3.{*} and credit_specification.cpu_credits=unlimited
      - credit_specification when instance_type=t3a.{*} and credit_specification.cpu_credits=unlimited
      - credit_specification when instance_type=t4g.{*} and credit_specification.cpu_credits=unlimited
    # What AWS gives an instance that doesn't set them: the launch API's
    # defaults. Blocks they leave empty go too.
    defaults:
      - capacity_reservation_specification.capacity_reservation_preference=open
      - disable_api_stop=false
      - disable_api_termination=false
      - ebs_optimized=false
      - enable_primary_ipv6=false
      - enclave_options.enabled=false
      - instance_initiated_shutdown_behavior=stop
      - ipv6_address_count=0
      - maintenance_options.auto_recovery=default
      - metadata_options.instance_metadata_tags=disabled
      - monitoring=false
      - placement_partition_number=0
      - private_dns_name_options.enable_resource_name_dns_a_record=false
      - private_dns_name_options.enable_resource_name_dns_aaaa_record=false
      - private_dns_name_options.hostname_type=ip-name
      - tenancy=default
