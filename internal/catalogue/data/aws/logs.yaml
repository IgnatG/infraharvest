# yaml-language-server: $schema=../../schema.json
# The logs service records a log group's retention and KMS key when it has
# them, and as_created "true" when it has neither, as Lambda creates the
# group of a function that logs before anything else creates it.
provider: aws
service: logs
types:
  aws_cloudwatch_log_group:
    cloudformation_types:
      - { type: "AWS::Logs::LogGroup", also: [aws_cloudwatch_log_data_protection_policy] }
    resource_explorer: arn
    arn: { service: logs, resource_type: "log-group" }
    # What AWS gives a log group that doesn't set them.
    defaults: [deletion_protection_enabled=false, log_group_class=STANDARD]
    skip:
      # A group of a function's name that sets retention or a KMS key was
      # created for it, usually in Terraform before the function, and is
      # imported.
      - reason: a function's log group as Lambda creates it when the function first logs, without retention or encryption; select it to import it
        id_prefixes: [/aws/lambda/]
        attributes: { as_created: "true" }
      # API Gateway names and creates the group of a stage's execution
      # logs, which can't be chosen.
      - reason: a stage's execution log group as API Gateway creates it when execution logging is turned on, without retention or encryption; select it to import it
        id_prefixes: [API-Gateway-Execution-Logs_]
        attributes: { as_created: "true" }
      # RDS streams each exported log type to /aws/rds/instance/<name>/<type>
      # (or /aws/rds/cluster/...), a group users often create for retention.
      - reason: a database's log export group as RDS creates it when a log type is exported, without retention or encryption; select it to import it
        id_prefixes: [/aws/rds/]
        attributes: { as_created: "true" }
      # EKS sends control plane logs to /aws/eks/<cluster>/cluster, a group
      # users often create in Terraform with a retention first.
      - reason: a cluster's control plane log group as EKS creates it when control plane logging is turned on, without retention or encryption; select it to import it
        id_prefixes: [/aws/eks/]
        attributes: { as_created: "true" }
