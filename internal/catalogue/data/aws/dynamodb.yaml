# yaml-language-server: $schema=../../schema.json
provider: aws
service: dynamodb
types:
  aws_dynamodb_table:
    cloudformation_types: ["AWS::DynamoDB::GlobalTable", "AWS::DynamoDB::Table"]
    resource_explorer: arn
    arn: { service: dynamodb, resource_type: "table" }
    omit:
      # The capacity AWS reports for an on-demand table and its indexes.
      - read_capacity=0 when billing_mode=PAY_PER_REQUEST
      - write_capacity=0 when billing_mode=PAY_PER_REQUEST
      - global_secondary_index.read_capacity=0 when billing_mode=PAY_PER_REQUEST
      - global_secondary_index.write_capacity=0 when billing_mode=PAY_PER_REQUEST
      # Optional and computed, at what AWS gives a table that doesn't set
      # them: no point-in-time recovery or TTL, and encryption with a key
      # DynamoDB owns.
      - point_in_time_recovery when point_in_time_recovery.enabled=false
      - server_side_encryption when server_side_encryption.enabled=false
      - ttl when ttl.enabled=false
    defaults: [table_class=STANDARD]
