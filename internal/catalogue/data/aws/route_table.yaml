# yaml-language-server: $schema=../../schema.json
provider: aws
service: route_table
types:
  aws_main_route_table_association:
    not_importable: Terraform can't import it; the VPC's main_route_table_id records the main route table.
  aws_route_table:
    arn: { service: ec2, resource_type: "route-table" }
    data_source: { type: aws_route_table, argument: route_table_id }
    skip:
      # Imported, it would be a route table without routes: configuration
      # that refers to it reads it through the data source.
      - reason: the main route table AWS creates with every VPC, unchanged, with only the VPC's local routes; the VPC records it as its main_route_table_id
        attributes: { main: "true", as_created: "true" }
  aws_route_table_association:
    # A subnet's association, or a gateway's (an edge association).
    import_id:
      - "{subnet_id}/{route_table_id}"
      - "{gateway_id}/{route_table_id}"
