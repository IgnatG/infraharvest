# yaml-language-server: $schema=../../schema.json
provider: aws
service: eip
types:
  aws_eip:
    arn: { service: ec2, resource_type: "elastic-ip" }
    # The region's network border group, which AWS gives an address that
    # sets none.
    omit: ["network_border_group={region}"]
    # What AWS gives an address that doesn't set them: for use in a VPC,
    # from Amazon's pool.
    defaults: [domain=vpc, public_ipv4_pool=amazon]
