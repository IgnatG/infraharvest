# yaml-language-server: $schema=../../schema.json
provider: aws
service: api_gatewayv2
types:
  aws_apigatewayv2_api:
    arn: { service: apigateway, resource_type: "apis" }
    # Optional and computed, at the default AWS reports.
    omit: [ip_address_type=ipv4]
  aws_apigatewayv2_integration:
    # The timeout AWS gives an HTTP API's integration that sets none.
    omit: [timeout_milliseconds=30000]
  aws_apigatewayv2_stage:
    omit:
      # A stage that deploys itself points at the latest deployment, which
      # AWS reports; set, it pins the deployment the import found.
      - deployment_id when auto_deploy=true
      # Optional and computed, at the default AWS reports.
      - default_route_settings.logging_level=OFF
