# yaml-language-server: $schema=../../schema.json
provider: aws
service: lambda
types:
  aws_lambda_function:
    arn: { service: lambda, resource_type: "function" }
    # Imported by ARN, the generated configuration names the function by
    # its ARN, and the provider plans to replace it.
    import_id: "{function_name}"
    omit:
      # The hash of the code deployed, which AWS reports; set, it is what
      # makes the provider update the code.
      - code_sha256
      # Optional and computed, at what AWS gives a function that doesn't
      # set them: logs in text to /aws/lambda/<function>.
      - architectures=["x86_64"]
      - ephemeral_storage when ephemeral_storage.size=512
      - logging_config when logging_config.log_format=Text and logging_config.log_group=/aws/lambda/{function_name}
      - tracing_config when tracing_config.mode=PassThrough
    # AWS doesn't say where a zip package came from, and Terraform can't
    # read it back.
    placeholder:
      one_of: [filename, image_uri, s3_bucket]
      set: { filename: "lambda/{function_name}.zip" }
      ignore: [filename, code_sha256]
      reason: "the function's code is deployed outside Terraform; filename is a placeholder. To deploy it with Terraform, put the package there, set code_sha256 to its filebase64sha256, which is what makes the provider update the code when the package changes, and remove this"
  aws_lambda_permission:
    import_id: "{function_name}/{statement_id}"
