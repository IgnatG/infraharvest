# yaml-language-server: $schema=../../schema.json
provider: aws
service: auto_scaling
types:
  aws_autoscaling_group:
    arn: { service: autoscaling, resource_type: "autoScalingGroup" }
    state_only: [force_delete, force_delete_warm_pool, ignore_failed_scaling_activities, wait_for_capacity_timeout]
  aws_launch_template:
    arn: { service: ec2, resource_type: "launch-template" }
    # A key no root manages, as the AWS-managed key of EBS encryption: the
    # plan checks it is that key.
    lookups:
      - arguments: [kms_key_id]
        match: '^arn:aws[a-z-]*:kms:[a-z0-9-]+:[0-9]{12}:key/[0-9a-f-]{36}$'
        data_source: { type: aws_kms_alias, label: ebs, arguments: { name: alias/aws/ebs }, attribute: target_key_arn }
