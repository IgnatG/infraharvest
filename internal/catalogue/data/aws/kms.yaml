# yaml-language-server: $schema=../../schema.json
provider: aws
service: kms
types:
  aws_kms_alias: {}
  aws_kms_key:
    arn: { service: kms, resource_type: "key" }
    data_source: { type: aws_kms_key, argument: key_id }
    omit:
      # Optional and computed, at what AWS gives a key that doesn't set
      # them: a single-region key, rotated yearly when rotation is on, and
      # the default key policy, which lets the account's IAM policies
      # grant access to it.
      - multi_region=false
      - rotation_period_in_days=365
      - 'policy={"Version":"2012-10-17","Id":"key-default-1","Statement":[{"Sid":"Enable IAM User Permissions","Effect":"Allow","Principal":{"AWS":"arn:{*}:iam::{*}:root"},"Action":"kms:*","Resource":"*"}]}'
