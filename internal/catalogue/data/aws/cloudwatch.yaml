# yaml-language-server: $schema=../../schema.json
provider: aws
service: cloudwatch
types:
  aws_cloudwatch_event_rule:
    arn: { service: events, resource_type: "rule" }
    # Deprecated in favour of state, which conflicts with it.
    omit: [is_enabled]
    # What AWS gives a rule that doesn't set them.
    defaults: [event_bus_name=default, state=ENABLED]
  aws_cloudwatch_metric_alarm:
    arn: { service: cloudwatch, resource_type: "alarm" }
