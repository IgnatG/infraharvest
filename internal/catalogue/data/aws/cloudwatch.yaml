# yaml-language-server: $schema=../../schema.json
provider: aws
service: cloudwatch
types:
  aws_cloudwatch_event_rule:
    cloudformation_types: ["AWS::Events::Rule"]
    arn: { service: events, resource_type: "rule" }
    # Deprecated in favour of state, which conflicts with it.
    omit: [is_enabled]
    # What AWS gives a rule that doesn't set them.
    defaults: [event_bus_name=default, state=ENABLED]
    skip:
      - reason: a rule another AWS service manages, which only that service can change
        attributes_present: [managed_by]
  aws_cloudwatch_metric_alarm:
    cloudformation_types: ["AWS::CloudWatch::Alarm"]
    arn: { service: cloudwatch, resource_type: "alarm" }
    # What AWS gives an alarm that doesn't set them: actions on, and
    # missing data treated as missing.
    defaults: [actions_enabled=true, treat_missing_data=missing]
    skip:
      - reason: an alarm a target tracking scaling policy creates and manages
        id_prefixes: [TargetTracking-]
