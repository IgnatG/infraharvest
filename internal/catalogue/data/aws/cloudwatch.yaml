# yaml-language-server: $schema=../../schema.json
provider: aws
service: cloudwatch
types:
  aws_cloudwatch_event_rule:
    arn: { service: events, resource_type: "rule" }
    # Deprecated in favour of state, which conflicts with it, and state at
    # what AWS gives a rule that doesn't set it.
    omit: [is_enabled, state=ENABLED]
  aws_cloudwatch_metric_alarm:
    arn: { service: cloudwatch, resource_type: "alarm" }
